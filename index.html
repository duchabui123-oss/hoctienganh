root.addEventListener('submit',async e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='f-login'){await doLogin();return}
  if(id==='f-signup'){await doSignup();return}
  if(id==='quick'){await submitQuick();return}
  if(id==='f-me'){
    const m=$('m-msg'),name=$('m-name').value.trim();
    if(!name){m.className='msg';m.textContent='Hãy nhập họ tên.';return}
    try{await updateDoc(doc(db,'users',S.user.uid),{name:name,unit:$('m-unit').value.trim()});m.className='msg ok';m.textContent='Đã lưu.'}
    catch(err){m.className='msg';m.textContent=fsMsg(err)}return;
  }
  if(id==='f-pw'){
    const m=$('p-msg'),o=$('p-old').value,n1=$('p-new').value,n2=$('p-new2').value;
    m.className='msg';
    if(n1.length<6){m.textContent='Mật khẩu mới cần tối thiểu 6 ký tự.';return}
    if(n1!==n2){m.textContent='Hai lần nhập mật khẩu mới chưa giống nhau.';return}
    try{
      const cred=EmailAuthProvider.credential(auth.currentUser.email,o);
      await reauthenticateWithCredential(auth.currentUser,cred);
      await updatePassword(auth.currentUser,n1);
      $('f-pw').reset();m.className='msg ok';m.textContent='Đã đổi mật khẩu.';
    }catch(err){m.textContent=authMsg(err)}
    return;
  }
  if(id==='f-adduser'){
    const m=$('u-msg');m.className='msg';
    const name=$('u-name').value.trim(),user=normUser($('u-user').value),pass=$('u-pass').value,unit=$('u-unit').value.trim(),role=$('u-role').value;
    if(!name){m.textContent='Hãy nhập họ tên.';return}
    if(!userOk(user)){m.textContent=USER_HINT;return}
    if(pass.length<6){m.textContent='Mật khẩu cần tối thiểu 6 ký tự.';return}
    const pg=[...document.querySelectorAll('#u-gchips input:checked')].map(i=>i.value),ps=[...document.querySelectorAll('#u-schips input:checked')].map(i=>i.value);
    if(pg.length>5){m.textContent='Mỗi người chọn tối đa 5 nhóm.';return}
    m.textContent='Đang tạo…';
    try{await createUserAsAdmin(name,user,pass,unit,role,pg,ps);$('f-adduser').reset();renderAddUserChips();m.className='msg ok';m.textContent='Đã tạo tài khoản "'+user+'". Hãy gửi tên đăng nhập và mật khẩu cho người dùng.'}
    catch(err){m.className='msg';m.textContent=authMsg(err)}
    return;
  }
  if(id==='f-addunit'){
    const n=$('add-unit').value.trim().replace(/\s+/g,' ');if(!n)return;
    if(S.units.some(x=>x.name.toLowerCase()===n.toLowerCase())){flash('Đơn vị tính này đã có trong danh sách.');return}
    try{await saveUnits(S.units.concat({id:newId(),name:n,active:true}));$('add-unit').value=''}catch(err){flash(fsMsg(err))}
    return;
  }
  if(id==='f-addtpl'){
    const n=$('t-name').value.trim().replace(/\s+/g,' ');if(!n)return;
    if(S.tpls.some(x=>x.name.trim().toLowerCase()===n.toLowerCase())){flash('Việc mẫu này đã có trong danh sách.');return}
    try{await saveTpls(tplsWith({id:newId(),name:n,system:$('t-system').value,type:$('t-type').value,label:$('t-label').value.trim(),unit:$('t-unit').value,noQty:$('t-noq').checked,groups:[...document.querySelectorAll('#t-gchips input:checked')].map(i=>i.dataset.tgnew),active:true}));document.querySelectorAll('#t-gchips input').forEach(i=>{i.checked=false});$('t-name').value='';$('t-label').value='';$('t-unit').value='';$('t-noq').checked=false;$('t-name').focus()}
    catch(err){flash(fsMsg(err))}
    return;
  }
  if(e.target.dataset&&e.target.dataset.add){
    const kind=e.target.dataset.add,inp=e.target.querySelector('input'),name=inp.value.trim();if(!name)return;
    const l=S[kind],order=l.length?Math.max.apply(null,l.map(x=>x.order||0))+1:1;
    try{await setDoc(doc(collection(db,kind)),{name:name,order:order,active:true});inp.value=''}
    catch(err){flash(fsMsg(err))}
  }
});

/* ===== Khởi động ===== */
async function start(){
  if(!isConfigured){showSetup();return}
  let app;
  try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}
  catch(e){showSetup();return}
  onAuthStateChanged(auth,async user=>{
    if(S.busyAuth)return;
    teardown();
    if(!user){
      S.user=null;S.profile=null;S.publicSignup=false;S.settingsReady=false;S.bkHide=false;updateNotices();
      try{const s=await getDoc(doc(db,'settings','app'));S.publicSignup=s.exists()&&!!s.data().allowSignup}catch(e){}
      showLogin();return;
    }
    await enterApp(user);
  });
}
async function enterApp(user){
  S.user=user;
  try{
    const snap=await getDoc(doc(db,'users',user.uid));
    if(!snap.exists()){showBlocked('Tài khoản chưa được kích hoạt hoặc đã được quản trị viên cấp lại mật khẩu. Hãy đăng nhập bằng mật khẩu mới hoặc liên hệ quản trị viên.');return}
    const p=snap.data();
    if(p.active===false){showBlocked('Tài khoản đã bị khóa. Hãy liên hệ quản trị viên.');return}
    S.profile=Object.assign({uid:user.uid},p);
    await boot();
  }catch(e){showBlocked('Không đọc được thông tin tài khoản. Hãy kiểm tra mạng rồi tải lại trang.')}
}
start();
