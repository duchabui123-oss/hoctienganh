<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Tiếng Anh Nhà Mình</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="Trang học tiếng Anh của gia đình"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232747C9'/%3E%3Crect x='42' y='42' width='20' height='20' rx='6' fill='%23FFE356'/%3E%3Ctext x='30' y='42' font-family='Arial' font-weight='700' font-size='28' fill='white' text-anchor='middle'%3EAa%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap"><style id="site-css">/* Layout: notebook app — sticky top bar, tree sidebar on the left, one reading column; highlighter motif marks formulas and headings */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#EAF0FA; --ink:#17203A; --muted:#58637F; --line:#D9E0EE;
  --accent:#2747C9; --accent-soft:#E3E9FF; --accent-ink:#FFFFFF;
  --hl:#FFE356; --hl-soft:#FFF3A8; --hl-ink:#3B2F00;
  --ok:#11845A; --ok-soft:#DDF4EA; --danger:#BE3535; --danger-soft:#FBE5E5; --warn:#A35A12; --warn-soft:#FDEBD6;
  --pos:#11845A; --neg:#BE3535; --q:#7A4BC4;
  --shadow:0 1px 2px rgba(23,32,58,.06),0 4px 16px rgba(23,32,58,.06);
  --h1:#2747C9; --h2:#0E8A7E; --h3:#C2410C; --h4:#7A4BC4; --h5:#B4237A; --h6:#2F7D32; --h7:#A16207; --h8:#D23F3F;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --fs:16px; --side:290px; --bar:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1321; --surface:#151D2F; --surface-2:#1C263D; --ink:#E6EBF6; --muted:#9BA6C2; --line:#29344E;
  --accent:#8EA7FF; --accent-soft:#232F55; --accent-ink:#0D1321;
  --hl:#E5C942; --hl-soft:#4A3F12; --hl-ink:#1F1800;
  --ok:#4CC48F; --ok-soft:#173A2C; --danger:#F07F7F; --danger-soft:#3D1F24; --warn:#F0A65E; --warn-soft:#3A2A17;
  --pos:#4CC48F; --neg:#F07F7F; --q:#B99BF0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --h1:#8EA7FF; --h2:#4CCFC0; --h3:#FF9A62; --h4:#B99BF0; --h5:#F27BBE; --h6:#7BCB7F; --h7:#E7B84C; --h8:#FF8A8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1321; --surface:#151D2F; --surface-2:#1C263D; --ink:#E6EBF6; --muted:#9BA6C2; --line:#29344E;
  --accent:#8EA7FF; --accent-soft:#232F55; --accent-ink:#0D1321;
  --hl:#E5C942; --hl-soft:#4A3F12; --hl-ink:#1F1800;
  --ok:#4CC48F; --ok-soft:#173A2C; --danger:#F07F7F; --danger-soft:#3D1F24; --warn:#F0A65E; --warn-soft:#3A2A17;
  --pos:#4CC48F; --neg:#F07F7F; --q:#B99BF0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --h1:#8EA7FF; --h2:#4CCFC0; --h3:#FF9A62; --h4:#B99BF0; --h5:#F27BBE; --h6:#7BCB7F; --h7:#E7B84C; --h8:#FF8A8A; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:12px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.logo{--k:var(--h1);width:42px;height:42px;flex:none;border-radius:13px;background:var(--k);color:var(--surface);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.5px;position:relative;overflow:visible}
.brand .logo{--k:inherit}
.logo::after{content:"";position:absolute;right:-4px;bottom:-4px;width:15px;height:15px;border-radius:5px;background:var(--hl);border:2px solid var(--surface)}
.logo.has-img{background:var(--surface);border:1px solid var(--line)}
.logo.has-img::after{display:none}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.brand-t{min-width:0}
.brand-name{display:block;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{position:relative}
.search input{width:min(300px,34vw);height:40px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);padding:0 14px 0 38px}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--muted)}
.ibtn{height:40px;min-width:40px;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;cursor:pointer}
.ibtn:hover{border-color:var(--accent)}
.ibtn svg{width:18px;height:18px}
.btn{height:40px;border:1px solid transparent;border-radius:12px;padding:0 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-p:hover{filter:brightness(1.08)}
.btn-g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-g:hover{border-color:var(--accent)}
.btn-d{background:var(--danger-soft);color:var(--danger)}
.btn-ok{background:var(--ok-soft);color:var(--ok)}
.btn-sm{height:32px;padding:0 10px;border-radius:9px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.only-m{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);max-width:1440px;margin:0 auto;min-height:calc(100vh - var(--bar))}
.side{border-right:1px solid var(--line);padding:18px 14px 40px;position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow-y:auto;
  padding-left:max(14px,env(safe-area-inset-left,0px))}
.main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:820px;margin:0 auto}

/* progress */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted)}
.prog-top b{font-family:var(--f-display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}

/* tree */
.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:12px;margin-left:12px;border-left:1.5px dashed var(--line)}
.t-row{display:flex;align-items:center;gap:4px;border-radius:10px}
.t-link{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.t-link:hover{background:var(--surface-2)}
.t-link.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.t-l1>.t-row .t-link{font-family:var(--f-display);font-weight:700;font-size:16.5px;margin-top:8px}
.t-tog{width:28px;height:28px;flex:none;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.t-tog:hover{background:var(--surface-2)}
.t-tog svg{width:16px;height:16px;transition:transform .2s}
.t-tog[aria-expanded="false"] svg{transform:rotate(-90deg)}
.t-sp{width:28px;flex:none}
.dot{width:16px;height:16px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.done::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- reading ---------- */
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--accent);text-decoration:underline}
.crumb span[aria-hidden]{opacity:.5}
h1.title{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 6px;text-wrap:balance;letter-spacing:-.3px}
.meta{font-size:13px;color:var(--muted);margin-bottom:22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

.prose{font-size:var(--fs);line-height:1.72}
.prose>*:first-child{margin-top:0}
.prose p{margin:0 0 14px}
.prose h2{font-family:var(--f-display);font-size:1.6em;line-height:1.2;margin:32px 0 12px;text-wrap:balance}
.prose h3{font-family:var(--f-display);font-weight:700;font-size:1.32em;line-height:1.25;margin:30px 0 12px;text-wrap:balance}
.prose h3 span.hl,.prose h3{background:linear-gradient(transparent 62%,var(--hl-soft) 62%);display:table;padding-right:4px}
.prose h4{font-size:1em;font-weight:700;margin:20px 0 8px;color:var(--accent)}
.prose ul,.prose ol{padding-left:1.4em;margin:0 0 16px}
.prose li{margin:4px 0}
.prose li>ul,.prose li>ol{margin:4px 0}
.prose ul ul{list-style:circle}
.prose strong{font-weight:700}
.prose mark{background:var(--hl);color:var(--hl-ink);padding:0 3px;border-radius:3px}
.prose a{text-underline-offset:3px}
.prose .lead{font-size:1.08em;color:var(--muted);border-left:4px solid var(--hl);padding:4px 0 4px 14px}
.prose .note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 16px}
.prose .note::before{content:"Ghi chú  ";font-weight:700;color:var(--warn)}
.formula,.prose .formula{font-family:var(--f-mono);font-weight:500;font-size:.95em;background:var(--hl-soft);color:var(--ink);border:1.5px dashed var(--hl);
  border-radius:12px;padding:12px 16px;margin:0 0 16px;overflow-x:auto}
.prose .formula strong{color:var(--accent)}
.table-wrap{overflow-x:auto;margin:6px 0 24px;border:1.5px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:16px;background:var(--surface);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 10%,transparent),0 6px 18px rgba(23,32,58,.06)}
.prose table{border-collapse:separate;border-spacing:0;width:100%;font-size:.94em;line-height:1.55}
.prose thead th{background:var(--accent);color:var(--accent-ink);text-align:left;font-weight:700;font-size:.92em;letter-spacing:.02em;padding:11px 14px;vertical-align:bottom;border:0}
.prose thead th strong,.prose thead th b{color:inherit}
.prose thead th+th{border-left:1px solid color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.prose tbody th{background:var(--surface-2);text-align:left;padding:10px 14px}
.prose td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.prose tbody tr:first-child td{border-top:0}
.prose td+td{border-left:1px solid var(--line)}
.prose tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.prose tbody tr:hover td{background:color-mix(in srgb,var(--hl) 22%,var(--surface))}
.prose table:not(:has(td[rowspan])) tbody td:first-child{font-weight:600}
.prose table:not(:has(td[rowspan])) tbody td:first-child strong,.prose table:not(:has(td[rowspan])) tbody td:first-child b{color:var(--accent)}
.prose td strong{color:var(--ink)}
.prose table.say1 td:first-child strong,.prose table.say2 td:nth-child(2) strong,.prose table.say3 td:nth-child(-n+3){color:var(--accent);font-weight:700}
.prose table.say2 td:first-child,.prose table.say3 td:first-child{font-weight:600}
.prose td:first-child:has(> b:only-child){width:1%;white-space:nowrap;text-align:center;color:var(--muted)}
.prose td:first-child > b:only-child{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:.9em;font-variant-numeric:tabular-nums}
.prose td[rowspan]{background:color-mix(in srgb,var(--accent) 7%,var(--surface))!important;font-weight:700;color:var(--accent)}
.prose tr.reading td{background:var(--hl-soft)!important}
.sign{display:inline-block;font-family:var(--f-mono);font-weight:700;border-radius:6px;padding:0 6px;margin-right:4px}
.sign.pos{background:var(--ok-soft);color:var(--pos)}
.sign.neg{background:var(--danger-soft);color:var(--neg)}
.sign.q{background:color-mix(in srgb,var(--q) 18%,transparent);color:var(--q)}
.prose figure{margin:8px 0 24px}
.prose figure img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.prose figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.prose img{max-width:100%;height:auto}
.prose blockquote{margin:0 0 16px;padding:8px 16px;border-left:4px solid var(--accent);background:var(--surface-2);border-radius:0 12px 12px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.article{padding:clamp(18px,4vw,40px)}
.done-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:28px;padding-top:20px;border-top:1px dashed var(--line)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pn a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.pn a:hover{border-color:var(--accent)}
.pn small{display:block;color:var(--muted);font-size:12.5px}
.pn b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn .nx{text-align:right;grid-column:2}

.sub-h{font-family:var(--f-display);font-weight:700;font-size:20px;margin:34px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-decoration:none;color:var(--ink);min-width:0}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile b{font-weight:700;line-height:1.35}
.tile small{color:var(--muted);font-size:13px}
.tile .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}

.hero{--k:var(--h1);position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;margin-bottom:22px;
  padding:clamp(22px,4vw,34px) clamp(20px,4vw,38px);border-radius:24px;overflow:hidden;
  background:color-mix(in srgb,var(--k) 8%,var(--surface));border:1.5px solid color-mix(in srgb,var(--k) 22%,var(--line))}
.hero::before{content:"";position:absolute;inset:0 0 0 45%;pointer-events:none;
  background-image:radial-gradient(color-mix(in srgb,var(--k) 22%,transparent) 1.4px,transparent 1.6px);background-size:18px 18px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}
.hero-txt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.hero-kick{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--k);background:var(--surface);border:1px solid color-mix(in srgb,var(--k) 30%,transparent);padding:3px 11px;border-radius:99px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.2vw,40px);line-height:1.08;margin:2px 0 0;color:var(--ink);text-wrap:balance;letter-spacing:-.4px}
.hero p{margin:0;color:var(--muted);font-size:1.05em;max-width:46ch}
.hero-act{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:10px}
.hero .hero-btn{height:auto;min-height:46px;padding:9px 12px 9px 18px;border-radius:14px;background:var(--k);color:var(--surface);white-space:normal;text-align:left;line-height:1.3;gap:12px}
.hero .hero-btn b{font-weight:800}
.hero .hero-btn svg{flex:none;width:30px;height:30px;padding:8px;border-radius:9px;background:color-mix(in srgb,var(--surface) 22%,transparent)}
.hero .hero-btn:hover{filter:brightness(1.07)}
.hero-prog{display:flex;flex-direction:column;gap:5px;min-width:150px}
.hero-meter{display:block;height:7px;border-radius:9px;background:color-mix(in srgb,var(--k) 15%,var(--surface));overflow:hidden}
.hero-meter i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.hero-prog small{font-size:13px;color:var(--muted)}
.hero-prog b{color:var(--ink);font-variant-numeric:tabular-nums}
.hero-tiles{position:relative;display:flex;align-items:center;padding:6px 6px 6px 0}
.ht{width:76px;height:84px;margin-left:-8px;border-radius:16px;display:grid;place-items:center;background:var(--surface);color:var(--k);
  border:2px solid color-mix(in srgb,var(--k) 35%,var(--line));box-shadow:0 6px 0 color-mix(in srgb,var(--k) 25%,var(--line)),0 14px 24px rgba(15,25,60,.08);
  font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1;transform:rotate(-7deg)}
.ht1{transform:rotate(5deg) translateY(-8px);background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.ht2{transform:rotate(-3deg) translateY(6px)}
.ht3{transform:rotate(8deg) translateY(-4px)}
.ht4{transform:rotate(-5deg) translateY(4px)}
.hero-tiles.n4 .ht,.hero-tiles.n5 .ht{width:62px;height:70px;font-size:38px}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero::before{inset:0 0 40% 30%}.hero-tiles{order:-1;padding:0 0 4px 8px}.ht{width:48px;height:54px;font-size:28px;border-radius:12px}.hero-tiles.n4 .ht,.hero-tiles.n5 .ht{width:42px;height:48px;font-size:24px}}
.sec{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h a{font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--ink);text-decoration:none}
.sec-h a:hover{color:var(--accent)}
.sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sec li a{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px}
.sec li a:hover{background:var(--surface-2)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.res{display:flex;flex-direction:column;gap:10px}
.res a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink)}
.res a:hover{border-color:var(--accent)}
.res small{color:var(--muted)}
.res p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.res mark{background:var(--hl);color:var(--hl-ink);border-radius:3px}

/* speak bubble */
.speak{position:absolute;z-index:70;display:flex;gap:4px;padding:4px;background:var(--ink);border-radius:12px;box-shadow:var(--shadow)}
.speak button{border:0;background:none;color:var(--bg);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;cursor:pointer}
.speak button:hover{background:rgba(127,127,127,.25)}
.speak svg{width:16px;height:16px}

.sc-body{display:flex;flex-direction:column;gap:14px;padding:16px 20px 18px;
  background-image:repeating-linear-gradient(transparent 0 27px,color-mix(in srgb,var(--k) 7%,transparent) 27px 28px)}
.prose .sc-tip,.sc-tip{margin:0;padding:12px 20px 14px 46px;position:relative;background:var(--hl-soft);color:var(--ink);font-size:.95em;border-top:1px solid color-mix(in srgb,var(--hl) 60%,transparent)}
.sc-tip::before{content:"!";position:absolute;left:18px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--hl);color:var(--hl-ink);font-weight:800;font-size:13px;display:grid;place-items:center}
.prose .sc-label,.sc-label{margin:2px 0 -6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}

.sc-cell{display:flex;flex-direction:column;gap:4px;padding:11px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--k);min-width:0}

.sc-txt{display:block}
.sc-ex{display:block;color:var(--muted);font-size:.93em;font-style:italic}
.sc-ex b{font-style:normal;color:var(--ink)}
.sc-code{font-family:var(--f-mono);font-size:.92em;font-weight:500;background:var(--hl-soft);color:var(--ink);padding:2px 8px;border-radius:7px;border:1px dashed var(--hl);white-space:normal;display:inline-block}

.sc-forms{display:flex;flex-direction:column;gap:8px}
.sc-f{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.sc-f .sc-ex{grid-column:2}
.sc-sign{font-family:var(--f-mono);font-weight:800;font-size:.85em;border-radius:7px;padding:2px 7px;text-align:center;min-width:42px}
.sc-sign.pos{background:var(--ok-soft);color:var(--pos)}.sc-sign.neg{background:var(--danger-soft);color:var(--neg)}
.sc-sign.q{background:color-mix(in srgb,var(--q) 18%,transparent);color:var(--q)}.sc-sign.wh{background:var(--accent-soft);color:var(--accent)}
.sc-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc-chip{display:inline-block;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--k) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--k) 30%,transparent);font-size:.92em}
.sc-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.sc-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line)}
.sc-tile b{font-family:var(--f-display);font-weight:800;font-size:1.6em;line-height:1;color:var(--k)}
.sc-tile small{font-size:.8em;color:var(--muted)}
.sc-tile.v{background:var(--hl-soft);border-color:var(--hl)}
.sc-tile.v b{color:var(--hl-ink)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sc-tile.v b{color:var(--ink)}}
.sc-sent,.sc-pat{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.sc-w{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px 5px;border-radius:12px;background:color-mix(in srgb,var(--k) 14%,var(--surface));border-bottom:3px solid var(--k)}

.sc-w small{font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--k)}

.sc-pats{display:flex;flex-direction:column;gap:8px}

.dlg-back{position:fixed;inset:0;z-index:90;background:rgba(10,15,30,.45);display:grid;place-items:center;padding:16px}

t":"cau-truc-cau","order":1},{"id":"dat-cau-hoi","title":"Cách đặt câu hỏi","parent":"cau-truc-cau","order":2},{"id":"cau-phu-dinh","title":"Câu phủ định","parent":"cau-truc-cau","order":3},{"id":"menh-lenh","title":"Mệnh lệnh và yêu cầu","parent":"cau-truc-cau","order":4},{"id":"cac-thi","title":"5. Các thì trong tiếng Anh","parent":"ngu-phap","order":4},{"id":"hien-tai-don","title":"Hiện tại đơn (Present Simple Tense)","parent":"cac-thi","order":0},{"id":"hien-tai-tiep-dien","title":"Hiện tại tiếp diễn (Present Continuous Tense)","parent":"cac-thi","order":1},{"id":"qua-khu-don","title":"Quá khứ đơn (Past Simple Tense)","parent":"cac-thi","order":2},{"id":"tuong-lai-don","title":"Tương lai đơn (Future Simple Tense)","parent":"cac-thi","order":3},{"id":"tuong-lai-gan","title":"Tương lai gần (Be going to)","parent":"cac-thi","order":4},{"id":"hien-tai-hoan-thanh","title":"Hiện tại hoàn thành (Present Perfect Tense)","parent":"cac-thi","order":5},{"id":"qua-khu-tiep-dien","title":"Quá khứ tiếp diễn (Past Continuous Tense)","parent":"cac-thi","order":6},{"id":"qua-khu-hoan-thanh","title":"Quá khứ hoàn thành (Past Perfect)","parent":"cac-thi","order":7},{"id":"htht-tiep-dien","title":"Hiện tại hoàn thành tiếp diễn (Present Perfect Continuous)","parent":"cac-thi","order":8},{"id":"tuong-lai-hoan-thanh","title":"Tương lai hoàn thành (Future Perfect)","parent":"cac-thi","order":9},{"id":"cau-truc-khac","title":"6. Cấu trúc ngữ pháp khác","parent":"ngu-phap","order":5},{"id":"mao-tu","title":"Mạo từ (a, an, the)","parent":"cau-truc-khac","order":0},{"id":"dong-tu-khiem-khuyet","title":"Động từ khiếm khuyết","parent":"cau-truc-khac","order":1},{"id":"cau-bi-dong","title":"Câu bị động","parent":"cau-truc-khac","order":2},{"id":"cau-dieu-kien","title":"Câu điều kiện loại 0 và 1","parent":"cau-truc-khac","order":3},{"id":"so-sanh","title":"So sánh","parent":"cau-truc-khac","order":4},{"id":"review","title":"7. Ôn tập nhanh","parent":"ngu-phap","order":6},{"id":"40-cau-truc-thi","title":"40 cấu trúc ngữ pháp về thì và thời gian","parent":"review","order":2},{"id":"dong-tu-bat-quy-tac","title":"Danh sách động từ bất quy tắc","parent":"review","order":3},{"id":"lien-tu-can-nho","title":"Danh sách liên từ cần nắm vững","parent":"review","order":4},{"id":"90-gioi-tu","title":"90 giới từ thông dụng","parent":"review","order":1},{"id":"60-cau-me-noi","title":"60 câu tiếng Anh chủ đề dọn dẹp nhà cửa","parent":"giao-tiep","order":0},{"id":"meo-ngu-phap","title":"Ghi nhớ ngữ pháp lâu và hiệu quả","parent":"meo-ghi-nho","order":1},{"id":"3000-tu-qua-tho","title":"Học từ vựng qua thơ lục bát","parent":"meo-ghi-nho","order":2},{"id":"m-8hjylc","title":"15 lời khuyên khi học tiếng Anh","parent":"meo-ghi-nho","order":0},{"id":"m-g141po","title":"Mindmap các chủ đề từ vựng cơ bản","parent":"review","order":5},{"id":"m-lx8xz2","title":"70 câu giao tiếp giúp bố mẹ nói tiếng Anh với con hằng ngày","parent":"giao-tiep","order":1},{"id":"m-aab5i6","title":"Chủ đề thuyết trình tiếng Anh","parent":"giao-tiep","order":2},{"id":"m-72milk","title":"100 thành ngữ hay dùng","parent":"review","order":6},{"id":"m-ydtbii","title":"Học từ mới theo chủ đề","parent":"review","order":0},{"id":"m-sgh7t5","title":"14 chủ đề giao tiếp tại nhà","parent":"giao-tiep","order":3},{"id":"m-h8hplr","title":"Cách phát âm đuôi -s/-es","parent":"review","order":7},{"id":"m-4z3h45","title":"Cách phát âm đuôi \"-ed\"","parent":"review","order":8},{"id":"m-lowf4e","title":"14 ngày luyện nói tiếng Anh theo chủ đề","parent":"giao-tiep","order":4}],"posts":[{"id":"loi-ngo","menu":"trang-chu","title":"Giới thiệu","html":"\u003cp class=\"lead\">Website tổng hợp lại những kiến thức tiếng Anh cơ bản nhất, sắp xếp từ dễ đến khó: bảng chữ cái, trọng âm, từ loại, cấu trúc câu, các thì và những mẹo ghi nhớ.\u003c/p>\u003ch3>Hướng dẫn sử dụng website\u003c/h3> \u003cul> \u003cli>Mỗi ngày học một bài nhỏ, khoảng 15–30 phút là đủ. Đều đặn quan trọng hơn học nhiều một lúc.\u003c/li> \u003cli>Học xong một bài, hãy tự đặt 5 câu của riêng mình với cấu trúc vừa học.\u003c/li> \u003cli>Tại mỗi bài, có thể bấm \u003cb>Nghe cả bài \u003c/b>hoặc bấm biểu tượng \u003cb>loa\u003c/b> ở cuối mỗi câu, mỗi từ để nghe cách đọc, sau đó đọc to theo. Máy đọc lần lượt từng đoạn, tự cuộn theo. Có thể tự sang bài tiếp để nghe rảnh tay.\u003c/li> \u003cli>Học xong thì bấm \u003cstrong>Đánh dấu đã học\u003c/strong> để theo dõi tiến độ của mình.\u003c/li> \u003cli>Sau 3 ngày, 7 ngày, 14 ngày hãy quay lại ôn tập bài cũ.\u003c/li>\u003c/ul>\u003cp>\u003ci>\u003cb>Nguyên tắc tiên quyết để\nhọc tiếng Anh là duy trì sự đều đặn (consistency), phải\nkiên nhẫn, không vội vàng, có lịch trình cụ thể và tiếp xúc với ngôn ngữ\nmột cách thường xuyên mỗi ngày.\u003c/b>\u003c/i>\u003c/p>\u003ch3>Các yếu tố cốt lõi\u003c/h3>\u003cul>\u003cli>\u003cb>Học bằng tai trước khi\nhọc bằng mắt\u003c/b>: ưu tiên nghe và làm\nquen với âm thanh, ngữ điệu trước khi nhìn mặt chữ hay học ngữ pháp khô khan.\u003c/li>\u003cli>\u003cb>Không sợ sai và sẵn sàng\nsửa lỗi\u003c/b>: coi tiếng Anh là một\ncông cụ giao tiếp thực tế thay vì một môn học để thi cử.\u003c/li>\u003cli>\u003cb>Dành thời gian tối thiểu\nmỗi ngày\u003c/b>: tiếp xúc với tiếng Anh\nít nhất 30 phút mỗi ngày qua việc nghe nhạc, xem phim, đọc sách hoặc trò\nchuyện.\u003c/li>\u003cli>\u003cb>Học theo cụm từ\n(collocations)\u003c/b>: tránh học thuộc lòng\ntừng từ riêng lẻ hay các quy tắc ngữ pháp cứng nhắc; hãy học cả cụm từ hay đi cùng nhau (ví dụ: \u003ci>make a mistake\u003c/i>, \u003ci>do homework\u003c/i>).\u003c/li>\u003c/ul>","order":0,"updated":"2026-10-26"},{"id":"bai-bang-chu-cai","menu":"bang-chu-cai","title":"Bảng chữ cái trong tiếng Anh","html":"\u003cp>Bảng chữ cái tiếng Anh gồm 26 chữ cái, chia thành 2 nhóm: nguyên âm và phụ âm.\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Nhóm\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Chữ cái\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Nguyên âm\u003c/td> \u003ctd>A, E, I, O, U (5 chữ cái)\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Phụ âm\u003c/td> \u003ctd>B, C, D, F, G, H, J, K, L, M, N, P, Q, R, S, T, V, W, X, Y, Z (21 chữ cái)\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">26 chữ cái tiếng Anh\u003c/p>\u003cp class=\"sc-sub\">Ô vàng là 5 nguyên âm, 21 ô còn lại là phụ âm.\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-tiles\">\u003cspan class=\"sc-tile v\">\u003cb>Aa\u003c/b>\u003csmall>apple\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Bb\u003c/b>\u003csmall>ball\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Cc\u003c/b>\u003csmall>cat\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Dd\u003c/b>\u003csmall>duck\u003c/small>\u003c/span>\u003cspan class=\"sc-tile v\">\u003cb>Ee\u003c/b>\u003csmall>egg\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Ff\u003c/b>\u003csmall>fish\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Gg\u003c/b>\u003csmall>goat\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Hh\u003c/b>\u003csmall>house\u003c/small>\u003c/span>\u003cspan class=\"sc-tile v\">\u003cb>Ii\u003c/b>\u003csmall>ink\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Jj\u003c/b>\u003csmall>jam\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Kk\u003c/b>\u003csmall>kite\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Ll\u003c/b>\u003csmall>leaf\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Mm\u003c/b>\u003csmall>moon\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Nn\u003c/b>\u003csmall>nest\u003c/small>\u003c/span>\u003cspan class=\"sc-tile v\">\u003cb>Oo\u003c/b>\u003csmall>owl\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Pp\u003c/b>\u003csmall>pen\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Qq\u003c/b>\u003csmall>quilt\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Rr\u003c/b>\u003csmall>rain\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Ss\u003c/b>\u003csmall>star\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Tt\u003c/b>\u003csmall>tree\u003c/small>\u003c/span>\u003cspan class=\"sc-tile v\">\u003cb>Uu\u003c/b>\u003csmall>up\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Vv\u003c/b>\u003csmall>violin\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Ww\u003c/b>\u003csmall>window\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Xx\u003c/b>\u003csmall>box\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Yy\u003c/b>\u003csmall>yarn\u003c/small>\u003c/span>\u003cspan class=\"sc-tile\">\u003cb>Zz\u003c/b>\u003csmall>zebra\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Chữ X thường đứng cuối từ, như trong \u003cb>box\u003c/b>, \u003cb>fox\u003c/b>, \u003cb>six\u003c/b>.\u003c/p>\u003c/div> \u003cp>\u003cem>Ghi nhớ: “Trong tiếng Anh, cách viết và cách đọc không luôn giống nhau. Một chữ cái có thể có nhiều cách phát âm khác nhau tùy vào từ”.\u003c/em>\u003c/p>\u003ch3>Cách đọc tên 26 chữ cái\u003c/h3>\u003cp>Khi đánh vần tên riêng hoặc từ mới (spelling), người bản xứ đọc tên chữ cái như bảng dưới. Bấm nút loa để nghe.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Chữ cái\u003c/th>\u003cth>Phiên âm\u003c/th>\u003cth>Chữ cái\u003c/th>\u003cth>Phiên âm\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>A a\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/eɪ/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>N n\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/en/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>B b\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/biː/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>O o\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/oʊ/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>C c\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/siː/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>P p\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/piː/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>D d\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/diː/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>Q q\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/kjuː/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>E e\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/iː/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>R r\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɑːr/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>F f\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ef/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>S s\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/es/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>G g\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/dʒiː/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>T t\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/tiː/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>H h\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/eɪtʃ/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>U u\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/juː/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>I i\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/aɪ/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>V v\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/viː/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>J j\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/dʒeɪ/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>W w\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈdʌbəljuː/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>K k\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/keɪ/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>X x\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/eks/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>L l\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/el/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>Y y\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/waɪ/\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>M m\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/em/\u003c/span>\u003c/td>\u003ctd>\u003cstrong>Z z\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ziː/ (Mỹ), /zed/ (Anh)\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"note\">Chữ Y đôi khi đóng vai trò nguyên âm, ví dụ trong \u003cb>gym\u003c/b>, \u003cb>happy\u003c/b>, \u003cb>my\u003c/b>.\u003c/p>\u003cp>\u003cb>Mẫu câu đánh vần:\u003c/b> How do you spell your name? – \u003cb>L-A-N\u003c/b>, Lan.\u003c/p>","order":0,"updated":"2026-10-26"},{"id":"bai-trong-am","menu":"trong-am","title":"Trọng âm trong tiếng Anh","html":"\u003cp>\u003cstrong>Trọng âm trong tiếng Anh\u003c/strong> đóng vai trò quyết định trong việc phát âm chính xác. Nhấn sai trọng âm có thể dẫn đến hiểu nhầm hoặc không hiểu.\u003c/p> \u003ch3>Quy tắc nhấn trọng âm cơ bản:\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Loại từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Vị trí nhấn trọng âm\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Danh từ &amp; Tính từ 2 âm tiết\u003c/td> \u003ctd> Thường rơi vào âm tiết đầu\u003c/td> \u003ctd>MO-ther, TA-ble\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Động từ 2 âm tiết\u003c/td> \u003ctd>Thường rơi vào âm tiết sau\u003c/td> \u003ctd>a-GREE, re-PLY\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Từ tận cùng \u003cstrong>-tion\u003c/strong>, \u003cstrong>-sion\u003c/strong>, \u003cstrong>-cian\u003c/strong>\u003c/td> \u003ctd>Nhấn vào âm tiết trước hậu tố\u003c/td> \u003ctd>in-for-MA-tion\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Từ tận cùng \u003cstrong>-ic\u003c/strong>, \u003cstrong>-ical\u003c/strong>\u003c/td> \u003ctd>Nhấn vào âm tiết trước -ic, -ical\u003c/td> \u003ctd>eco-NO-mic, po-LI-ti-cal\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Từ tận cùng \u003cstrong>-ity\u003c/strong>, \u003cstrong>-ty\u003c/strong>\u003c/td> \u003ctd>Nhấn vào âm tiết trước hậu tố\u003c/td> \u003ctd>a-BIL-i-ty, pos-si-BIL-i-ty\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Từ tận cùng \u003cstrong>-al\u003c/strong>, \u003cstrong>-ful\u003c/strong>, \u003cstrong>-less\u003c/strong>, \u003cstrong>-ous\u003c/strong>\u003c/td> \u003ctd>Thường nhấn âm tiết gốc, không nhấn hậu tố\u003c/td> \u003ctd>NA-tion-al, CARE-ful, HELP-less, DAN-ger-ous\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Từ ghép (Danh từ)\u003c/td> \u003ctd>Nhấn vào từ thứ nhất\u003c/td> \u003ctd>BLACK-board\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Từ ghép (Động từ)\u003c/td> \u003ctd>Nhấn vào từ thứ hai\u003c/td> \u003ctd>un-der-STAND\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch4>Xem thêm trong trang:\u003c/h4> \u003cul>\u003cli>\u003ca href=\"#m-h8hplr\">Cách phát âm đuôi -s/-es\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#m-4z3h45\">Cách phát âm đuôi -ed\u003c/a>\u003c/li>\u003c/ul> \u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Nhấn trọng âm ở đâu?\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Danh từ, tính từ 2 âm tiết\u003c/b>\u003cspan class=\"sc-txt\">Nhấn âm tiết \u003cb>đầu\u003c/b>\u003c/span>\u003cspan class=\"sc-ex\">\u003cu>MO\u003c/u>-ther · \u003cu>TA\u003c/u>-ble · \u003cu>HAP\u003c/u>-py\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Động từ 2 âm tiết\u003c/b>\u003cspan class=\"sc-txt\">Nhấn âm tiết \u003cb>sau\u003c/b>\u003c/span>\u003cspan class=\"sc-ex\">a-\u003cu>GREE\u003c/u> · re-\u003cu>PLY\u003c/u> · be-\u003cu>GIN\u003c/u>\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Đuôi -tion, -sion, -cian\u003c/b>\u003cspan class=\"sc-txt\">Nhấn ngay \u003cb>trước đuôi\u003c/b>\u003c/span>\u003cspan class=\"sc-ex\">in-for-\u003cu>MA\u003c/u>-tion · mu-\u003cu>SI\u003c/u>-cian\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Đuôi -ic, -ical, -ity\u003c/b>\u003cspan class=\"sc-txt\">Nhấn ngay \u003cb>trước đuôi\u003c/b>\u003c/span>\u003cspan class=\"sc-ex\">e-co-\u003cu>NO\u003c/u>-mic · a-\u003cu>BIL\u003c/u>-i-ty\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Đuôi -al, -ful, -less, -ous\u003c/b>\u003cspan class=\"sc-txt\">\u003cb>Không\u003c/b> nhấn vào đuôi\u003c/span>\u003cspan class=\"sc-ex\">\u003cu>NA\u003c/u>-tion-al · \u003cu>CARE\u003c/u>-ful · \u003cu>HELP\u003c/u>-less\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k6\">\u003cb class=\"sc-term\">Từ ghép\u003c/b>\u003cspan class=\"sc-txt\">Danh từ nhấn từ \u003cb>đầu\u003c/b>, động từ nhấn từ \u003cb>sau\u003c/b>\u003c/span>\u003cspan class=\"sc-ex\">\u003cu>BLACK\u003c/u>-board · un-der-\u003cu>STAND\u003c/u>\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Phần gạch chân và viết hoa là âm tiết được nhấn mạnh. Đọc to từng từ, nhấn mạnh và kéo dài âm tiết đó một chút.\u003c/p>\u003c/div>\u003ch3>13 quy tắc đánh trọng âm\u003c/h3>\u003cp>Phần dưới đây tổng hợp 13 quy tắc thường gặp. Mỗi quy tắc có ví dụ kèm phiên âm; dấu \u003cb>ˈ\u003c/b> trong phiên âm đứng ngay trước âm tiết được nhấn. Một số từ là \u003cb>ngoại lệ\u003c/b>, cần học thuộc riêng.\u003c/p>\u003ch4>Quy tắc 1: Động từ 2 âm tiết\u003c/h4>\u003cp>Trọng âm rơi vào \u003cb>âm tiết thứ 2\u003c/b>.\u003c/p>\u003cdiv class=\"table-wrap\">\u \">/ˈʌndəleɪ/\u003c/span>\u003c/td>\u003ctd>lớp lót (dưới thảm)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>Quy tắc 13: Đuôi -ic, -ish, -ical, -sion, -tion, -ity, -ance, -ence, -ious, -iar, -ience, -id, -eous, -acy, -ian\u003c/h4>\u003cp>Trọng âm rơi vào \u003cb>âm tiết ngay trước đuôi\u003c/b>.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say1\">\u003cthead>\u003ctr>\u003cth>Từ\u003c/th>\u003cth>Phiên âm\u003c/th>\u003cth>Nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>childish\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈtʃaɪldɪʃ/\u003c/span>\u003c/td>\u003ctd>trẻ con\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>logical\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈlɒdʒɪkl/\u003c/span>\u003c/td>\u003ctd>hợp lý\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>decision\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/dɪˈsɪʒn/\u003c/span>\u003c/td>\u003ctd>quyết định\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>action\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈækʃn/\u003c/span>\u003c/td>\u003ctd>hành động\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>importance\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɪmˈpɔːtns/\u003c/span>\u003c/td>\u003ctd>tầm quan trọng\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>difference\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈdɪfrəns/\u003c/span>\u003c/td>\u003ctd>sự khác biệt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>curious\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈkjʊəriəs/\u003c/span>\u003c/td>\u003ctd>tò mò\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>courageous\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/kəˈreɪdʒəs/\u003c/span>\u003c/td>\u003ctd>dũng cảm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>musician\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/mjuˈzɪʃn/\u003c/span>\u003c/td>\u003ctd>nhạc sĩ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>familiar\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/fəˈmɪliə(r)/\u003c/span>\u003c/td>\u003ctd>quen thuộc\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">13 quy tắc trọng âm trong một thẻ\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Động từ 2 âm tiết\u003c/b>\u003cspan class=\"sc-txt\">Nhấn âm tiết 2\u003c/span>\u003cspan class=\"sc-ex\">be\u003cu>GIN\u003c/u> · en\u003cu>JOY\u003c/u>\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Danh từ, tính từ 2 âm tiết\u003c/b>\u003cspan class=\"sc-txt\">Nhấn âm tiết 1\u003c/span>\u003cspan class=\"sc-ex\">\u003cu>HA\u003c/u>bit · \u003cu>LUCK\u003c/u>y\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Danh từ, tính từ ghép\u003c/b>\u003cspan class=\"sc-txt\">Nhấn từ thứ nhất\u003c/span>\u003cspan class=\"sc-ex\">\u003cu>BIRTH\u003c/u>day · \u003cu>HOME\u003c/u>sick\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Động từ ghép\u003c/b>\u003cspan class=\"sc-txt\">Nhấn từ thứ hai\u003c/span>\u003cspan class=\"sc-ex\">be\u003cu>COME\u003c/u>\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">-graphy, -ate, -gy, -cy, -ity, -al\u003c/b>\u003cspan class=\"sc-txt\">Nhấn âm tiết thứ 3 từ cuối lên\u003c/span>\u003cspan class=\"sc-ex\">tech\u003cu>NO\u003c/u>logy · de\u003cu>MO\u003c/u>cracy\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k6\">\u003cb class=\"sc-term\">-ic, -tion, -sion, -ance, -ious, -ian…\u003c/b>\u003cspan class=\"sc-txt\">Nhấn ngay trước đuôi\u003c/span>\u003cspan class=\"sc-ex\">de\u003cu>CI\u003c/u>sion · mu\u003cu>SI\u003c/u>cian\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k7\">\u003cb class=\"sc-term\">-ee, -eer, -ese, -ique, -ain\u003c/b>\u003cspan class=\"sc-txt\">Nhấn vào chính đuôi\u003c/span>\u003cspan class=\"sc-ex\">a\u003cu>GREE\u003c/u> · re\u003cu>TAIN\u003c/u>\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k8\">\u003cb class=\"sc-term\">-ment, -ness, -ful, -able, -less…\u003c/b>\u003cspan class=\"sc-txt\">Giữ trọng âm của từ gốc\u003c/span>\u003cspan class=\"sc-ex\">re\u003cu>LY\u003c/u> → re\u003cu>LI\u003c/u>able\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Tiền tố un-, dis-, re-, im-…\u003c/b>\u003cspan class=\"sc-txt\">Không nhấn tiền tố\u003c/span>\u003cspan class=\"sc-ex\">re\u003cu>WRITE\u003c/u> · ex\u003cu>PORT\u003c/u>\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Gặp từ mới, hãy tra phiên âm và tìm dấu ˈ để biết âm tiết cần nhấn, rồi đọc to 3 lần.\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-tu-loai","menu":"tu-loai","title":"8 loại từ trong tiếng Anh (Parts of Speech)","html":"\u003cp>Tiếng Anh có 8 loại từ chính. Mỗi loại có một vai trò riêng trong câu.\u003c/p> \u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">8 loại từ trong một câu\u003c/p>\u003cp class=\"sc-sub\">Mỗi màu là một loại từ. Thử tìm đủ 8 màu trong câu dưới đây.\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-sent\">\u003cspan class=\"sc-w k8\">\u003cb>Wow!\u003c/b>\u003csmall>thán từ\u003c/small>\u003c/span>\u003cspan class=\"sc-w k2\">\u003cb>She\u003c/b>\u003csmall>đại từ\u003c/small>\u003c/span>\u003cspan class=\"sc-w k5\">\u003cb>happily\u003c/b>\u003csmall>trạng từ\u003c/small>\u003c/span>\u003cspan class=\"sc-w k3\">\u003cb>reads\u003c/b>\u003csmall>động từ\u003c/small>\u003c/span>\u003cspan class=\"sc-w k4\">\u003cb>funny\u003c/b>\u003csmall>tính từ\u003c/small>\u003c/span>\u003cspan class=\"sc-w k1\">\u003cb>books\u003c/b>\u003csmall>danh từ\u003c/small>\u003c/span>\u003cspan class=\"sc-w k6\">\u003cb>in\u003c/b>\u003csmall>giới từ\u003c/small>\u003c/span>\u003cspan class=\"sc-w plain\">\u003cb>the\u003c/b>\u003csmall> \u003c/small>\u003c/span>\u003cspan class=\"sc-w k1\">\u003cb>garden\u003c/b>\u003csmall>danh từ\u003c/small>\u003c/span>\u003cspan class=\"sc-w k7\">\u003cb>and\u003c/b>\u003csmall>liên từ\u003c/small>\u003c/span>\u003cspan class=\"sc-w k3\">\u003cb>sings.\u003c/b>\u003csmall>động từ\u003c/small>\u003c/span>\u003c/div>\u003cdiv class=\"sc-grid c4\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Danh từ (n)\u003c/b>\u003cspan class=\"sc-txt\">Gọi tên người, vật, nơi chốn\u003c/span>\u003cspan class=\"sc-ex\">book, garden\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Đại từ (pron)\u003c/b>\u003cspan class=\"sc-txt\">Thay cho danh từ\u003c/span>\u003cspan class=\"sc-ex\">she, they, it\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Động từ (v)\u003c/b>\u003cspan class=\"sc-txt\">Chỉ hành động, trạng thái\u003c/span>\u003cspan class=\"sc-ex\">read, sing, be\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Tính từ (adj)\u003c/b>\u003cspan class=\"sc-txt\">Tả đặc điểm của danh từ\u003c/span>\u003cspan class=\"sc-ex\">funny, big\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Trạng từ (adv)\u003c/b>\u003cspan class=\"sc-txt\">Nói rõ hành động diễn ra thế nào\u003c/span>\u003cspan class=\"sc-ex\">happily, now\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k6\">\u003cb class=\"sc-term\">Giới từ (prep)\u003c/b>\u003cspan class=\"sc-txt\">Chỉ vị trí, thời gian, hướng\u003c/span>\u003cspan class=\"sc-ex\">in, on, at\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k7\">\u003cb class=\"sc-term\">Liên từ (conj)\u003c/b>\u003cspan class=\"sc-txt\">Nối từ, nối câu\u003c/span>\u003cspan class=\"sc-ex\">and, but, so\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k8\">\u003cb class=\"sc-term\">Thán từ (interj)\u003c/b>\u003cspan class=\"sc-txt\">Bày tỏ cảm xúc\u003c/span>\u003cspan class=\"sc-ex\">Wow! Oops!\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-24"},{"id":"bai-danh-tu","menu":"danh-tu","title":"Danh từ (Nouns)","html":"\u003cp>\u003cstrong>Danh từ\u003c/strong> là từ dùng để chỉ người, vật, địa điểm, khái niệm, ý tưởng. Trong câu, danh từ thường đóng vai trò làm chủ ngữ hoặc tân ngữ.\u003c/p> \u003ch3>Cách nhận biết danh từ:\u003c/h3> \u003cul> \u003cli>Có thể đứng sau mạo từ (a, an, the)\u003c/li> \u003cli>Có thể thêm 's để chỉ sở hữu\u003c/li> \u003cli>Có thể thêm s/es để chỉ số nhiều\u003c/li> \u003c/ul> \u003ch3>Phân loại danh từ chi tiết: Danh từ chung/riêng, đếm được/không đếm được, trừu tượng/cụ thể\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Loại danh từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Định nghĩa\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Danh từ chung (Common nouns)\u003c/td> \u003ctd>Chỉ sự vật, con người, khái niệm nói chung\u003c/td> \u003ctd>teacher, city, book\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Danh từ riêng (Proper nouns)\u003c/td> \u003ctd>Tên riêng, viết hoa chữ cái đầu\u003c/td> \u003ctd>London, Anna, Vietnam\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Danh từ đếm được (Countable)\u003c/td> \u003ctd>Đếm được bằng số\u003c/td> \u003ctd>a pen, two students\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Danh từ không đếm được (Uncountable)\u003c/td> \u003ctd>Không đếm trực tiếp bằng số\u003c/td> \u003ctd>water, information\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Danh từ cụ thể (Concrete nouns)\u003c/td> \u003ctd>Có thể cảm nhận bằng giác quan\u003c/td> \u003ctd>apple, music, chair\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Danh từ trừu tượng (Abstract nouns)\u003c/td> \u003ctd>Chỉ cảm xúc, trạng thái, khái niệm\u003c/td> \u003ctd>happiness, freedom, love\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Sở hữu cách của danh từ ('s) và cách dùng\u003c/h3> \u003cp>\u003cstrong>Sở hữu cách\u003c/strong> dùng để chỉ quyền sở hữu hoặc mối quan hệ giữa các danh từ.\u003c/p> \u003ch4>Cách dùng:\u003c/h4> \u003cul> \u003cli>\u003cstrong>Với danh từ số ít\u003c/strong>: Thêm 's (John's book)\u003c/li> \u003cli>\u003cstrong>Với danh từ số nhiều tận cùng bằng s\u003c/strong>: Chỉ thêm ' (my parents' house)\u003c/li> \u003cli>\u003cstrong>Với danh từ số nhiều không tận cùng bằng s\u003c/strong>: Thêm 's (children's toys)\u003c/li> \u003c/ul> \u003cp>\u003cu>\u003cstrong>Lưu ý:\u003c/strong> \u003c/u>Với đồ vật, thường dùng \"of\" thay vì 's (the leg of the table, không phải the table's leg)\u003c/p> \u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Danh từ (Nouns) trong 1 phút\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Là gì?\u003c/b>\u003cspan class=\"sc-txt\">Từ chỉ người, vật, nơi chốn, ý tưởng. Thường làm chủ ngữ hoặc tân ngữ.\u003c/span>\u003cspan class=\"sc-ex\">The \u003cb>cat\u003c/b> likes \u003cb>milk\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Cách nhận ra\u003c/b>\u003cspan class=\"sc-txt\">Đứng sau a / an / the · thêm 's · thêm s/es\u003c/span>\u003cspan class=\"sc-ex\">a \u003cb>book\u003c/b> → two \u003cb>books\u003c/b>\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Chung / riêng\u003c/b>\u003cspan class=\"sc-txt\">Tên riêng luôn viết hoa\u003c/span>\u003cspan class=\"sc-ex\">city / \u003cb>Hanoi\u003c/b>\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Đếm được / không đếm được\u003c/b>\u003cspan class=\"sc-txt\">Không đếm được thì không thêm s\u003c/span>\u003cspan class=\"sc-ex\">two pens / some water\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Cụ thể / trừu tượng\u003c/b>\u003cspan class=\"sc-txt\">Sờ, nhìn được hay chỉ là cảm xúc, ý nghĩ\u003c/span>\u003cspan class=\"sc-ex\">chair / happiness\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k6\">\u003cb class=\"sc-term\">Sở hữu cách 's\u003c/b>\u003cspan class=\"sc-txt\">Số ít thêm 's · số nhiều có s chỉ thêm '\u003c/span>\u003cspan class=\"sc-ex\">John's book · my parents' house\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Với đồ vật thường dùng \u003cb>of\u003c/b>: the leg \u003cb>of\u003c/b> the table (không nói the table's leg).\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-dai-tu","menu":"dai-tu","title":"Đại từ (Pronouns)","html":"\u003cp>\u003cstrong>Đại từ\u003c/strong> là từ dùng để thay cho danh từ, giúp tránh lặp lại và làm câu ngắn gọn hơn. Đại từ chia thành nhiều nhóm, mỗi nhóm có chức năng riêng.\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Loại đại từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Chức năng chính\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Các đại từ thường gặp\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Đại từ nhân xưng (Personal pronouns)\u003c/td> \u003ctd>Chỉ người/vật, làm chủ ngữ hoặc tân ngữ\u003c/td> \u003ctd>\u003cp>I, you, he, she, it, we, they\u003c/p> \u003cp>me, him, her, them, us\u003c/p>\u003c/td> \u003ctd>She likes him.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Đại từ sở hữu (Possessive pronouns)\u003c/td> \u003ctd>Chỉ sự sở hữu, đứng độc lập\u003c/td> \u003ctd>mine, yours, his, hers, ours, theirs\u003c/td> \u003ctd>This book is mine.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Đại từ phản thân (Reflexive pronouns)\u003c/td> \u003ctd>Nhấn mạnh hoặc chỉ hành động quay lại chủ thể\u003c/td> \u003ctd>myself, yourself/yourselves, himself, herself, themselves, ourselves, itself\u003c/td> \u003ctd>She taught herself.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Đại từ chỉ định (Demonstrative pronouns)\u003c/td> \u003ctd>Chỉ người/vật cụ thể\u003c/td> \u003ctd>this, that, these, those\u003c/td> \u003ctd>These are my keys.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Đại từ nghi vấn (Interrogative pronouns)\u003c/td> \u003ctd>Dùng để hỏi\u003c/td> \u003ctd>who, whom, whose, what, which\u003c/td> \u003ctd>Who is calling?\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Đại từ quan hệ (Relative pronouns)\u003c/td> \u003ctd>Nối mệnh đề quan hệ\u003c/td> \u003ctd>who, whom, which, that, whose\u003c/td> \u003ctd>The man who called me…\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Đại từ bất định (Indefinite pronouns)\u003c/td> \u003ctd>Chỉ người/vật không xác định\u003c/td> \u003ctd>Someone, Anything, Nobody, Everyone, Each...\u003c/td> \u003ctd>Someone is waiting.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">7 nhóm đại từ\u003c/p>\u003cp class=\"sc-sub\">Đại từ thay cho danh từ để câu ngắn gọn, không lặp từ.\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Nhân xưng\u003c/b>\u003cspan class=\"sc-txt\">I, you, he, she, it, we, they · me, him, her, us, them\u003c/span>\u003cspan class=\"sc-ex\">She likes \u003cb>him\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Sở hữu\u003c/b>\u003cspan class=\"sc-txt\">mine, yours, his, hers, ours, theirs\u003c/span>\u003cspan class=\"sc-ex\">This book is \u003cb>mine\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Phản thân\u003c/b>\u003cspan class=\"sc-txt\">myself, yourself, himself, herself, ourselves, themselves\u003c/span>\u003cspan class=\"sc-ex\">She taught \u003cb>herself\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Chỉ định\u003c/b>\u003cspan class=\"sc-txt\">this, that, these, those\u003c/span>\u003cspan class=\"sc-ex\">\u003cb>These\u003c/b> are my keys.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Nghi vấn\u003c/b>\u003cspan class=\"sc-txt\">who, whom, whose, what, which\u003c/span>\u003cspan class=\"sc-ex\">\u003cb>Who\u003c/b> is calling?\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k6\">\u003cb class=\"sc-term\">Quan hệ\u003c/b>\u003cspan class=\"sc-txt\">who, whom, which, that, whose\u003c/span>\u003cspan class=\"sc-ex\">The man \u003cb>who\u003c/b> called me…\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k7\">\u003cb class=\"sc-term\">Bất định\u003c/b>\u003cspan class=\"sc-txt\">someone, anything, nobody, everyone, each\u003c/span>\u003cspan class=\"sc-ex\">\u003cb>Someone\u003c/b> is waiting.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-24"},{"id":"bai-dong-tu","menu":"dong-tu","title":"Động từ (Verbs)","html":"\u003cp>\u003cstrong>Động từ\u003c/strong> là từ diễn tả hành động, trạng thái, sự tồn tại. Trong tiếng Anh, một câu không thể hoàn chỉnh nếu thiếu động từ. Tùy vào cách sử dụng và chức năng, động từ được chia thành nhiều loại khác nhau, mỗi loại đảm nhiệm một vai trò riêng trong câu.\u003c/p> \u003cp>Các loại động từ trong tiếng Anh bao gồm:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Nhóm động từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Phân loại/Dạng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd rowspan=\"2\">\u003cstrong>Động từ To be\u003c/strong>\u003c/td> \u003ctd>am / is / are\u003c/td> \u003ctd>Chỉ trạng thái, đặc điểm, nghề nghiệp, vị trí\u003c/td> \u003ctd>I am a student.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>was / were\u003c/td> \u003ctd>Dùng cho quá khứ\u003c/td> \u003ctd>She was tired.\u003c/td> \u003c/tr> \u003ctr> \u003ctd rowspan=\"2\">Động từ thường\u003c/td> \u003ctd>Nội động từ\u003c/td> \u003ctd>Không cần tân ngữ theo sau\u003c/td> \u003ctd>She sleeps early.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Ngoại động từ\u003c/td> \u003ctd>Cần tân ngữ theo sau\u003c/td> \u003ctd>He bought a car.\u003c/td> \u003c/tr> \u003ctr> \u003ctd rowspan=\"2\">\u003cstrong>Động từ nối\u003c/strong>\u003c/td> \u003ctd>seem, become, feel…\u003c/td> \u003ctd>Nối chủ ngữ với bổ ngữ\u003c/td> \u003ctd>She seems happy.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>look, sound, taste…\u003c/td> \u003ctd>Mô tả trạng thái, cảm giác\u003c/td> \u003ctd>The soup tastes good.\u003c/td> \u003c/tr> \u003ctr> \u003ctd rowspan=\"4\">Dạng động từ\u003c/td> \u003ctd>V-inf\u003c/td> \u003ctd>Sau \u003cem>to\u003c/em>, động từ khuyết thiếu\u003c/td> \u003ctd>I want to go.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>V-s / es\u003c/td> \u003ctd>Hiện tại đơn – ngôi thứ 3 số ít\u003c/td> \u003ctd>He reads books.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>V-ing (Hiện tại phân từ)\u003c/td> \u003ctd>Thì tiếp diễn, danh động từ\u003c/td> \u003ctd>I am studying.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>V-ed / P2 (Quá khứ phân từ)\u003c/td> \u003ctd>Thì hoàn thành, câu bị động\u003c/td> \u003ctd>The work was done.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch4>Xem thêm trong trang:\u003c/h4> \u003cul>\u003cli>\u003ca href=\"#dong-tu-bat-quy-tac\">Danh sách động từ bất quy tắc\u003c/a>\u003c/li>\u003c/ul>","order":0,"updated":"2026-10-24"},{"id":"bai-tinh-tu","menu":"tinh-tu","title":"Tính từ (Adjectives)","html":"\u003cp>\u003cstrong>Tính từ\u003c/strong> dùng để mô tả đặc điểm của danh từ và đại từ.\u003c/p> \u003cp>Vị trí của tính từ trong câu có hai vị trí chính:\u003c/p> \u003cul> \u003cli>\u003cstrong>Trước danh từ (Attributive position):\u003c/strong> \u003cul> \u003cli>Ví dụ: She bought a \u003cstrong>new\u003c/strong> car. / I like \u003cstrong>intelligent\u003c/strong> people.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Sau động từ \u003cstrong>\"to be\"\u003c/strong> hoặc đ\u003cstrong>ộng từ nối\u003c/strong> (Predicative position): \u003cul> \u003cli>Ví dụ: The car is \u003cstrong>expensive\u003c/strong>. / She looks \u003cstrong>beautiful\u003c/strong>.\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003ch3>Các đuôi tính từ phổ biến giúp nhận diện (ví dụ: -ful, -less, -able, -ive, -ous)\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Hậu tố\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ý nghĩa\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>-ful\u003c/strong>\u003c/td> \u003ctd>đầy, nhiều\u003c/td> \u003ctd>beauti\u003cstrong>ful\u003c/strong>, care\u003cstrong>ful\u003c/strong>, use\u003cstrong>ful\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>-less\u003c/strong>\u003c/td> \u003ctd>không có\u003c/td> \u003ctd>care\u003cstrong>less\u003c/strong>, home\u003cstrong>less\u003c/strong>, use\u003cstrong>less\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>-able / -ible\u003c/strong>\u003c/td> \u003ctd>có thể\u003c/td> \u003ctd>drink\u003cstrong>able\u003c/strong>, comfort\u003cstrong>able\u003c/strong>, flex\u003cstrong>ible\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>-ive\u003c/strong>\u003c/td> \u003ctd>có tính chất, khuynh hướng\u003c/td> \u003ctd>act\u003cstrong>ive\u003c/strong>, creat\u003cstrong>ive\u003c/strong>, effect\u003cstrong>ive\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>-ous\u003c/strong>\u003c/td> \u003ctd>có đặc điểm\u003c/td> \u003ctd>danger\u003cstrong>ous\u003c/strong>, curi\u003cstrong>ous\u003c/strong>, fam\u003cstrong>ous\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>-y\u003c/strong>\u003c/td> \u003ctd>có tính chất\u003c/td> \u003ctd>dirt\u003cstrong>y\u003c/strong>, ic\u003cstrong>y\u003c/strong>, sleep\u003cstrong>y\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>-al\u003c/strong>\u003c/td> \u003ctd>thuộc về\u003c/td> \u003ctd>natur\u003cstrong>al\u003c/strong>, norm\u003cstrong>al\u003c/strong>, form\u003cstrong>al\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>-ic\u003c/strong>\u003c/td> \u003ctd>liên quan đến\u003c/td> \u003ctd>econom\u003cstrong>ic\u003c/strong>, realist\u003cstrong>ic\u003c/strong>, specif\u003cstrong>ic\u003c/strong>\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Trật tự của tính từ trước một danh từ (OSASCOMP)\u003c/h3> \u003cp>Khi có nhiều tính từ cùng mô tả một danh từ, chúng ta cần sắp xếp theo một trật tự nhất định. Người bản xứ áp dụng trật tự này một cách tự nhiên. Bạn có thể nhớ quy tắc này qua từ viết tắt \u003cstrong>OSASCOMP\u003c/strong>:\u003c/p> \u003ch3>Opinion → Size → Age → Shape → Color → Origin → Material → Purpose.\u003c/h3> \u003ch3>(Ý kiến → Kích cỡ → Tuổi → Hình dạng → Màu sắc → Xuất xứ → Chất liệu → Mục đích.)\u003c/h3> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> a beautiful small new round blue Chinese wooden dining table\u003c/p> \u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Tính từ: vị trí, đuôi và trật tự\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Đứng trước danh từ\u003c/b>\u003cspan class=\"sc-ex\">a \u003cb>new\u003c/b> car\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Đứng sau to be / động từ nối\u003c/b>\u003cspan class=\"sc-ex\">The car is \u003cb>expensive\u003c/b>. She looks \u003cb>happy\u003c/b>.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Đuôi tính từ hay gặp\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">-ful: useful\u003c/span>\u003cspan class=\"sc-chip\">-less: careless\u003c/span>\u003cspan class=\"sc-chip\">-able: comfortable\u003c/span>\u003cspan class=\"sc-chip\">-ive: active\u003c/span>\u003cspan class=\"sc-chip\">-ous: famous\u003c/span>\u003cspan class=\"sc-chip\">-y: sleepy\u003c/span>\u003cspan class=\"sc-chip\">-al: natural\u003c/span>\u003cspan class=\"sc-chip\">-ic: economic\u003c/span>\u003c/div>\u003cp class=\"sc-label\">Trật tự OSASCOMP, đọc từ trái sang phải\u003c/p>\u003cdiv class=\"sc-order\">\u003cspan class=\"sc-o\">\u003cb>Opinion\u003c/b>\u003csmall>ý kiến\u003c/small>\u003cem>beautiful\u003c/em>\u003c/span>\u003cspan class=\"sc-o\">\u003cb>Size\u003c/b>\u003csmall>kích cỡ\u003c/small>\u003cem>small\u003c/em>\u003c/span>\u003cspan class=\"sc-o\">\u003cb>Age\u003c/b>\u003csmall>tuổi\u003c/small>\u003cem>new\u003c/em>\u003c/span>\u003cspan class=\"sc-o\">\u003cb>Shape\u003c/b>\u003csmall>hình dạng\u003c/small>\u003cem>round\u003c/em>\u003c/span>\u003cspan class=\"sc-o\">\u003cb>Color\u003c/b>\u003csmall>màu sắc\u003c/small>\u003cem>blue\u003c/em>\u003c/span>\u003cspan class=\"sc-o\">\u003cb>Origin\u003c/b>\u003csmall>xuất xứ\u003c/small>\u003cem>Chinese\u003c/em>\u003c/span>\u003cspan class=\"sc-o\">\u003cb>Material\u003c/b>\u003csmall>chất liệu\u003c/small>\u003cem>wooden\u003c/em>\u003c/span>\u003cspan class=\"sc-o\">\u003cb>Purpose\u003c/b>\u003csmall>mục đích\u003c/small>\u003cem>dining\u003c/em>\u003c/span>\u003cspan class=\"sc-o noun\">\u003cb>N\u003c/b>\u003csmall>danh từ\u003c/small>\u003cem>table\u003c/em>\u003c/span>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-trang-tu","menu":"trang-tu","title":"Trạng từ (Adverbs)","html":"\u003cp>\u003cstrong>Trạng từ\u003c/strong> là từ bổ nghĩa cho động từ, tính từ, hoặc trạng từ khác. Trạng từ giúp chỉ rõ hành động được thực hiện như thế nào, khi nào, ở đâu, và mức độ ra sao.\u003c/p> \u003ch3>Cách thành lập trạng từ từ tính từ (thường là +ly) và các trường hợp đặc biệt (hard, fast, late, well)\u003c/h3> \u003ch3>Cách thành lập trạng từ từ tính từ:\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Mô tả\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Quy tắc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Áp dụng cho hầu hết tính từ\u003c/td> \u003ctd>Thêm \u003cstrong>-ly\u003c/strong> vào tính từ\u003c/td> \u003ctd>slow → slow\u003cstrong>ly\u003c/strong>, quick → quick\u003cstrong>ly\u003c/strong>, careful → careful\u003cstrong>ly\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Tính từ tận cùng bằng \u003cstrong>-y\u003c/strong>\u003c/td> \u003ctd>Đổi \u003cstrong>y\u003c/strong> thành \u003cstrong>i\u003c/strong>, sau đó thêm \u003cstrong>-ly\u003c/strong>\u003c/td> \u003ctd>happy → happi\u003cstrong>ly\u003c/strong>, easy → easi\u003cstrong>ly\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Tính từ tận cùng bằng \u003cstrong>-le\u003c/strong>\u003c/td> \u003ctd>Bỏ \u003cstrong>e\u003c/strong> cuối, sau đó thêm \u003cstrong>-ly\u003c/strong>\u003c/td> \u003ctd>simple → simp\u003cstrong>ly\u003c/strong>, terrible → terrib\u003cstrong>ly\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Tính từ tận cùng bằng \u003cstrong>-ic\u003c/strong>\u003c/td> \u003ctd>Giữ nguyên, sau đó thêm \u003cstrong>-ally\u003c/strong>\u003c/td> \u003ctd>basic → basic\u003cstrong>ally\u003c/strong>, specific → specific\u003cstrong>ally\u003c/strong>\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Các trường hợp đặc biệt (trạng từ không thêm -ly hoặc có 2 dạng với nghĩa khác nhau):\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Tính từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Trạng từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ghi chú\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>good\u003c/td> \u003ctd>well\u003c/td> \u003ctd>well là trạng từ của good\u003c/td> \u003c/tr> \u003ctr> \u003ctd>fast\u003c/td> \u003ctd>fast\u003c/td> \u003ctd>không thay đổi\u003c/td> \u003c/tr> \u003ctr> \u003ctd>hard\u003c/td> \u003ctd>hard\u003c/td> \u003ctd>không thay đổi\u003c/td> \u003c/tr> \u003ctr> \u003ctd>late\u003c/td> \u003ctd>late\u003c/td> \u003ctd>không thay đổi\u003c/td> \u003c/tr> \u003ctr> \u003ctd>early\u003c/td> \u003ctd>early\u003c/td> \u003ctd>không thay đổi\u003c/td> \u003c/tr> \u003ctr> \u003ctd>high\u003c/td> \u003ctd>high/highly\u003c/td> \u003ctd>\"high\" và \"highly\" có ý nghĩa khác nhau\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Các loại trạng từ cơ bản: Chỉ cách thức (manner), thời gian (time), nơi chốn (place), tần suất (frequency), mức độ (degree)\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Loại trạng từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Trả lời câu hỏi\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ trạng từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ câu\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Trạng từ chỉ cách thức (Manner)\u003c/td> \u003ctd>How?\u003c/td> \u003ctd>quickly, slowly, carefully, well, badly\u003c/td> \u003ctd>She sings \u003cstrong>beautifully\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Trạng từ chỉ thời gian (Time)\u003c/td> \u003ctd>When?\u003c/td> \u003ctd>now, yesterday, tomorrow, soon, already\u003c/td> \u003ctd>I will see you \u003cstrong>tomorrow\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Trạng từ chỉ nơi chốn (Place)\u003c/td> \u003ctd>Where?\u003c/td> \u003ctd>here, there, everywhere, up\u003c/td> \u003ctd>Please wait \u003cstrong>here\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Trạng từ chỉ tần suất (Frequency)\u003c/td> \u003ctd>How often?\u003c/td> \u003ctd>always, usually, often, sometimes, rarely, never\u003c/td> \u003ctd>He \u003cstrong>rarely\u003c/strong> goes to the movies.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Trạng từ chỉ mức độ (Degree)\u003c/td> \u003ctd>How much? / To what extent?\u003c/td> \u003ctd>very, too, quite, really, extremely, slightly\u003c/td> \u003ctd>She is \u003cstrong>extremely\u003c/strong> intelligent.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Trạng từ (Adverbs)\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c4\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Thêm -ly\u003c/b>\u003cspan class=\"sc-txt\">slow → slow\u003cb>ly\u003c/b>\u003c/span>\u003cspan class=\"sc-ex\">careful → careful\u003cb>ly\u003c/b>\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">-y → -ily\u003c/b>\u003cspan class=\"sc-txt\">happy → happ\u003cb>ily\u003c/b>\u003c/span>\u003cspan class=\"sc-ex\">easy → eas\u003cb>ily\u003c/b>\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">-le → -ly\u003c/b>\u003cspan class=\"sc-txt\">simple → simp\u003cb>ly\u003c/b>\u003c/span>\u003cspan class=\"sc-ex\">terrible → terrib\u003cb>ly\u003c/b>\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">-ic → -ically\u003c/b>\u003cspan class=\"sc-txt\">basic → basic\u003cb>ally\u003c/b>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Không theo quy tắc\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">good → \u003cb>well\u003c/b>\u003c/span>\u003cspan class=\"sc-chip\">fast → fast\u003c/span>\u003cspan class=\"sc-chip\">hard → hard\u003c/span>\u003cspan class=\"sc-chip\">late → late\u003c/span>\u003cspan class=\"sc-chip\">early → early\u003c/span>\u003cspan class=\"sc-chip\">high → high / highly\u003c/span>\u003c/div>\u003cp class=\"sc-label\">Trạng từ trả lời câu hỏi nào?\u003c/p>\u003cdiv class=\"sc-grid c5\">\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">How?\u003c/b>\u003cspan class=\"sc-txt\">cách thức\u003c/span>\u003cspan class=\"sc-ex\">She sings \u003cb>beautifully\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k6\">\u003cb class=\"sc-term\">When?\u003c/b>\u003cspan class=\"sc-txt\">thời gian\u003c/span>\u003cspan class=\"sc-ex\">See you \u003cb>tomorrow\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k7\">\u003cb class=\"sc-term\">Where?\u003c/b>\u003cspan class=\"sc-txt\">nơi chốn\u003c/span>\u003cspan class=\"sc-ex\">Please wait \u003cb>here\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k8\">\u003cb class=\"sc-term\">How often?\u003c/b>\u003cspan class=\"sc-txt\">tần suất\u003c/span>\u003cspan class=\"sc-ex\">He \u003cb>rarely\u003c/b> goes out.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">How much?\u003c/b>\u003cspan class=\"sc-txt\">mức độ\u003c/span>\u003cspan class=\"sc-ex\">She is \u003cb>very\u003c/b> smart.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"note\">\u003cb>hard\u003c/b> (chăm chỉ) khác \u003cb>hardly\u003c/b> (hầu như không): He works hard. / He hardly works. Tương tự, \u003cb>late\u003c/b> (muộn) khác \u003cb>lately\u003c/b> (gần đây).\u003c/p>","order":0,"updated":"2026-10-24"},{"id":"bai-gioi-tu","menu":"gioi-tu","title":"Giới từ (Prepositions)","html":"\u003cp>\u003cstrong>Giới từ\u003c/strong> là những từ nhỏ nhưng quan trọng, tạo mối liên hệ giữa các từ trong câu. Chúng thường chỉ thời gian, nơi chốn, phương hướng hoặc mối quan hệ.\u003c/p> \u003ch3>Các giới từ chỉ thời gian thông dụng: IN, ON, AT, FOR, SINCE, DURING, BEFORE, AFTER\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Giới từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>IN\u003c/td> \u003ctd>Dùng với \u003cstrong>tháng\u003c/strong>, \u003cstrong>năm\u003c/strong>, \u003cstrong>mùa\u003c/strong>, \u003cstrong>thế kỷ\u003c/strong> và khoảng thời gian trong ngày\u003c/td> \u003ctd>\u003cp>in April, in 2023, in summer, in the 21st century,\u003c/p> \u003cp>in the morning/afternoon/evening\u003c/p>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>ON\u003c/td> \u003ctd>Dùng với \u003cstrong>ngày\u003c/strong> trong tuần hoặc \u003cstrong>ngày tháng\u003c/strong> cụ thể\u003c/td> \u003ctd>on Monday, on May 1st, on my birthday\u003c/td> \u003c/tr> \u003ctr> \u003ctd>AT\u003c/td> \u003ctd>Dùng với \u003cstrong>giờ\u003c/strong> cụ thể hoặc một số \u003cstrong>thời điểm đặc biệt\u003c/strong>\u003c/td> \u003ctd>at 8 o'clock, at noon, at midnight, at Christmas, at night\u003c/td> \u003c/tr> \u003ctr> \u003ctd>FOR\u003c/td> \u003ctd>Dùng để chỉ \u003cstrong>khoảng thời gian\u003c/strong> kéo dài\u003c/td> \u003ctd>I’ve studied English \u003cstrong>for 5 years\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>SINCE\u003c/td> \u003ctd>Dùng để chỉ \u003cstrong>điểm thời gian\u003c/strong> bắt đầu\u003c/td> \u003ctd>I’ve been waiting \u003cstrong>since 3 o'clock\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>DURING\u003c/td> \u003ctd>Dùng để chỉ thời gian diễn ra \u003cstrong>một sự việc\u003c/strong>\u003c/td> \u003ctd>I stayed at home \u003cstrong>during the pandemic\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>BEFORE\u003c/td> \u003ctd>Dùng để chỉ thời gian \u003cstrong>trước khi\u003c/strong> một sự việc xảy ra\u003c/td> \u003ctd>Please arrive \u003cstrong>before 9 am\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>AFTER\u003c/td> \u003ctd>Dùng để chỉ thời gian \u003cstrong>sau khi\u003c/strong> một sự việc xảy ra\u003c/td> \u003ctd>We’ll have dinner \u003cstrong>after the movie\u003c/strong>.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Các giới từ chỉ nơi chốn thông dụng: IN, ON, AT, UNDER, ABOVE, BETWEEN, AMONG, NEAR\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Giới từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>IN\u003c/td> \u003ctd>Dùng với \u003cstrong>không gian kín\u003c/strong>, \u003cstrong>địa danh lớn\u003c/strong>\u003c/td> \u003ctd>\u003cem>in\u003c/em> a box, \u003cem>in\u003c/em> Vietnam, \u003cem>in\u003c/em> Asia, \u003cem>in\u003c/em> the world\u003c/td> \u003c/tr> \u003ctr> \u003ctd>ON\u003c/td> \u003ctd>Dùng với \u003cstrong>bề mặt\u003c/strong>, \u003cstrong>phương tiện giao thông công cộng\u003c/strong>\u003c/td> \u003ctd>\u003cem>on\u003c/em> the table, \u003cem>on\u003c/em> the wall, \u003cem>on\u003c/em> the bus, \u003cem>on\u003c/em> the train\u003c/td> \u003c/tr> \u003ctr> \u003ctd>AT\u003c/td> \u003ctd>Dùng với \u003cstrong>địa điểm cụ thể\u003c/strong>, \u003cstrong>địa chỉ\u003c/strong>\u003c/td> \u003ctd>\u003cem>at\u003c/em> home, \u003cem>at\u003c/em> school, \u003cem>at\u003c/em> the bus stop, \u003cem>at\u003c/em> 34 Linh Road\u003c/td> \u003c/tr> \u003ctr> \u003ctd>UNDER\u003c/td> \u003ctd>Dùng để chỉ vị trí \u003cstrong>bên dưới\u003c/strong>\u003c/td> \u003ctd>The cat is \u003cem>under\u003c/em> the table.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>ABOVE\u003c/td> \u003ctd>Dùng để chỉ vị trí \u003cstrong>bên trên\u003c/strong> (không tiếp xúc)\u003c/td> \u003ctd>The lamp is \u003cem>above\u003c/em> the table.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>BETWEEN\u003c/td> \u003ctd>Dùng để chỉ vị trí \u003cstrong>giữa hai\u003c/strong> đồ vật\u003c/td> \u003ctd>The book is \u003cem>between\u003c/em> the pen and the notebook.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>AMONG\u003c/td> \u003ctd>Dùng để chỉ vị trí \u003cstrong>giữa nhiều\u003c/strong> đồ vật\u003c/td> \u003ctd>She was standing \u003cem>among\u003c/em> a crowd of people.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>NEAR\u
