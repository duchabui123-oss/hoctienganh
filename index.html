all>ăn nhiều kẹo → get cavities: sâu răng\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>drink cold water\u003c/b>\u003csmall>uống nước lạnh → have a sore throat: đau họng\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>play with matches\u003c/b>\u003csmall>nghịch diêm → get a burn: bị bỏng\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>play with the stove\u003c/b>\u003csmall>nghịch bếp → get a burn: bị bỏng\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>play with the knife\u003c/b>\u003csmall>nghịch dao → cut yourself: đứt tay\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>climb the tree\u003c/b>\u003csmall>trèo cây → fall off and break your legs: ngã gãy chân\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>run down the stairs\u003c/b>\u003csmall>chạy xuống cầu thang → fall off: bị ngã\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k8\">\u003cb>ride your bike too fast\u003c/b>\u003csmall>đạp xe quá nhanh → fall off: bị ngã\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>Don&#x27;t play with the knife! – OK, I won&#x27;t.\u003c/li>\u003cli>Why shouldn&#x27;t I play with the knife? – Because you may cut yourself.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">7. Môn học\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">What subjects do you have today?\u003c/span>\u003cspan class=\"vm-a\">I have…\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>Vietnamese\u003c/b>\u003csmall>Tiếng Việt\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>Maths\u003c/b>\u003csmall>Toán\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>English\u003c/b>\u003csmall>Tiếng Anh\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>Science\u003c/b>\u003csmall>Khoa học\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>History\u003c/b>\u003csmall>Lịch sử\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>Geography\u003c/b>\u003csmall>Địa lí\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>Art\u003c/b>\u003csmall>Mĩ thuật\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k8\">\u003cb>Informatics\u003c/b>\u003csmall>Tin học\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k1\">\u003cb>PE (Physical Education)\u003c/b>\u003csmall>Thể dục\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>What subjects do you have today? – I have Maths and English.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">8. Đồ chơi\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">Do you have…? – Yes, I do. / No, I don&#x27;t.\u003c/span>\u003cspan class=\"vm-a\">Does he / she have…? – Yes, he / she does. / No, he / she doesn&#x27;t.\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>a teddy bear\u003c/b>\u003csmall>gấu bông\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>a doll\u003c/b>\u003csmall>búp bê\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>a car\u003c/b>\u003csmall>ô tô đồ chơi\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>a robot\u003c/b>\u003csmall>người máy\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>a puzzle\u003c/b>\u003csmall>trò xếp hình\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>a yo-yo\u003c/b>\u003csmall>con quay yo-yo\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>a ship\u003c/b>\u003csmall>tàu thủy\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k8\">\u003cb>a plane\u003c/b>\u003csmall>máy bay\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k1\">\u003cb>a kite\u003c/b>\u003csmall>con diều\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>Do you have a robot? – Yes, I do.\u003c/li>\u003cli>Does she have a doll? – No, she doesn&#x27;t.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"sc t5\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">9. Miêu tả người, vật\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">What does he / she / it look like?\u003c/span>\u003cspan class=\"vm-a\">He&#x27;s / She&#x27;s / It&#x27;s…\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>tall\u003c/b>\u003csmall>cao\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>short\u003c/b>\u003csmall>thấp\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>old\u003c/b>\u003csmall>già\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>young\u003c/b>\u003csmall>trẻ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>big\u003c/b>\u003csmall>to\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>small\u003c/b>\u003csmall>nhỏ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>slim\u003c/b>\u003csmall>mảnh mai\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k8\">\u003cb>strong\u003c/b>\u003csmall>khỏe\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k1\">\u003cb>thick\u003c/b>\u003csmall>dày\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>thin\u003c/b>\u003csmall>mỏng, gầy\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>What does your brother look like? – He&#x27;s tall and strong.\u003c/li>\u003cli>What does the book look like? – It&#x27;s thick.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">10. Đồ vật trong phòng\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">How many… are there? – There are…\u003c/span>\u003cspan class=\"vm-a\">Are there any… in the room? – Yes, there are. / No, there aren&#x27;t.\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>sofas\u003c/b>\u003csmall>ghế sofa\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>wardrobes\u003c/b>\u003csmall>tủ quần áo\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>cupboards\u003c/b>\u003csmall>tủ chạn\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>windows\u003c/b>\u003csmall>cửa sổ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>doors\u003c/b>\u003csmall>cửa ra vào\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>mirrors\u003c/b>\u003csmall>gương\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>maps\u003c/b>\u003csmall>bản đồ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k8\">\u003cb>fans\u003c/b>\u003csmall>quạt\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k1\">\u003cb>cups\u003c/b>\u003csmall>cái cốc\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>How many windows are there? – There are four windows.\u003c/li>\u003cli>Are there any maps in the room? – Yes, there are.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">11. Đồ dùng học tập\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">This / That is + my / his / her + …\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>pencil\u003c/b>\u003csmall>bút chì\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>pen\u003c/b>\u003csmall>bút mực\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>ruler\u003c/b>\u003csmall>thước kẻ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>rubber\u003c/b>\u003csmall>cục tẩy\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>pencil sharpener\u003c/b>\u003csmall>gọt bút chì\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>notebook\u003c/b>\u003csmall>vở\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>school bag\u003c/b>\u003csmall>cặp sách\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k8\">\u003cb>chalk\u003c/b>\u003csmall>phấn\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>This is my pencil.\u003c/li>\u003cli>That is her ruler.\u003c/li>\u003cli>This is his rubber.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">12. Ước mơ nghề nghiệp\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">What would you like to be in the future?\u003c/span>\u003cspan class=\"vm-a\">I&#x27;d like to be a / an…\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>pilot\u003c/b>\u003csmall>phi công → fly a plane: lái máy bay\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>nurse\u003c/b>\u003csmall>y tá → look after patients: chăm sóc bệnh nhân\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>writer\u003c/b>\u003csmall>nhà văn → write stories for children: viết truyện cho thiếu nhi\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>teacher\u003c/b>\u003csmall>giáo viên → teach students: dạy học sinh\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>artist\u003c/b>\u003csmall>họa sĩ → draw pictures: vẽ tranh\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>astronaut\u003c/b>\u003csmall>phi hành gia → travel into space: bay vào vũ trụ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>architect\u003c/b>\u003csmall>kiến trúc sư → design buildings: thiết kế nhà\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>What would you like to be in the future? – I&#x27;d like to be a pilot.\u003c/li>\u003cli>Why? – Because I&#x27;d like to fly a plane.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">13. Ngôi nhà của em\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">Is there a…?\u003c/span>\u003cspan class=\"vm-a\">Yes, there is. / No, there isn&#x27;t.\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>garden\u003c/b>\u003csmall>khu vườn\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>yard\u003c/b>\u003csmall>sân\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>gate\u003c/b>\u003csmall>cổng\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>fence\u003c/b>\u003csmall>hàng rào\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>tree\u003c/b>\u003csmall>cái cây\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>pond\u003c/b>\u003csmall>cái ao\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>living room\u003c/b>\u003csmall>phòng khách\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k8\">\u003cb>dining room\u003c/b>\u003csmall>phòng ăn\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k1\">\u003cb>kitchen\u003c/b>\u003csmall>nhà bếp\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>bedroom\u003c/b>\u003csmall>phòng ngủ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>bathroom\u003c/b>\u003csmall>phòng tắm\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>Is there a garden? – Yes, there is.\u003c/li>\u003cli>Is there a pond? – No, there isn&#x27;t.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"sc t5\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">14. Quần áo và giá tiền\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">How much is the…? – It&#x27;s…\u003c/span>\u003cspan class=\"vm-a\">How much are the…? – They&#x27;re…\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>scarf\u003c/b>\u003csmall>khăn quàng · 10.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>blouse\u003c/b>\u003csmall>áo sơ mi nữ · 70.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>jacket\u003c/b>\u003csmall>áo khoác · 70.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>skirt\u003c/b>\u003csmall>chân váy · 60.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>jumper\u003c/b>\u003csmall>áo len chui đầu · 80.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>T-shirt\u003c/b>\u003csmall>áo phông · 40.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>sweater\u003c/b>\u003csmall>áo len · 200.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k8\">\u003cb>jeans\u003c/b>\u003csmall>quần bò · 75.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k1\">\u003cb>trousers\u003c/b>\u003csmall>quần dài · 98.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>shoes\u003c/b>\u003csmall>giày · 93.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>sandals\u003c/b>\u003csmall>dép quai hậu · 85.000đ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>socks\u003c/b>\u003csmall>tất · 25.000đ\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>How much is the scarf? – It&#x27;s ten thousand dong.\u003c/li>\u003cli>How much are the shoes? – They&#x27;re ninety-three thousand dong.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"p-wfore2","menu":"m-aab5i6","title":"Các chủ đề thuyết trình tiếng Anh","html":"\u003cp class=\"lead\">Các bài nói ngắn để con tập thuyết trình bằng tiếng Anh. Phần 1 gồm 10 bài 10 câu cho người mới bắt đầu; phần 2 gồm 13 bài nói dài hơn để luyện nói liền mạch.\u003c/p>\u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bí quyết\u003c/span>\u003cp class=\"sc-title\">Cách tập một bài thuyết trình\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c4\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">1. Nghe\u003c/b>\u003cspan class=\"sc-txt\">Bấm nút loa, nghe cả bài 2–3 lần.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">2. Đọc theo\u003c/b>\u003cspan class=\"sc-txt\">Đọc to từng câu, chú ý trọng âm.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">3. Thay thông tin\u003c/b>\u003cspan class=\"sc-txt\">Đổi tên, tuổi, sở thích thành của chính mình.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">4. Nói không nhìn\u003c/b>\u003cspan class=\"sc-txt\">Nói lại cả bài, bố mẹ quay video để con tự xem.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Mở đầu bằng “Hello everyone. Today I'd like to tell you about…” và kết thúc bằng “Thank you for listening.”\u003c/p>\u003c/div>\u003ch2>Phần 1: 10 bài nói ngắn\u003c/h2>\u003ch3>Bài 1: My Best Friend (Bạn thân của em)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My best friend is Anna.\u003c/strong>\u003c/td>\u003ctd>Bạn thân của em tên là Anna.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>She is friendly and kind.\u003c/strong>\u003c/td>\u003ctd>Bạn ấy thân thiện và tốt bụng.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We study at the same school.\u003c/strong>\u003c/td>\u003ctd>Chúng em học cùng trường.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We sit together in class.\u003c/strong>\u003c/td>\u003ctd>Chúng em ngồi cùng nhau trong lớp.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We draw pictures together.\u003c/strong>\u003c/td>\u003ctd>Chúng em vẽ tranh cùng nhau.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Sometimes we play outside.\u003c/strong>\u003c/td>\u003ctd>Đôi khi chúng em chơi ngoài trời.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>She always makes me laugh.\u003c/strong>\u003c/td>\u003ctd>Bạn ấy luôn làm em cười.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I like talking to her.\u003c/strong>\u003c/td>\u003ctd>Em thích nói chuyện với bạn ấy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I am happy to have her.\u003c/strong>\u003c/td>\u003ctd>Em rất vui khi có bạn ấy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>She is a great friend.\u003c/strong>\u003c/td>\u003ctd>Bạn ấy là một người bạn tuyệt vời.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Bài 2: My Family (Gia đình em)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I have a happy family.\u003c/strong>\u003c/td>\u003ctd>Em có một gia đình hạnh phúc.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>There are four people in my family.\u003c/strong>\u003c/td>\u003ctd>Gia đình em có bốn người.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My father is funny.\u003c/strong>\u003c/td>\u003ctd>Bố em rất vui tính.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My mother is kind.\u003c/strong>\u003c/td>\u003ctd>Mẹ em rất hiền.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I have one brother.\u003c/strong>\u003c/td>\u003ctd>Em có một anh trai.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We eat dinner together.\u003c/strong>\u003c/td>\u003ctd>Gia đình em ăn tối cùng nhau.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We watch movies at home.\u003c/strong>\u003c/td>\u003ctd>Chúng em xem phim ở nhà.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I love my family very much.\u003c/strong>\u003c/td>\u003ctd>Em rất yêu gia đình của mình.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My family makes me happy.\u003c/strong>\u003c/td>\u003ctd>Gia đình làm em hạnh phúc.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I enjoy being with them.\u003c/strong>\u003c/td>\u003ctd>Em thích ở bên gia đình.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Bài 3: My Daily Routine (Một ngày của em)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I wake up at seven o&#x27;clock.\u003c/strong>\u003c/td>\u003ctd>Em thức dậy lúc bảy giờ.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I brush my teeth and wash my face.\u003c/strong>\u003c/td>\u003ctd>Em đánh răng và rửa mặt.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Then I eat breakfast.\u003c/strong>\u003c/td>\u003ctd>Sau đó em ăn sáng.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I go to school in the morning.\u003c/strong>\u003c/td>\u003ctd>Em đi học vào buổi sáng.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>After school, I play with my friends.\u003c/strong>\u003c/td>\u003ctd>Sau giờ học, em chơi với bạn bè.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I do my homework in the evening.\u003c/strong>\u003c/td>\u003ctd>Em làm bài tập vào buổi tối.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Sometimes I read books.\u003c/strong>\u003c/td>\u003ctd>Đôi khi em đọc sách.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I eat dinner with my family.\u003c/strong>\u003c/td>\u003ctd>Em ăn tối cùng gia đình.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I go to bed at nine o&#x27;clock.\u003c/strong>\u003c/td>\u003ctd>Em đi ngủ lúc chín giờ.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>This is my daily routine.\u003c/strong>\u003c/td>\u003ctd>Đó là lịch sinh hoạt hằng ngày của em.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Bài 4: My Favorite Food (Món ăn yêu thích)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My favorite food is pizza.\u003c/strong>\u003c/td>\u003ctd>Món ăn yêu thích của em là pizza.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Pizza is very delicious.\u003c/strong>\u003c/td>\u003ctd>Pizza rất ngon.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I like cheese pizza the most.\u003c/strong>\u003c/td>\u003ctd>Em thích pizza phô mai nhất.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Sometimes I eat pizza with my family.\u003c/strong>\u003c/td>\u003ctd>Đôi khi em ăn pizza cùng gia đình.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We usually eat it on weekends.\u003c/strong>\u003c/td>\u003ctd>Chúng em thường ăn vào cuối tuần.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>The pizza smells so good.\u003c/strong>\u003c/td>\u003ctd>Pizza có mùi rất thơm.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I also like chicken on pizza.\u003c/strong>\u003c/td>\u003ctd>Em cũng thích pizza có thịt gà.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Pizza makes me feel happy.\u003c/strong>\u003c/td>\u003ctd>Pizza làm em cảm thấy vui.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I want to eat it again.\u003c/strong>\u003c/td>\u003ctd>Em muốn được ăn lần nữa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>It is my favorite food.\u003c/strong>\u003c/td>\u003ctd>Đó là món ăn yêu thích của em.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Bài 5: My Hobby (Sở thích của em)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My hobby is drawing.\u003c/strong>\u003c/td>\u003ctd>Sở thích của em là vẽ tranh.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I draw pictures every day.\u003c/strong>\u003c/td>\u003ctd>Em vẽ tranh mỗi ngày.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I like drawing animals and flowers.\u003c/strong>\u003c/td>\u003ctd>Em thích vẽ động vật và hoa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Sometimes I draw my family.\u003c/strong>\u003c/td>\u003ctd>Đôi khi em vẽ gia đình của mình.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I use crayons and color pencils.\u003c/strong>\u003c/td>\u003ctd>Em dùng bút sáp và bút chì màu.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Drawing is very fun for me.\u003c/strong>\u003c/td>\u003ctd>Với em, vẽ tranh rất vui.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I feel happy when I draw.\u003c/strong>\u003c/td>\u003ctd>Em cảm thấy vui khi vẽ.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My friends like my pictures.\u003c/strong>\u003c/td>\u003ctd>Bạn bè thích tranh của em.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My mom says I draw very well.\u003c/strong>\u003c/td>\u003ctd>Mẹ nói em vẽ rất đẹp.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I love my hobby very much.\u003c/strong>\u003c/td>\u003ctd>Em rất yêu sở thích của mình.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Bài 6: My Pet (Thú cưng của em)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I have a small dog.\u003c/strong>\u003c/td>\u003ctd>Em có một chú chó nhỏ.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Its name is Cookie.\u003c/strong>\u003c/td>\u003ctd>Tên của nó là Cookie.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>It is white and cute.\u003c/strong>\u003c/td>\u003ctd>Nó màu trắng và rất dễ thương.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Cookie likes running around the house.\u003c/strong>\u003c/td>\u003ctd>Cookie thích chạy quanh nhà.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I play with my dog every day.\u003c/strong>\u003c/td>\u003ctd>Em chơi với chú chó mỗi ngày.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Sometimes I give it snacks.\u003c/strong>\u003c/td>\u003ctd>Đôi khi em cho nó ăn bánh.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Cookie is very friendly.\u003c/strong>\u003c/td>\u003ctd>Cookie rất thân thiện.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>It sleeps near my bed.\u003c/strong>\u003c/td>\u003ctd>Nó ngủ gần giường của em.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I love my pet very much.\u003c/strong>\u003c/td>\u003ctd>Em rất yêu thú cưng của mình.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My dog is my best buddy.\u003c/strong>\u003c/td>\u003ctd>Chú chó là người bạn thân nhất của em.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Bài 7: My Birthday (Sinh nhật của em)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My birthday is very special.\u003c/strong>\u003c/td>\u003ctd>Sinh nhật của em rất đặc biệt.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I celebrate it with my family.\u003c/strong>\u003c/td>\u003ctd>Em tổ chức sinh nhật cùng gia đình.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We eat cake together.\u003c/strong>\u003c/td>\u003ctd>Chúng em ăn bánh kem cùng nhau.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I get many birthday gifts.\u003c/strong>\u003c/td>\u003ctd>Em nhận được nhiều quà sinh nhật.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My friends come to my party.\u003c/strong>\u003c/td>\u003ctd>Bạn bè đến dự tiệc của em.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We play games and sing songs.\u003c/strong>\u003c/td>\u003ctd>Chúng em chơi trò chơi và hát.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I blow out the candles.\u003c/strong>\u003c/td>\u003ctd>Em thổi nến sinh nhật.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Everyone says happy birthday to me.\u003c/strong>\u003c/td>\u003ctd>Mọi người chúc mừng sinh nhật em.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I feel very excited and happy.\u003c/strong>\u003c/td>\u003ctd>Em cảm thấy rất vui và hào hứng.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My birthday is my favorite day.\u003c/strong>\u003c/td>\u003ctd>Sinh nhật là ngày em thích nhất.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Bài 8: My Dream Job (Nghề mơ ước)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My dream job is to be a doctor.\u003c/strong>\u003c/td>\u003ctd>Công việc mơ ước của em là trở thành bác sĩ.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I want to help sick people.\u003c/strong>\u003c/td>\u003ctd>Em muốn giúp đỡ những người bị bệnh.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Doctors are very kind and smart.\u003c/strong>\u003c/td>\u003ctd>Bác sĩ rất tốt bụng và thông minh.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>They work in hospitals.\u003c/strong>\u003c/td>\u003ctd>Họ làm việc trong bệnh viện.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I want to wear a white coat.\u003c/strong>\u003c/td>\u003ctd>Em muốn mặc áo blouse trắng.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I also want to help children.\u003c/strong>\u003c/td>\u003ctd>Em cũng muốn giúp đỡ trẻ em.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I will study hard every day.\u003c/strong>\u003c/td>\u003ctd>Em sẽ học chăm chỉ mỗi ngày.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My parents support my dream.\u003c/strong>\u003c/td>\u003ctd>Bố mẹ ủng hộ ước mơ của em.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I think being a doctor is wonderful.\u003c/strong>\u003c/td>\u003ctd>Em nghĩ làm bác sĩ thật tuyệt vời.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I hope my dream comes true.\u003c/strong>\u003c/td>\u003ctd>Em mong ước mơ của mình sẽ thành hiện thực.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Bài 9: My House (Ngôi nhà của em)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My house is not very big.\u003c/strong>\u003c/td>\u003ctd>Nhà của em không quá lớn.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>It is clean and cozy.\u003c/strong>\u003c/td>\u003ctd>Nó sạch sẽ và ấm cúng.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>There is a living room in my house.\u003c/strong>\u003c/td>\u003ctd>Nhà em có một phòng khách.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I like watching TV there.\u003c/strong>\u003c/td>\u003ctd>Em thích xem ti vi ở đó.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My bedroom is small but nice.\u003c/strong>\u003c/td>\u003ctd>Phòng ngủ của em nhỏ nhưng đẹp.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I sleep there every night.\u003c/strong>\u003c/td>\u003ctd>Em ngủ ở đó mỗi tối.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My family eats together in the kitchen.\u003c/strong>\u003c/td>\u003ctd>Gia đình em ăn cùng nhau trong bếp.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I like my house very much.\u003c/strong>\u003c/td>\u003ctd>Em rất thích ngôi nhà của mình.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I feel happy at home.\u003c/strong>\u003c/td>\u003ctd>Em cảm thấy hạnh phúc khi ở nhà.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My house is my favorite place.\u003c/strong>\u003c/td>\u003ctd>Nhà là nơi em thích nhất.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Bài 10: My School (Trường của em)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My school is big and beautiful.\u003c/strong>\u003c/td>\u003ctd>Trường của em lớn và đẹp.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I go to school every day.\u003c/strong>\u003c/td>\u003ctd>Em đi học mỗi ngày.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My teacher is very nice.\u003c/strong>\u003c/td>\u003ctd>Cô giáo của em rất tốt.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I have many friends at school.\u003c/strong>\u003c/td>\u003ctd>Em có nhiều bạn ở trường.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I like learning English.\u003c/strong>\u003c/td>\u003ctd>Em thích học tiếng Anh.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I also enjoy art class.\u003c/strong>\u003c/td>\u003ctd>Em cũng thích giờ mĩ thuật.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We play games at break time.\u003c/strong>\u003c/td>\u003ctd>Chúng em chơi trò chơi vào giờ ra chơi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>My classroom is clean.\u003c/strong>\u003c/td>\u003ctd>Lớp học của em rất sạch sẽ.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I feel happy at school.\u003c/strong>\u003c/td>\u003ctd>Em cảm thấy vui ở trường.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I love my school very much.\u003c/strong>\u003c/td>\u003ctd>Em rất yêu ngôi trường của mình.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>Phần 2: 13 bài nói dài\u003c/h2>\u003cp>Các bài dưới đây dài hơn, phù hợp với học sinh tiểu học lớp 3–5. Đọc phần tiếng Anh trước, xem phần dịch sau khi đã hiểu ý chính.\u003c/p>\u003ch3>Chủ đề 1: Family (Gia đình)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>Today I am happy to tell you about my family. My family is small. There are four people in my family: my father, my mother, my older sister and me. I don&#x27;t have any brothers. My father is tall and handsome. My mother is short but beautiful. My older sister is tall and pretty. I am the youngest in my family. I am big but cute. My father is a businessman, and my mother is a teacher. My sister is nine years old, and she is a pupil. I am two years younger than my sister. I am a pupil, too. My sister and I both study at Nguyen Trai Primary School. At the weekend, we love going to the supermarket and the park together. We often eat out at a small restaurant and play games at Ha Dong Funfair. I really love my family, and my family loves me too.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Hôm nay em rất vui được kể về gia đình mình. Nhà em có bốn người: bố, mẹ, chị gái và em; em không có anh em trai. Bố em cao và đẹp trai, mẹ em thấp nhưng xinh đẹp, chị em cao và xinh. Em là người nhỏ tuổi nhất nhà, em mũm mĩm nhưng dễ thương. Bố em là doanh nhân, mẹ em là giáo viên. Chị em chín tuổi và đang đi học; em kém chị hai tuổi và cũng là học sinh. Hai chị em cùng học trường Tiểu học Nguyễn Trãi. Cuối tuần, cả nhà thích đi siêu thị và đi công viên, thường ăn ở một nhà hàng nhỏ và chơi trò chơi ở khu vui chơi Hà Đông. Em rất yêu gia đình, và gia đình cũng rất yêu em.\u003c/em>\u003c/p>\u003ch3>Chủ đề 2: My House (Ngôi nhà của em)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>Today I&#x27;d like to tell you about my house. My house is small but nice. It has three floors and six rooms. The living room and the kitchen are downstairs. Two bedrooms and two bathrooms are upstairs. In the living room, there is a big TV, a big table, a sofa and two armchairs. I often watch TV and chat with my family here. In the kitchen, there is a big fridge next to the cupboard. The sink is next to the stove. There is a square table with six chairs in the middle of the room. My mom often cooks, and we have dinner together here. In the bathroom, there is a mirror, a shower, a sink, a toilet and a washing machine. My parents&#x27; bedroom is bigger than mine. I love my house very much.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Hôm nay em muốn kể về ngôi nhà của em. Nhà em nhỏ nhưng đẹp, có ba tầng và sáu phòng. Phòng khách và nhà bếp ở tầng dưới, hai phòng ngủ và hai phòng tắm ở tầng trên. Phòng khách có ti vi lớn, bàn lớn, ghế sofa và hai ghế bành; em thường xem ti vi và trò chuyện với gia đình ở đây. Trong bếp có tủ lạnh lớn đặt cạnh tủ chạn, bồn rửa cạnh bếp nấu, giữa phòng là chiếc bàn vuông với sáu chiếc ghế. Mẹ em thường nấu ăn và cả nhà ăn tối cùng nhau ở đây. Phòng tắm có gương, vòi sen, bồn rửa, bồn cầu và máy giặt. Phòng ngủ của bố mẹ rộng hơn phòng em. Em rất yêu ngôi nhà của mình.\u003c/em>\u003c/p>\u003ch3>Chủ đề 3: My Bedroom (Phòng ngủ của em)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>I&#x27;d like to tell you about my room. I have my own bedroom. I don&#x27;t share a bedroom with my sister. My bedroom is upstairs, next to my sister&#x27;s room. It is small but nice. There is a bed by the wall. A brown desk and a chair are in front of the window. The bookshelf is on the left, above the desk. The wardrobe is on the right. There is a big poster of my favorite singer on the wall. There is also a balcony outside my window. I put many flower pots there. I love watering the flowers and looking at them through the window. I sleep, study and read books in my bedroom. It&#x27;s not a big bedroom, but I like it.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Em muốn kể về phòng của em. Em có phòng ngủ riêng, không ở chung với chị. Phòng em ở tầng trên, cạnh phòng chị. Phòng nhỏ nhưng đẹp: giường kê sát tường, bàn học màu nâu và ghế đặt trước cửa sổ, giá sách ở bên trái phía trên bàn, tủ quần áo bên phải. Trên tường có tấm áp phích lớn về ca sĩ em yêu thích. Ngoài cửa sổ có ban công, em đặt nhiều chậu hoa ở đó; em thích tưới hoa và ngắm hoa qua cửa sổ. Em ngủ, học bài và đọc sách trong phòng. Phòng không rộng nhưng em rất thích.\u003c/em>\u003c/p>\u003ch3>Chủ đề 4: My Favorite Sport (Môn thể thao yêu thích)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>I like many sports, but I like football the most. I am good at playing football. I play football with my friends every Sunday morning on the school football field. I am good at kicking and scoring goals for my team, so I am the team captain. My team really likes me. After school, I practise with my neighbor, Hung. I also enjoy watching football matches on TV. My favorite team is Manchester United, and my favorite footballer is David Beckham. I have a collection of 100 cards about Manchester United players. I want to be a professional footballer when I grow up. I love everything about football.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Em thích nhiều môn thể thao nhưng thích bóng đá nhất. Em đá bóng giỏi. Sáng Chủ nhật nào em cũng đá bóng với bạn bè ở sân trường. Em sút và ghi bàn tốt nên được làm đội trưởng, các bạn trong đội rất quý em. Sau giờ học, em tập luyện cùng bạn hàng xóm tên Hùng. Em cũng thích xem bóng đá trên ti vi. Đội bóng em yêu thích là Manchester United và cầu thủ em yêu thích là David Beckham. Em có bộ sưu tập 100 tấm thẻ về các cầu thủ Manchester United. Lớn lên em muốn trở thành cầu thủ chuyên nghiệp. Em yêu mọi thứ về bóng đá.\u003c/em>\u003c/p>\u003ch3>Chủ đề 5: Summer Vacation (Kỳ nghỉ hè)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>Today I&#x27;m going to tell you about my last summer vacation. Last year, I went to the beach with my family for five days. We went there by plane. It was my first time, and I was very excited. We stayed in a hotel near the beach. It was really hot, and we swam in the pool and the sea every day. I liked the sea the most because of the waves. I tried surfing, but it was difficult. In the evening, we ate seafood at a restaurant, and then we went to the seafood market to buy some fish to bring home. We bought lots of presents and souvenirs for our friends and relatives. It was a brilliant holiday because I could watch the sunrise and sunset on the beach with my family, and we had a great time together.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Hôm nay em kể về kỳ nghỉ hè năm ngoái. Em cùng gia đình đi biển năm ngày, đi bằng máy bay. Đó là lần đầu tiên nên em rất háo hức. Cả nhà ở khách sạn gần biển. Trời rất nóng nên ngày nào chúng em cũng bơi ở hồ bơi và ở biển. Em thích biển nhất vì có sóng. Em thử lướt sóng nhưng khó quá. Buổi tối, cả nhà ăn hải sản ở nhà hàng rồi ra chợ hải sản mua cá mang về. Chúng em mua nhiều quà lưu niệm cho bạn bè và họ hàng. Đó là một kỳ nghỉ tuyệt vời vì em được ngắm bình minh, hoàng hôn trên biển cùng gia đình.\u003c/em>\u003c/p>\u003ch3>Chủ đề 6: My Favorite Food (Món ăn yêu thích)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>My favorite food is pizza. Pizza is good to eat. In fact, I love everything about pizza. The sauce and the cheese taste so good together. It is so delicious that it melts in my mouth. I like it with lots of thick cheese. My favorite part of pizza is the crust! My grandmother makes the best seafood pizza. She often makes pizza for dinner at the weekend. Nothing can beat pizza&#x27;s crunchy, cheesy goodness. Eating pizza makes my tummy happy. I like pizza the best.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Món ăn yêu thích của em là pizza. Em yêu mọi thứ về pizza: nước sốt và phô mai ăn cùng nhau rất ngon, ngon đến mức tan chảy trong miệng. Em thích pizza có thật nhiều phô mai. Phần em thích nhất là phần vỏ bánh giòn. Bà em làm pizza hải sản ngon nhất và thường làm cho cả nhà ăn tối cuối tuần. Không gì sánh được vị giòn, béo của pizza. Ăn pizza làm em thấy no bụng và vui. Em thích pizza nhất.\u003c/em>\u003c/p>\u003ch3>Chủ đề 7: Favorite Season (Mùa yêu thích)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>There are four seasons in a year: spring, summer, autumn and winter. My favorite season is summer. I like it because there is no school, and I can get up late during the long summer holiday. In summer, the weather is hot. The plants grow bigger, and I see many flowers and trees. I eat lots of my favorite fruits in summer, for example, mangoes, watermelons, oranges, pineapples and coconuts. I wear T-shirts and shorts. I go swimming at the swimming pool every day with my father. During the summer vacation, I go to the beach with my family. I swim, build sandcastles, play beach games with my family and relax on the warm sand. I like ice cream and cool drinks when the weather is hot, because they cool me down. I like summer vacation very much.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Một năm có bốn mùa: xuân, hạ, thu, đông. Mùa em thích nhất là mùa hè vì được nghỉ học và được ngủ dậy muộn trong kỳ nghỉ dài. Mùa hè trời nóng, cây cối lớn nhanh, có nhiều hoa và cây xanh. Em được ăn nhiều loại trái cây yêu thích như xoài, dưa hấu, cam, dứa, dừa. Em mặc áo phông và quần soóc, ngày nào cũng đi bơi với bố. Kỳ nghỉ hè, cả nhà đi biển: em bơi, xây lâu đài cát, chơi trò chơi trên bãi biển và nằm nghỉ trên cát ấm. Trời nóng em thích ăn kem và uống nước mát cho mát người. Em rất thích kỳ nghỉ hè.\u003c/em>\u003c/p>\u003ch3>Chủ đề 8: Farm Animal (Con vật ở trang trại)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>I will tell you about my favorite farm animal. There are many animals on a farm, such as cows, horses, pigs, sheep and goats, but my favorite animal is the cow. I have a cow at home. Its name is Moo. Here are the reasons why I love it. Firstly, it is very lovely, with black and white skin. It has four legs, two eyes, two ears, a big body and a tail. It is fat and strong. Secondly, I love to hear its sound. It says &quot;moo, moo&quot; very loudly. Moo can walk and run like me. I like eating many kinds of food, but Moo likes eating grass. Thirdly, it is very friendly. I often play with it in my free time. Moo has a baby, which is called a calf. The little calf is very cute. Finally, I love it because it gives milk. I like to drink milk every day. I love Moo very much.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Em sẽ kể về con vật em yêu thích ở trang trại. Trang trại có nhiều con vật như bò, ngựa, lợn, cừu, dê, nhưng em thích nhất là con bò. Nhà em có một con bò tên là Moo. Thứ nhất, Moo rất đáng yêu với bộ lông đen trắng; nó có bốn chân, hai mắt, hai tai, thân hình to và một cái đuôi, trông béo và khỏe. Thứ hai, em thích nghe nó kêu “moo, moo” thật to. Moo cũng đi và chạy như em, nhưng em ăn đủ thứ còn Moo thích ăn cỏ. Thứ ba, Moo rất thân thiện, em thường chơi với nó lúc rảnh. Moo có một bê con rất dễ thương. Cuối cùng, Moo cho sữa, và ngày nào em cũng uống sữa. Em rất yêu Moo.\u003c/em>\u003c/p>\u003ch3>Chủ đề 9: My School Object (Đồ dùng học tập)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>I&#x27;d like to tell you about my favorite pen. My grandpa gave it to me on my sixth birthday. It is a new, beautiful red fountain pen. It is long and thin. It is special to me because my grandpa bought it in the USA and sent it to me. I like it more than my old fountain pen because it helps me write more easily, and my handwriting looks nicer with rounder and smoother lines. I often use it to do my homework and write lessons in my notebook in class. I also love it because I don&#x27;t need to refill it so often. I fill it with ink once, and then I can use it for a month. It is very modern because it never lets ink drip onto my fingers. When I finish writing, I put it in a small red box. I really love it because it is a gift from my grandpa.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Em muốn kể về chiếc bút em thích nhất. Ông tặng em vào sinh nhật sáu tuổi. Đó là chiếc bút máy màu đỏ, mới và đẹp, dài và thon. Chiếc bút đặc biệt với em vì ông mua ở Mỹ và gửi về cho em. Em thích nó hơn chiếc bút cũ vì viết dễ hơn, nét chữ tròn và mềm mại hơn. Em thường dùng nó làm bài tập và ghi bài trên lớp. Em còn thích nó vì không phải bơm mực thường xuyên: bơm một lần dùng được cả tháng, lại không bao giờ rỉ mực ra tay. Viết xong, em cất bút vào chiếc hộp nhỏ màu đỏ. Em rất quý chiếc bút vì đó là quà của ông.\u003c/em>\u003c/p>\u003ch3>Chủ đề 10: Self Introduction (Giới thiệu bản thân)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>Hello everyone. Please let me introduce myself. My name is Rosie. I&#x27;m from Vietnam. I live with my family in Hanoi, the capital city. I go to Nguyen Trai Primary School, and I&#x27;m in the fourth grade. I&#x27;m good at running and playing basketball, but I&#x27;m not good at playing soccer, and I sometimes forget to do my homework. My favorite things are spaghetti, pepperoni pizza and riding roller coasters. In the future, I want to be a professional basketball player. I hope we&#x27;ll be good friends. Thank you.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Chào mọi người. Cho phép mình giới thiệu bản thân. Mình tên là Rosie, đến từ Việt Nam. Mình sống cùng gia đình ở thủ đô Hà Nội. Mình học lớp 4 trường Tiểu học Nguyễn Trãi. Mình chạy và chơi bóng rổ giỏi nhưng đá bóng chưa giỏi, và đôi khi quên làm bài tập. Mình thích mì Ý, pizza xúc xích cay và chơi tàu lượn siêu tốc. Sau này mình muốn trở thành vận động viên bóng rổ chuyên nghiệp. Mong chúng ta sẽ là bạn tốt. Cảm ơn mọi người.\u003c/em>\u003c/p>\u003ch3>Chủ đề 11: Hobbies and Interests (Sở thích)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>I enjoy different hobbies in my free time. On sunny days, I like swimming. On rainy days, I like watching movies. On windy days, I like flying kites. I like playing basketball. I&#x27;m very good at basketball because I&#x27;m very tall. Playing basketball is very good for my health. It keeps me fit and strong. I usually go to the park and play basketball. I also go to basketball training every Wednesday after school. I also play the violin. I practise with my music teacher on Tuesday afternoons. Stamp collecting is another favorite hobby of mine. I have over two thousand stamps from thirty countries. My dad gave me his old collection from when he was a child. Dad and I love collecting stamps together. I hope I will become a famous basketball player in the future.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Lúc rảnh em có nhiều sở thích: trời nắng em thích bơi, trời mưa em thích xem phim, trời gió em thích thả diều. Em thích chơi bóng rổ và chơi giỏi vì em cao. Bóng rổ rất tốt cho sức khỏe, giúp em khỏe mạnh và cân đối. Em thường ra công viên chơi bóng rổ và đi tập vào mỗi chiều thứ Tư sau giờ học. Em cũng chơi đàn violin, tập với thầy dạy nhạc vào chiều thứ Ba. Sưu tầm tem cũng là sở thích của em; em có hơn hai nghìn con tem từ ba mươi quốc gia. Bố đã tặng em bộ sưu tập từ hồi bố còn nhỏ, và hai bố con rất thích cùng sưu tầm tem. Em mong sau này sẽ trở thành cầu thủ bóng rổ nổi tiếng.\u003c/em>\u003c/p>\u003ch3>Chủ đề 12: Favorite Toy (Đồ chơi yêu thích)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>My favorite toy is very special to me. It is a teddy bear. It is white, and its name is Susie. It is very soft and big. It has two black eyes, two small round ears, two long legs and a small black nose. It is wearing a red dress with a red bow on its right ear. My mother gave me this toy on my sixth birthday, and I have had it since 2018. I often hug my teddy bear and play with it. I pretend to feed it, and I let it sleep in my bed. I often share it with my sister, and we play with it after school every day. It is my favorite toy because I spend most of my time playing with it. I think of it as a little baby in my house. I have had many toys, but this one can never be replaced.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Đồ chơi yêu thích của em rất đặc biệt. Đó là một chú gấu bông màu trắng tên là Susie, rất mềm và to. Gấu có hai mắt đen, hai tai nhỏ tròn, hai chân dài và chiếc mũi nhỏ màu đen. Gấu mặc váy đỏ, có nơ đỏ trên tai phải. Mẹ tặng em gấu vào sinh nhật sáu tuổi, em có nó từ năm 2018. Em thường ôm gấu, chơi với gấu, giả vờ cho gấu ăn và cho gấu ngủ trên giường em. Em hay cho chị chơi cùng, ngày nào hai chị em cũng chơi với gấu sau giờ học. Em coi gấu như em bé trong nhà. Em có nhiều đồ chơi nhưng không gì thay thế được chú gấu này.\u003c/em>\u003c/p>\u003ch3>Chủ đề 13: Body Parts (Các bộ phận cơ thể)\u003c/h3>\u003cblockquote class=\"talk\">\u003cp>Let me tell you about the parts of my body. I&#x27;ve got two eyes. I see with my eyes. I&#x27;ve got two ears. I hear with my ears. I&#x27;ve got one mouth. I eat with my teeth, and I taste with my tongue. I&#x27;ve got one nose. I smell with my nose. I&#x27;ve got two hands. I touch things with my fingers and hold things with my hands. I wave with my arms. I&#x27;ve got two legs. I walk and run with my legs and feet. Inside my body, there are many organs, such as the heart, kidneys, lungs and stomach. These are my body parts. I always eat healthy food such as fruit and vegetables, drink lots of water and do exercise, for example, swimming every day, to stay strong and keep fit.\u003c/p>\u003c/blockquote>\u003cp class=\"talk-vi\">\u003cem>Dịch: Mình sẽ kể về các bộ phận trên cơ thể. Mình có hai mắt để nhìn, hai tai để nghe, một cái miệng: mình ăn bằng răng và nếm bằng lưỡi. Mình có một cái mũi để ngửi. Mình có hai bàn tay: chạm bằng ngón tay, cầm đồ bằng bàn tay và vẫy bằng cánh tay. Mình có hai chân để đi và chạy. Bên trong cơ thể có nhiều cơ quan như tim, thận, phổi, dạ dày. Mình luôn ăn đồ ăn lành mạnh như trái cây, rau, uống nhiều nước và tập thể dục, ví dụ bơi mỗi ngày, để khỏe mạnh và cân đối.\u003c/em>\u003c/p>","order":0,"updated":"2026-10-26"},{"id":"p-ktbsc2","menu":"m-lowf4e","title":"14 ngày luyện nói tiếng Anh theo chủ đề","html":"\u003cp class=\"lead\">Lộ trình 14 ngày để bố mẹ nói tiếng Anh với con theo nhịp sinh hoạt trong ngày. Mỗi ngày một tình huống với 10 câu ngắn; cả ngày hôm đó, cứ gặp đúng tình huống là nói câu tiếng Anh.\u003c/p>\u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Lộ trình\u003c/span>\u003cp class=\"sc-title\">14 ngày\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">Ngày 1: Chào buổi sáng\u003c/span>\u003cspan class=\"sc-chip\">Ngày 2: Đánh răng, rửa mặt\u003c/span>\u003cspan class=\"sc-chip\">Ngày 3: Ăn sáng\u003c/span>\u003cspan class=\"sc-chip\">Ngày 4: Mặc quần áo\u003c/span>\u003cspan class=\"sc-chip\">Ngày 5: Đi học, ra ngoài\u003c/span>\u003cspan class=\"sc-chip\">Ngày 6: Chơi cùng con\u003c/span>\u003cspan class=\"sc-chip\">Ngày 7: Dọn dẹp đồ chơi\u003c/span>\u003cspan class=\"sc-chip\">Ngày 8: Cảm xúc\u003c/span>\u003cspan class=\"sc-chip\">Ngày 9: Ăn trưa, ăn tối\u003c/span>\u003cspan class=\"sc-chip\">Ngày 10: Uống nước\u003c/span>\u003cspan class=\"sc-chip\">Ngày 11: Đi vệ sinh\u003c/span>\u003cspan class=\"sc-chip\">Ngày 12: Tắm rửa\u003c/span>\u003cspan class=\"sc-chip\">Ngày 13: Khen ngợi, động viên\u003c/span>\u003cspan class=\"sc-chip\">Ngày 14: Đi ngủ\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Buổi tối, đọc trước 10 câu của ngày hôm sau. Hết 14 ngày thì quay lại ngày 1; lần thứ hai con sẽ trả lời được nhiều hơn.\u003c/p>\u003c/div>\u003ch3>Ngày 1: Chào buổi sáng\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Good morning, sweetie.\u003c/strong>\u003c/td>\u003ctd>Chào buổi sáng, con yêu.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Did you sleep well?\u003c/strong>\u003c/td>\u003ctd>Con ngủ ngon không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Wake up, please.\u003c/strong>\u003c/td>\u003ctd>Dậy thôi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Open your eyes.\u003c/strong>\u003c/td>\u003ctd>Mở mắt ra nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Stretch your body.\u003c/strong>\u003c/td>\u003ctd>Vươn vai nào con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Give me a hug.\u003c/strong>\u003c/td>\u003ctd>Ôm mẹ một cái nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s get up.\u003c/strong>\u003c/td>\u003ctd>Mình dậy nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>It&#x27;s a beautiful day.\u003c/strong>\u003c/td>\u003ctd>Hôm nay là một ngày đẹp trời.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Are you ready?\u003c/strong>\u003c/td>\u003ctd>Con sẵn sàng chưa?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I love you so much.\u003c/strong>\u003c/td>\u003ctd>Mẹ yêu con nhiều lắm.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Ngày 2: Đánh răng, rửa mặt\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s brush your teeth.\u003c/strong>\u003c/td>\u003ctd>Mình đánh răng nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put toothpaste on the toothbrush.\u003c/strong>\u003c/td>\u003ctd>Cho kem đánh răng lên bàn chải nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Brush up and down.\u003c/strong>\u003c/td>\u003ctd>Chải lên xuống nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Brush your front teeth.\u003c/strong>\u003c/td>\u003ctd>Chải răng phía trước nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Brush your back teeth.\u003c/strong>\u003c/td>\u003ctd>Chải răng phía trong nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Rinse your mouth.\u003c/strong>\u003c/td>\u003ctd>Súc miệng đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Spit it out.\u003c/strong>\u003c/td>\u003ctd>Nhổ ra nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Wash your face.\u003c/strong>\u003c/td>\u003ctd>Rửa mặt đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Wipe your face with the towel.\u003c/strong>\u003c/td>\u003ctd>Lau mặt bằng khăn nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>You look fresh now.\u003c/strong>\u003c/td>\u003ctd>Giờ con trông tươi tỉnh rồi đó.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Ngày 3: Ăn sáng\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Are you hungry?\u003c/strong>\u003c/td>\u003ctd>Con đói chưa?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s have breakfast.\u003c/strong>\u003c/td>\u003ctd>Mình ăn sáng nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Sit down, please.\u003c/strong>\u003c/td>\u003ctd>Con ngồi xuống nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Here is your breakfast.\u003c/strong>\u003c/td>\u003ctd>Bữa sáng của con đây.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Try this, please.\u003c/strong>\u003c/td>\u003ctd>Con thử món này nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Eat slowly.\u003c/strong>\u003c/td>\u003ctd>Ăn chậm thôi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Chew your food well.\u003c/strong>\u003c/td>\u003ctd>Nhai kỹ nhé con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Is it yummy?\u003c/strong>\u003c/td>\u003ctd>Ngon không con?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Do you want more?\u003c/strong>\u003c/td>\u003ctd>Con muốn thêm không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>You ate very well.\u003c/strong>\u003c/td>\u003ctd>Hôm nay con ăn giỏi lắm.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Ngày 4: Mặc quần áo\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s get dressed.\u003c/strong>\u003c/td>\u003ctd>Mình mặc quần áo nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Take off your pajamas.\u003c/strong>\u003c/td>\u003ctd>Cởi đồ ngủ ra nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put on your shirt.\u003c/strong>\u003c/td>\u003ctd>Mặc áo vào con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put on your pants.\u003c/strong>\u003c/td>\u003ctd>Mặc quần vào con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put on your socks.\u003c/strong>\u003c/td>\u003ctd>Mang tất vào con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Where are your shoes?\u003c/strong>\u003c/td>\u003ctd>Giày của con đâu rồi?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let me help you.\u003c/strong>\u003c/td>\u003ctd>Để mẹ giúp con nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Stand still, please.\u003c/strong>\u003c/td>\u003ctd>Đứng yên một chút nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>You look so nice.\u003c/strong>\u003c/td>\u003ctd>Con trông đẹp quá.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Now you are ready.\u003c/strong>\u003c/td>\u003ctd>Giờ con sẵn sàng rồi.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Ngày 5: Đi học, ra ngoài\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>It&#x27;s time to go.\u003c/strong>\u003c/td>\u003ctd>Đến giờ đi rồi.\u003c/td>\u003c/tr>\u00 function sha256(bytes){

/* ===== speech: Vietnamese + English voices ===== */
const hasTTS = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
const VI_CH = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;
const VI_PLAIN = new Set("anh em con cho khi hay theo tin sinh xin nhanh thanh trong hoa sao".split(" "));
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || []; }catch(e){ voices = []; } }
if(hasTTS){ loadVoices(); try{ speechSynthesis.addEventListener("voiceschanged", loadVoices); }catch(e){} }
/* rank voices: neural/online voices sound most human; old desktop voices last */
function voiceScore(v, lang){
  const n = v.name || "";
  let sc = 0;
  if(/Natural|Neural|Online/i.test(n)) sc += 100;
  if(/Enhanced|Premium|Nâng cao|Siri/i.test(n)) sc += 70;
  if(/Google/i.test(n)) sc += 50;
  if(lang === "vi" && /HoaiMy|Hoài My|NamMinh|Nam Minh|Linh|Lan/i.test(n)) sc += 30;
  if(lang === "en" && /^en[-_]US/i.test(v.lang)) sc += 20;
  if(lang === "en" && /Aria|Jenny|Guy|Ava|Samantha|Allison/i.test(n)) sc += 15;
  if(/Microsoft (An|David|Zira|Mark)\b/i.test(n) && !/Online|Natural/i.test(n)) sc -= 40;
  if(v.localService === false) sc += 5;
  return sc;
}
function voicesOf(lang){
  const re = lang === "vi" ? /^vi/i : /^en/i;
  return voices.filter(v => re.test(v.lang)).sort((a, b) => voiceScore(b, lang) - voiceScore(a, lang));
}
function voiceFor(lang){
  const list = voicesOf(lang); if(!list.length) return null;
  const want = lang === "vi" ? prefs.viVoice : prefs.enVoice;
  return (want && list.find(v => v.name === want)) || list[0];
}
const hasVi = () => !!voiceFor("vi");
const isNatural = v => !!v && voiceScore(v, /^vi/i.test(v.lang) ? "vi" : "en") >= 50;
const prefs = { rate: store.get("tanm-rate", 0.9), vi: store.get("tanm-vi", true), auto: store.get("tanm-auto", false),
  viVoice: store.get("tanm-vivoice", ""), enVoice: store.get("tanm-envoice", "") };
/* Vietnamese voices sound most natural near normal speed; English stays a little slower for learners */
const rateFor = (lang, r) => lang === "vi" ? Math.min(1.2, r + 0.12) : r;
function normVi(t){
  return t.replace(/\s*\/\s*/g, " hoặc ").replace(/&/g, " và ").replace(/…|\.\.\./g, ". ").replace(/\bVD:/g, "Ví dụ:")
    .replace(/(\d+)\s*[-–]\s*(\d+)/g, "$1 đến $2").replace(/[“”"«»*_#|]/g, " ").replace(/\s+/g, " ").trim();
}
function normEn(t){
  return t.replace(/\s\+\s/g, ", ").replace(/V-ing/g, "V ing").replace(/…|\.\.\./g, ". ").replace(/[“”"*_#|]/g, " ").replace(/\s+/g, " ").trim();
}

/* split mixed text into Vietnamese / English runs */
function segments(text){
  text = String(text).replace(/[→⇒➔⟶]/g, ", ").replace(/\s+/g, " ").trim();
  const runs = [];
  for(const tok of (text.match(/\S+/g) || [])){
    const w = tok.replace(/[^\p{L}]/gu, "");
    const lang = !w ? null : (VI_CH.test(w) || VI_PLAIN.has(w.toLowerCase()) ? "vi" : "en");
    const last = runs[runs.length - 1];
    if(!lang){ if(last) last.t += " " + tok; else runs.push({lang: null, t: tok}); continue; }
    if(last && (last.lang === lang || last.lang === null)){ last.lang = lang; last.t += " " + tok; }
    else runs.push({lang, t: tok});
  }
  // an unaccented Vietnamese word (ra, sau, ngay…) sitting inside Vietnamese text joins its neighbours
  const VI_SYL = /^(ngh|ng|nh|ch|tr|th|kh|ph|gi|qu|[bcdghklmnpqrstvx])?[aeiouy]{1,3}(ng|nh|ch|[cmnpt]|[iouy])?$/i;
  for(let k = 1; k < runs.length - 1; k++){
    const r = runs[k], ws = r.t.split(" ").map(w => w.replace(/[^\p{L}]/gu, "")).filter(Boolean);
    if(r.lang === "en" && runs[k - 1].lang === "vi" && runs[k + 1].lang === "vi" && ws.length <= 2 && ws.every(w => w.length > 1 && w === w.toLowerCase() && VI_SYL.test(w))){
      runs[k - 1].t += " " + r.t + " " + runs[k + 1].t; runs.splice(k, 2); k--;
    }
  }
  for(let k = 1; k < runs.length - 1; k++){
    const r = runs[k];
    if(r.lang === "en" && runs[k - 1].lang === "vi" && runs[k + 1].lang === "vi" && /^\S{1,2}[,.:]?$/.test(r.t.trim())){
      runs[k - 1].t += " " + r.t + " " + runs[k + 1].t; runs.splice(k, 2); k--;
    }
  }
  return runs.filter(r => r.lang && /\p{L}/u.test(r.t)).map(r => ({lang: r.lang, t: (r.lang === "en" ? r.t.replace(/\//g, ", ") : r.t).replace(/[()"“”]/g, " ").replace(/\s+/g, " ").trim()}));
}
const isEnRun = r => r.lang === "en" && (r.t.match(/[A-Za-z]{2,}/g) || []).length >= 2 && /[a-z]{3,}/.test(r.t);
const SIGN_SAY = {pos: "Khẳng định.", neg: "Phủ định.", q: "Nghi vấn.", wh: "Câu hỏi W H."};
function speechText(el, opts){
  const c = el.cloneNode(true);
  c.querySelectorAll(".say").forEach(x => x.remove());
  if(opts && opts.noLists) c.querySelectorAll("ul,ol").forEach(x => x.remove());
  c.querySelectorAll(".sign,.sc-sign").forEach(x => { const k = ["pos", "neg", "q", "wh"].find(k => x.classList.contains(k)); x.replaceWith(" " + (SIGN_SAY[k] || "") + " "); });
  if(c.tagName === "TR") return [...c.children].map(td => td.textContent.trim()).filter(Boolean).join(". ");
  return c.textContent;
}
function chunks(t){
  if(t.length < 220) return [t];
  const out = []; let buf = "";
  for(const s of (t.match(/[^.!?;]+[.!?;]*/g) || [t])){ if((buf + s).length > 220 && buf){ out.push(buf.trim()); buf = ""; } buf += s; }
  if(buf.trim()) out.push(buf.trim());
  return out;
}

let speakToken = 0, keepU = null;
function stopSpeech(){ speakToken++; try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll(".say.playing").forEach(b => b.classList.remove("playing")); }
function speakParts(parts, rate, onDone){
  if(!hasTTS){ toast("Thiết bị này chưa hỗ trợ đọc to."); return; }
  const my = ++speakToken; try{ speechSynthesis.cancel(); }catch(e){}
  const q = [];
  for(const p of parts){
    const v = voiceFor(p.lang); if(p.lang === "vi" && !v) continue;
    const txt = p.lang === "vi" ? normVi(p.t) : normEn(p.t); if(!/\p{L}/u.test(txt)) continue;
    for(const t of chunks(txt)) q.push({lang: p.lang, t, v});
  }
  if(!q.length){ setTimeout(() => onDone && onDone(), 0); return; }
  // queue every sentence up front so the engine flows from one to the next without pauses
  keepU = [];
  setTimeout(() => {
    if(my !== speakToken) return;
    q.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p.t);
      u.lang = p.lang === "vi" ? "vi-VN" : "en-US"; if(p.v) u.voice = p.v; u.rate = rateFor(p.lang, rate); u.pitch = 1;
      if(i === q.length - 1){ u.onend = () => { if(my === speakToken) onDone && onDone(); }; u.onerror = e => { if(my === speakToken && e.error !== "interrupted" && e.error !== "canceled") onDone && onDone(); }; }
      keepU.push(u); try{ speechSynthesis.speak(u); }catch(e){}
    });
  }, 40);
}
function sayEnglish(text, btn){
  stopSpeech();
  let parts = segments(text).filter(r => r.lang === "en"); if(!parts.length) parts = [{lang: "en", t: text}];
  if(btn) btn.classList.add("playing");
  speakParts(parts, prefs.rate, () => btn && btn.classList.remove("playing"));
}

/* speaker buttons next to every English sentence */
function decorate(pr){
  // word / sentence tables: one button per row, reading the English column
  pr.querySelectorAll("table.say1 tbody tr, table.say2 tbody tr, table.say3 tbody tr").forEach(tr => {
    const tb = tr.closest("table"), cells = [...tr.children]; if(!cells.length) return;
    const n = tb.classList.contains("say3") ? 3 : tb.classList.contains("say2") ? 2 : 1;
    const target = cells[Math.min(n, cells.length) - 1];
    const text = (n === 3 ? cells.slice(0, 3).map(c => c.textContent.trim()).join(", ") : target.textContent.trim()).replace(/\s+/g, " ");
    if(!/[A-Za-z]/.test(text)) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "say"; b.title = "Nghe"; b.setAttribute("aria-label", "Nghe: " + text); b.innerHTML = I.speak; b.dataset.say = text;
    target.appendChild(b);
  });
  const units = [...pr.querySelectorAll("li,p,td,.sc-ex,.sc-txt,figcaption")].filter(el => !el.closest("thead") && !el.closest("table.say1,table.say2,table.say3,.talk-vi") && !el.querySelector("li,p,td,.sc-ex,.sc-txt,.fx"));
  for(const el of units){
    const runs = segments(speechText(el)).filter(isEnRun);
    if(!runs.length) continue;
    const b = document.createElement("button");
    b.type = "button"; b.className = "say"; b.title = "Nghe câu tiếng Anh"; b.setAttribute("aria-label", "Nghe câu tiếng Anh"); b.innerHTML = I.speak;
    b.dataset.say = runs.map(r => r.t).join(". ");
    el.appendChild(b);
  }
  pr.querySelectorAll(".vm-leaf").forEach(t => { const w = t.querySelector("b"); if(!w) return;
    t.classList.add("say-tile"); t.setAttribute("role", "button"); t.tabIndex = 0; t.title = "Bấm để nghe"; t.dataset.say = w.textContent.trim(); });
  pr.querySelectorAll(".sc-tile").forEach(t => { const L = t.querySelector("b"), w = t.querySelector("small"); if(!L || !w) return;
    t.classList.add("say-tile"); t.setAttribute("role", "button"); t.tabIndex = 0; t.title = "Bấm để nghe";
    t.dataset.say = L.textContent.trim().charAt(0) + ". " + w.textContent.trim(); });
}
document.addEventListener("click", e => {
