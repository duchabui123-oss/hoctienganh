003c/td> \u003ctd>Dùng để chỉ vị trí \u003cstrong>gần\u003c/strong>\u003c/td> \u003ctd>The park is \u003cem>near\u003c/em> my house.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Các giới từ chỉ sự di chuyển , phương hướng (TO, FROM, INTO, OUT OF, ACROSS, THROUGH)\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Giới từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>TO\u003c/td> \u003ctd>Chỉ \u003cstrong>hướng đến\u003c/strong>, \u003cstrong>điểm đến\u003c/strong>\u003c/td> \u003ctd>She went \u003cem>to\u003c/em> school.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>FROM\u003c/td> \u003ctd>Chỉ \u003cstrong>điểm xuất phát\u003c/strong>\u003c/td> \u003ctd>He came \u003cem>from\u003c/em> Hanoi.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>INTO\u003c/td> \u003ctd>Chỉ chuyển động từ ngoài \u003cstrong>vào trong\u003c/strong>\u003c/td> \u003ctd>She walked \u003cem>into\u003c/em> the room.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>OUT OF\u003c/td> \u003ctd>Chỉ chuyển động từ \u003cstrong>trong\u003c/strong> ra \u003cstrong>ngoài\u003c/strong>\u003c/td> \u003ctd>He ran \u003cem>out of\u003c/em> the building.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>ACROSS\u003c/td> \u003ctd>Chỉ chuyển động \u003cstrong>vượt qua\u003c/strong> bề mặt\u003c/td> \u003ctd>We walked \u003cem>across\u003c/em> the bridge.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>THROUGH\u003c/td> \u003ctd>Chỉ chuyển động \u003cstrong>xuyên qua\u003c/strong>\u003c/td> \u003ctd>The light shines \u003cem>through\u003c/em> the window.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Cụm giới từ (Prepositional Phrases) và chức năng\u003c/h3> \u003cp>\u003cstrong>Cụm giới từ\u003c/strong> gồm một giới từ và một danh từ (hoặc đại từ). Cụm này có thể đóng vai trò như tính từ hoặc trạng từ trong câu.\u003c/p> \u003cul> \u003cli>Cụm giới từ đóng vai trò \u003cstrong>tính từ\u003c/strong>: bổ nghĩa cho danh từ \u003cul> \u003cli>The man \u003cstrong>in the blue shirt\u003c/strong> is my teacher. (bổ nghĩa cho \"man\")\u003c/li> \u003c/ul>\u003c/li> \u003cli>Cụm giới từ đóng vai trò \u003cstrong>trạng từ\u003c/strong>: bổ nghĩa cho động từ \u003cul> \u003cli>She swims \u003cstrong>in the morning\u003c/strong>. (bổ nghĩa cho \"swims\")\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Giới từ: thời gian, nơi chốn, hướng đi\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cp class=\"sc-label\">Thời gian: từ rộng đến hẹp\u003c/p>\u003cdiv class=\"sc-nest\">\u003cdiv class=\"n1\">\u003cb>IN\u003c/b>\u003cspan>tháng, năm, mùa, thế kỷ, buổi trong ngày\u003c/span>\u003cem>in May · in 2025 · in the morning\u003c/em>\u003c/div>\u003cdiv class=\"n2\">\u003cb>ON\u003c/b>\u003cspan>thứ, ngày cụ thể\u003c/span>\u003cem>on Monday · on May 1st\u003c/em>\u003c/div>\u003cdiv class=\"n3\">\u003cb>AT\u003c/b>\u003cspan>giờ, thời điểm\u003c/span>\u003cem>at 8 o'clock · at night\u003c/em>\u003c/div>\u003c/div>\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Nơi chốn\u003c/b>\u003cspan class=\"sc-txt\">IN trong không gian kín · ON trên bề mặt · AT tại một điểm\u003c/span>\u003cspan class=\"sc-ex\">in the box · on the table · at school\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Vị trí khác\u003c/b>\u003cspan class=\"sc-txt\">under (dưới) · above (trên) · between (giữa 2) · among (giữa nhiều) · near (gần)\u003c/span>\u003cspan class=\"sc-ex\">The cat is \u003cb>under\u003c/b> the table.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Hướng đi\u003c/b>\u003cspan class=\"sc-txt\">to (đến) · from (từ) · into (vào trong) · out of (ra ngoài) · across (băng qua) · through (xuyên qua)\u003c/span>\u003cspan class=\"sc-ex\">She walked \u003cb>into\u003c/b> the room.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Khoảng thời gian\u003c/b>\u003cspan class=\"sc-txt\">for (bao lâu) · since (từ mốc) · during (trong suốt) · before / after\u003c/span>\u003cspan class=\"sc-ex\">for 5 years · since 3 o'clock\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Cụm giới từ có thể làm tính từ (The man \u003cb>in the blue shirt\u003c/b>) hoặc trạng từ (She swims \u003cb>in the morning\u003c/b>).\u003c/p>\u003c/div>","order":0,"updated":"2026-10-24"},{"id":"bai-lien-tu","menu":"lien-tu","title":"Liên từ (Conjunctions)","html":"\u003cp>\u003cstrong>Liên từ\u003c/strong> là các từ dùng để kết nối từ, cụm từ, mệnh đề hoặc câu. Liên từ giúp tạo nên sự mạch lạc và liên kết giữa các ý tưởng. Các loại liên từ bao gồm: liên từ kết hợp, liên từ tương quan, và liên từ phụ thuộc.\u003c/p> \u003ch3>Liên từ kết hợp (Coordinating Conjunctions - FANBOYS: For, And, Nor, But, Or, Yet, So)\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Liên từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ý nghĩa / Chức năng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>F\u003c/strong>or\u003c/td> \u003ctd>vì, bởi vì (chỉ nguyên nhân)\u003c/td> \u003ctd>I was late, \u003cstrong>for\u003c/strong> I missed the bus.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>A\u003c/strong>nd\u003c/td> \u003ctd>và (chỉ sự bổ sung)\u003c/td> \u003ctd>He likes tea \u003cstrong>and\u003c/strong> coffee.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>N\u003c/strong>or\u003c/td> \u003ctd>cũng không (dùng sau mệnh đề phủ định)\u003c/td> \u003ctd>She doesn’t like coffee, \u003cstrong>nor\u003c/strong> does she like tea.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>B\u003c/strong>ut\u003c/td> \u003ctd>nhưng (chỉ sự tương phản)\u003c/td> \u003ctd>He is rich, \u003cstrong>but\u003c/strong> he is not happy.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>O\u003c/strong>r\u003c/td> \u003ctd>hoặc (chỉ sự lựa chọn)\u003c/td> \u003ctd>You can have tea \u003cstrong>or\u003c/strong> coffee.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Y\u003c/strong>et\u003c/td> \u003ctd>tuy nhiên (chỉ sự tương phản mạnh hơn “but”)\u003c/td> \u003ctd>He tried hard, \u003cstrong>yet\u003c/strong> he failed.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>S\u003c/strong>o\u003c/td> \u003ctd>vì vậy (chỉ kết quả)\u003c/td> \u003ctd>It was raining, \u003cstrong>so\u003c/strong> I took an umbrella.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Liên từ tương quan (Correlative Conjunctions - either...or, neither...nor, both...and, not only...but also) – Giới thiệu cơ bản\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Liên từ tương quan\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ý nghĩa / Chức năng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>either… or\u003c/strong>\u003c/td> \u003ctd>hoặc… hoặc (chỉ sự lựa chọn giữa hai thứ)\u003c/td> \u003ctd>\u003cstrong>Either\u003c/strong> you go \u003cstrong>or\u003c/strong> I go.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>neither… nor\u003c/strong>\u003c/td> \u003ctd>không… cũng không (phủ định cả hai)\u003c/td> \u003ctd>He speaks \u003cstrong>neither\u003c/strong> English \u003cstrong>nor\u003c/strong> French.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>both… and\u003c/strong>\u003c/td> \u003ctd>cả… và (chỉ hai thứ cùng đúng)\u003c/td> \u003ctd>She likes \u003cstrong>both\u003c/strong> dogs \u003cstrong>and\u003c/strong> cats.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>not only… but also\u003c/strong>\u003c/td> \u003ctd>không chỉ… mà còn (nhấn mạnh cả hai)\u003c/td> \u003ctd>He is \u003cstrong>not only\u003c/strong> intelligent \u003cstrong>but also\u003c/strong> hardworking.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Liên từ phụ thuộc (Subordinating Conjunctions) cơ bản (because, since, as, although, though, while, when, if, unless)\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Liên từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ý nghĩa\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>because\u003c/strong>\u003c/td> \u003ctd>vì\u003c/td> \u003ctd>He stayed home \u003cstrong>because\u003c/strong> it was raining.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>since\u003c/strong>\u003c/td> \u003ctd>kể từ khi / vì\u003c/td> \u003ctd>\u003cstrong>Since\u003c/strong> he moved to Hanoi, we have rarely met.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>as\u003c/strong>\u003c/td> \u003ctd>vì\u003c/td> \u003ctd>\u003cstrong>As\u003c/strong> it was late, we decided to stay overnight.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>although\u003c/strong> / \u003cstrong>though\u003c/strong>\u003c/td> \u003ctd>mặc dù\u003c/td> \u003ctd>\u003cstrong>Although\u003c/strong> it was raining, she went out.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>while\u003c/strong>\u003c/td> \u003ctd>trong khi\u003c/td> \u003ctd>I watched TV \u003cstrong>while\u003c/strong> she was cooking.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>when\u003c/strong>\u003c/td> \u003ctd>khi\u003c/td> \u003ctd>Call me \u003cstrong>when\u003c/strong> you arrive.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>if\u003c/strong>\u003c/td> \u003ctd>nếu\u003c/td> \u003ctd>I will go \u003cstrong>if\u003c/strong> I have time.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>unless\u003c/strong>\u003c/td> \u003ctd>trừ khi\u003c/td> \u003ctd>I won’t go \u003cstrong>unless\u003c/strong> you come with me.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>after\u003c/strong>\u003c/td> \u003ctd>sau khi\u003c/td> \u003ctd>He went home \u003cstrong>after\u003c/strong> he finished work.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>before\u003c/strong>\u003c/td> \u003ctd>trước khi\u003c/td> \u003ctd>Wash your hands \u003cstrong>before\u003c/strong> you eat.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t5\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Liên từ: nối ý cho mạch lạc\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cp class=\"sc-label\">Liên từ kết hợp: nhớ chữ FANBOYS\u003c/p>\u003cdiv class=\"sc-fan\">\u003cspan>\u003cb>F\u003c/b>or\u003csmall>vì\u003c/small>\u003c/span>\u003cspan>\u003cb>A\u003c/b>nd\u003csmall>và\u003c/small>\u003c/span>\u003cspan>\u003cb>N\u003c/b>or\u003csmall>cũng không\u003c/small>\u003c/span>\u003cspan>\u003cb>B\u003c/b>ut\u003csmall>nhưng\u003c/small>\u003c/span>\u003cspan>\u003cb>O\u003c/b>r\u003csmall>hoặc\u003c/small>\u003c/span>\u003cspan>\u003cb>Y\u003c/b>et\u003csmall>tuy nhiên\u003c/small>\u003c/span>\u003cspan>\u003cb>S\u003c/b>o\u003csmall>vì vậy\u003c/small>\u003c/span>\u003c/div>\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Đi theo cặp\u003c/b>\u003cspan class=\"sc-txt\">either…or · neither…nor · both…and · not only…but also\u003c/span>\u003cspan class=\"sc-ex\">She likes \u003cb>both\u003c/b> dogs \u003cb>and\u003c/b> cats.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Chỉ lý do\u003c/b>\u003cspan class=\"sc-txt\">because · since · as\u003c/span>\u003cspan class=\"sc-ex\">He stayed home \u003cb>because\u003c/b> it rained.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Chỉ sự trái ngược\u003c/b>\u003cspan class=\"sc-txt\">although · though\u003c/span>\u003cspan class=\"sc-ex\">\u003cb>Although\u003c/b> it was raining, she went out.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k6\">\u003cb class=\"sc-term\">Chỉ thời gian\u003c/b>\u003cspan class=\"sc-txt\">when · while · before · after\u003c/span>\u003cspan class=\"sc-ex\">Call me \u003cb>when\u003c/b> you arrive.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k7\">\u003cb class=\"sc-term\">Chỉ điều kiện\u003c/b>\u003cspan class=\"sc-txt\">if · unless\u003c/span>\u003cspan class=\"sc-ex\">I'll go \u003cb>if\u003c/b> I have time.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-than-tu","menu":"than-tu","title":"Thán từ (Interjections)","html":"\u003cp>\u003cstrong>Thán từ\u003c/strong> là những từ hoặc cụm từ ngắn dùng để biểu lộ cảm xúc mạnh hoặc đột ngột. Chúng thường đứng một mình hoặc ở đầu câu, phân cách với phần còn lại bằng dấu phẩy hoặc dấu chấm than.\u003c/p> \u003ch3>Một số thán từ phổ biến:\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thán từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ý nghĩa / Chức năng\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>Wow!\u003c/strong>\u003c/td> \u003ctd>Biểu thị sự \u003cstrong>ngạc nhiên\u003c/strong>, \u003cstrong>kinh ngạc\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Oh!\u003c/strong>\u003c/td> \u003ctd>Biểu thị nhiều cảm xúc như \u003cstrong>bất ngờ\u003c/strong>, \u003cstrong>đau đớn\u003c/strong>, \u003cstrong>vui mừng\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Ouch!\u003c/strong>\u003c/td> \u003ctd>Biểu thị \u003cstrong>đau đớn\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Ah!\u003c/strong>\u003c/td> \u003ctd>Biểu thị sự \u003cstrong>hiểu ra\u003c/strong>, \u003cstrong>ngạc nhiên\u003c/strong>, hoặc \u003cstrong>hài lòng\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Hmm\u003c/strong>\u003c/td> \u003ctd>Biểu thị sự \u003cstrong>suy nghĩ\u003c/strong> hoặc \u003cstrong>nghi ngờ\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Oops!\u003c/strong>\u003c/td> \u003ctd>Biểu thị \u003cstrong>lỗi nhỏ\u003c/strong> hoặc sự \u003cstrong>bối rối\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Hurray!\u003c/strong> / \u003cstrong>Hooray!\u003c/strong>\u003c/td> \u003ctd>Biểu thị \u003cstrong>niềm vui\u003c/strong>, \u003cstrong>ăn mừng\u003c/strong>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Alas!\u003c/strong>\u003c/td> \u003ctd>Biểu thị \u003cstrong>nỗi buồn\u003c/strong> hoặc \u003cstrong>tiếc nuối\u003c/strong> (thường dùng trong văn chương)\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div>","order":0,"updated":"2026-10-24"},{"id":"bai-cau-truc-cau","menu":"cau-truc-cau","title":"Cấu trúc ngữ pháp tiếng Anh cơ bản","html":"\u003cp>Phần này hướng dẫn cách ghép các loại từ thành câu hoàn chỉnh. Câu tiếng Anh được xây dựng theo một số mẫu cố định; nắm được các mẫu này là đặt được hầu hết các câu thông dụng.\u003c/p> \u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Lộ trình\u003c/span>\u003cp class=\"sc-title\">Lộ trình phần Cấu trúc câu\u003c/p>\u003cp class=\"sc-sub\">Học lần lượt từ trên xuống, bấm vào từng ô để mở bài.\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-road\">\u003ca class=\"sc-step\" href=\"#thanh-phan-cau\">\u003cb>1\u003c/b>\u003cspan>Thành phần câu\u003csmall>S, V, O, C, P là gì\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"sc-step\" href=\"#cau-don\">\u003cb>2\u003c/b>\u003cspan>5 cấu trúc câu đơn\u003csmall>S+V, S+V+O…\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"sc-step\" href=\"#dat-cau-hoi\">\u003cb>3\u003c/b>\u003cspan>Đặt câu hỏi\u003csmall>Yes/No và Wh-\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"sc-step\" href=\"#cau-phu-dinh\">\u003cb>4\u003c/b>\u003cspan>Câu phủ định\u003csmall>not, don't, didn't\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"sc-step\" href=\"#menh-lenh\">\u003cb>5\u003c/b>\u003cspan>Mệnh lệnh, yêu cầu\u003csmall>Close the door. Please…\u003c/small>\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-24"},{"id":"bai-thanh-phan-cau","menu":"thanh-phan-cau","title":"Thành phần chính của câu","html":"\u003cp>Một câu tiếng Anh hoàn chỉnh gồm các thành phần sau:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thành phần\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ký hiệu\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Chức năng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>Chủ ngữ (Subject)\u003c/strong>\u003c/td> \u003ctd>S\u003c/td> \u003ctd>Người hoặc vật thực hiện hành động hoặc là trung tâm của câu\u003c/td> \u003ctd>\u003cstrong>John\u003c/strong> plays soccer.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Vị ngữ (Predicate)\u003c/strong>\u003c/td> \u003ctd>P\u003c/td> \u003ctd>Phần còn lại của câu, bao gồm động từ và các thành phần khác\u003c/td> \u003ctd>John \u003cstrong>plays soccer\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Động từ (Verb)\u003c/strong>\u003c/td> \u003ctd>V\u003c/td> \u003ctd>Thành phần chính của vị ngữ, diễn tả hành động hoặc trạng thái\u003c/td> \u003ctd>John \u003cstrong>plays\u003c/strong> soccer.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Tân ngữ (Object)\u003c/strong>\u003c/td> \u003ctd>O\u003c/td> \u003ctd>Người hoặc vật chịu tác động của hành động\u003c/td> \u003ctd>John plays \u003cstrong>soccer\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Bổ ngữ (Complement)\u003c/strong>\u003c/td> \u003ctd>C\u003c/td> \u003ctd>Thông tin bổ sung cho chủ ngữ hoặc tân ngữ\u003c/td> \u003ctd>He is \u003cstrong>a doctor\u003c/strong>.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-cau-don","menu":"cau-don","title":"5 cấu trúc câu đơn cơ bản","html":"\u003cp>Tiếng Anh có 5 \u003cstrong>cấu trúc câu\u003c/strong> đơn cơ bản. Hiểu rõ 5 cấu trúc này sẽ giúp bạn dễ dàng xây dựng hầu hết các câu thông dụng:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ký hiệu\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Mô tả\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Cấu trúc 1\u003c/td> \u003ctd>S + V\u003c/td> \u003ctd>Chủ ngữ + Động từ (nội động từ, không cần tân ngữ)\u003c/td> \u003ctd>Birds \u003cstrong>fly\u003c/strong>.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Cấu trúc 2\u003c/td> \u003ctd>S + V + O\u003c/td> \u003ctd>Chủ ngữ + Động từ + Tân ngữ trực tiếp (ngoại động từ, cần tân ngữ)\u003c/td> \u003ctd>She \u003cstrong>reads\u003c/strong> books.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Cấu trúc 3\u003c/td> \u003ctd>S + V + C\u003c/td> \u003ctd>Chủ ngữ + Động từ “to be” hoặc động từ nối + Bổ ngữ (tính từ hoặc danh từ)\u003c/td> \u003ctd>She \u003cstrong>is\u003c/strong> beautiful.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Cấu trúc 4\u003c/td> \u003ctd>S + V + A\u003c/td> \u003ctd>Chủ ngữ + Động từ + Trạng ngữ (thêm thông tin về thời gian, nơi chốn, cách thức…)\u003c/td> \u003ctd>They \u003cstrong>live\u003c/strong> in Hanoi.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Cấu trúc 5\u003c/td> \u003ctd>S + V + O + O\u003c/td> \u003ctd>Chủ ngữ + Động từ + Tân ngữ gián tiếp + Tân ngữ trực tiếp (khi động từ có hai tân ngữ: người nhận và vật nhận)\u003c/td> \u003ctd>She \u003cstrong>gave\u003c/strong> me a book.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">5 kiểu câu đơn\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-pats\">\u003cdiv class=\"sc-prow\">\u003ccode class=\"sc-code\">S + V\u003c/code>\u003cspan class=\"sc-pat\">\u003cspan class=\"sc-w k2\">\u003cb>Birds\u003c/b>\u003csmall>S\u003c/small>\u003c/span>\u003cspan class=\"sc-w k3\">\u003cb>fly.\u003c/b>\u003csmall>V\u003c/small>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"sc-prow\">\u003ccode class=\"sc-code\">S + V + O\u003c/code>\u003cspan class=\"sc-pat\">\u003cspan class=\"sc-w k2\">\u003cb>She\u003c/b>\u003csmall>S\u003c/small>\u003c/span>\u003cspan class=\"sc-w k3\">\u003cb>reads\u003c/b>\u003csmall>V\u003c/small>\u003c/span>\u003cspan class=\"sc-w k1\">\u003cb>books.\u003c/b>\u003csmall>O\u003c/small>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"sc-prow\">\u003ccode class=\"sc-code\">S + V + C\u003c/code>\u003cspan class=\"sc-pat\">\u003cspan class=\"sc-w k2\">\u003cb>She\u003c/b>\u003csmall>S\u003c/small>\u003c/span>\u003cspan class=\"sc-w k3\">\u003cb>is\u003c/b>\u003csmall>V\u003c/small>\u003c/span>\u003cspan class=\"sc-w k4\">\u003cb>beautiful.\u003c/b>\u003csmall>C\u003c/small>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"sc-prow\">\u003ccode class=\"sc-code\">S + V + A\u003c/code>\u003cspan class=\"sc-pat\">\u003cspan class=\"sc-w k2\">\u003cb>They\u003c/b>\u003csmall>S\u003c/small>\u003c/span>\u003cspan class=\"sc-w k3\">\u003cb>live\u003c/b>\u003csmall>V\u003c/small>\u003c/span>\u003cspan class=\"sc-w k5\">\u003cb>in Hanoi.\u003c/b>\u003csmall>A\u003c/small>\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"sc-prow\">\u003ccode class=\"sc-code\">S + V + O + O\u003c/code>\u003cspan class=\"sc-pat\">\u003cspan class=\"sc-w k2\">\u003cb>She\u003c/b>\u003csmall>S\u003c/small>\u003c/span>\u003cspan class=\"sc-w k3\">\u003cb>gave\u003c/b>\u003csmall>V\u003c/small>\u003c/span>\u003cspan class=\"sc-w k1\">\u003cb>me\u003c/b>\u003csmall>O\u003c/small>\u003c/span>\u003cspan class=\"sc-w k1\">\u003cb>a book.\u003c/b>\u003csmall>O\u003c/small>\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">S chủ ngữ · V động từ · O tân ngữ · C bổ ngữ · A trạng ngữ\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-dat-cau-hoi","menu":"dat-cau-hoi","title":"Cách đặt câu hỏi","html":"\u003cp>\u003cstrong>Đặt câu hỏi\u003c/strong> là kỹ năng thiết yếu trong giao tiếp. Có hai loại câu hỏi chính: câu hỏi Yes/No và câu hỏi Wh-.\u003c/p> \u003ch3>1. Câu hỏi Yes/No\u003c/h3> \u003cp>Câu hỏi Yes/No với động từ \"To Be\" và Động từ thường (sử dụng trợ động từ do/does/did) như sau:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Loại động từ\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Dạng câu\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd rowspan=\"2\">Động từ to be\u003c/td> \u003ctd>Khẳng định\u003c/td> \u003ctd>S + be + bổ ngữ\u003c/td> \u003ctd>She is happy.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Nghi vấn\u003c/td> \u003ctd>Be + S + bổ ngữ?\u003c/td> \u003ctd>Is she happy?\u003c/td> \u003c/tr> \u003ctr> \u003ctd rowspan=\"2\">Động từ thường (hiện tại đơn)\u003c/td> \u003ctd>Khẳng định\u003c/td> \u003ctd>S + V(s/es)\u003c/td> \u003ctd>He works in a bank.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Nghi vấn\u003c/td> \u003ctd>Do/Does + S + V-inf?\u003c/td> \u003ctd>Does he work in a bank?\u003c/td> \u003c/tr> \u003ctr> \u003ctd rowspan=\"2\">Động từ thường (quá khứ đơn)\u003c/td> \u003ctd>Khẳng định\u003c/td> \u003ctd>S + V2 / V-ed\u003c/td> \u003ctd>They went to school.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Nghi vấn\u003c/td> \u003ctd>Did + S + V-inf?\u003c/td> \u003ctd>Did they go to school?\u003c/td> \u003c/tr> \u003ctr> \u003ctd rowspan=\"2\">Động từ khiếm khuyết (can, will, should…)\u003c/td> \u003ctd>Khẳng định\u003c/td> \u003ctd>S + Modal + V-inf\u003c/td> \u003ctd>You can swim.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Nghi vấn\u003c/td> \u003ctd>Modal + S + V-inf?\u003c/td> \u003ctd>Can you swim?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>2. Câu hỏi với từ để hỏi (Wh-questions)\u003c/h3> \u003cp>Cấu trúc câu hỏi với từ để hỏi (wh-questions):\u003c/p>\u003col> \u003cli>Với động từ \"to be\": \u003cul> \u003cli>Wh- + be + S + ...?\u003c/li> \u003cli>\u003cstrong>Where\u003c/strong> is your house?\u003c/li> \u003c/ul>\u003c/li> \u003cli>Với động từ thường: \u003cul> \u003cli>Wh- + do/does/did + S + V-inf + ...?\u003c/li> \u003cli>\u003cstrong>What\u003c/strong> do you do every day?\u003c/li> \u003cli>\u003cstrong>Where\u003c/strong> did they go yesterday?\u003c/li> \u003c/ul>\u003c/li> \u003cli>Với động từ khiếm khuyết: \u003cul> \u003cli>Wh- + modal + S + V-inf + ...?\u003c/li> \u003cli>\u003cstrong>When\u003c/strong> can you come?\u003c/li> \u003c/ul>\u003c/li> \u003c/ol> \u003cp>Các từ để hỏi phổ biến:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Từ hỏi\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Dùng để hỏi\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Who\u003c/td> \u003ctd>Người\u003c/td> \u003ctd>\u003cstrong>Who\u003c/strong> is that man?\u003c/td> \u003c/tr> \u003ctr> \u003ctd>What\u003c/td> \u003ctd>Vật, việc\u003c/td> \u003ctd>\u003cstrong>What\u003c/strong> do you want?\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Where\u003c/td> \u003ctd>Nơi chốn\u003c/td> \u003ctd>\u003cstrong>Where\u003c/strong> do you live?\u003c/td> \u003c/tr> \u003ctr> \u003ctd>When\u003c/td> \u003ctd>Thời gian\u003c/td> \u003ctd>\u003cstrong>When\u003c/strong> does the movie start?\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Why\u003c/td> \u003ctd>Lý do\u003c/td> \u003ctd>\u003cstrong>Why\u003c/strong> are you late?\u003c/td> \u003c/tr> \u003ctr> \u003ctd>How\u003c/td> \u003ctd>Cách thức, tình trạng\u003c/td> \u003ctd>\u003cstrong>How\u003c/strong> did you do it?\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Which\u003c/td> \u003ctd>Lựa chọn\u003c/td> \u003ctd>\u003cstrong>Which\u003c/strong> book do you prefer?\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Whose\u003c/td> \u003ctd>Sở hữu\u003c/td> \u003ctd>\u003cstrong>Whose\u003c/strong> pen is this?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Đặt câu hỏi\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-forms\">\u003cp class=\"sc-label\">Câu hỏi Yes/No: đưa trợ động từ lên đầu\u003c/p>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Be + S + …?\u003c/code>\u003cspan class=\"sc-ex\">She is happy. → \u003cb>Is\u003c/b> she happy?\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Do / Does + S + V?\u003c/code>\u003cspan class=\"sc-ex\">He works. → \u003cb>Does\u003c/b> he work?\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Did + S + V?\u003c/code>\u003cspan class=\"sc-ex\">They went. → \u003cb>Did\u003c/b> they go?\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Can / Will … + S + V?\u003c/code>\u003cspan class=\"sc-ex\">You can swim. → \u003cb>Can\u003c/b> you swim?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"sc-forms\">\u003cp class=\"sc-label\">Câu hỏi Wh-: thêm từ để hỏi vào trước\u003c/p>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign wh\">Wh-\u003c/span>\u003ccode class=\"sc-code\">Wh- + be + S?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>Where\u003c/b> is your house?\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign wh\">Wh-\u003c/span>\u003ccode class=\"sc-code\">Wh- + do/does/did + S + V?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>What\u003c/b> do you do every day?\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign wh\">Wh-\u003c/span>\u003ccode class=\"sc-code\">Wh- + can/will + S + V?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>When\u003c/b> can you come?\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">8 từ để hỏi\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">Who: ai\u003c/span>\u003cspan class=\"sc-chip\">What: cái gì\u003c/span>\u003cspan class=\"sc-chip\">Where: ở đâu\u003c/span>\u003cspan class=\"sc-chip\">When: khi nào\u003c/span>\u003cspan class=\"sc-chip\">Why: tại sao\u003c/span>\u003cspan class=\"sc-chip\">How: thế nào\u003c/span>\u003cspan class=\"sc-chip\">Which: cái nào\u003c/span>\u003cspan class=\"sc-chip\">Whose: của ai\u003c/span>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-cau-phu-dinh","menu":"cau-phu-dinh","title":"Câu phủ định","html":"\u003cp>\u003cstrong>Câu phủ định trong tiếng Anh\u003c/strong> được hình thành bằng cách thêm \"not\" sau động từ \"to be\" hoặc trợ động từ.\u003c/p> \u003ch3>1. Câu phủ định với động từ \"To Be\" (is not, are not, am not)\u003c/h3> \u003cul> \u003cli>Với am: I \u003cstrong>am not\u003c/strong> (I'm not) happy.\u003c/li> \u003cli>Với is: She \u003cstrong>is not\u003c/strong> (isn't) a student.\u003c/li> \u003cli>Với are: They \u003cstrong>are not\u003c/strong> (aren't) at home.\u003c/li> \u003cli>Với was: He \u003cstrong>was not\u003c/strong> (wasn't) there.\u003c/li> \u003cli>Với were: You \u003cstrong>were not\u003c/strong> (weren't) ready.\u003c/li> \u003c/ul> \u003ch3>2. Câu phủ định với động từ thường (do not, does not, did not + V-inf)\u003c/h3> \u003cul> \u003cli>Với thì hiện tại đơn: \u003cul> \u003cli>Ngôi 1, 2, số nhiều: I/You/We/They \u003cstrong>do not\u003c/strong> (don't) like coffee.\u003c/li> \u003cli>Ngôi 3 số ít: He/She/It \u003cstrong>does not\u003c/strong> (doesn't) like coffee.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Với thì quá khứ đơn: \u003cul> \u003cli>Tất cả các ngôi: I/You/He/She/It/We/They \u003cstrong>did not\u003c/strong> (didn't) go to school yesterday.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Với các động từ khiếm khuyết: \u003cul> \u003cli>He \u003cstrong>cannot\u003c/strong> (can't) swim.\u003c/li> \u003cli>They \u003cstrong>will not\u003c/strong> (won't) come.\u003c/li> \u003cli>She \u003cstrong>should not\u003c/strong> (shouldn't) do that.\u003c/li> \u003c/ul>\u003c/li> \u003c/ul>","order":0,"updated":"2026-10-26"},{"id":"bai-menh-lenh","menu":"menh-lenh","title":"Mệnh lệnh và yêu cầu","html":"\u003cp>\u003cstrong>Câu mệnh lệnh\u003c/strong> dùng để đưa ra chỉ dẫn, yêu cầu, lời khuyên hoặc mệnh lệnh. Câu mệnh lệnh thường không có chủ ngữ, bắt đầu bằng động từ nguyên mẫu.\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Loại câu\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Mệnh lệnh khẳng định\u003c/td> \u003ctd>V-inf + …\u003c/td> \u003ctd>Ra lệnh, hướng dẫn, yêu cầu trực tiếp\u003c/td> \u003ctd>Close the door.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Mệnh lệnh phủ định\u003c/td> \u003ctd>Don’t + V-inf + …\u003c/td> \u003ctd>Cấm đoán, yêu cầu không làm\u003c/td> \u003ctd>Don’t open the window.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Yêu cầu lịch sự\u003c/td> \u003ctd>Please + V-inf + …\u003c/td> \u003ctd>Yêu cầu nhẹ nhàng, lịch sự\u003c/td> \u003ctd>Please wait here.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Lời khuyên / gợi ý\u003c/td> \u003ctd>V-inf + …\u003c/td> \u003ctd>Đưa ra lời khuyên, đề xuất\u003c/td> \u003ctd>Try this dress. It looks nice.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-cac-thi","menu":"cac-thi","title":"Các thì trong tiếng Anh","html":"\u003cp>\u003cstrong>Thì\u003c/strong> là cách đổi dạng động từ để cho biết việc xảy ra khi nào: trong quá khứ, hiện tại hay tương lai. Tiếng Anh có 12 thì; trang này chọn ra 10 thì thường gặp nhất, đi từ dễ đến khó.\u003c/p>","order":0,"updated":"2026-10-24"},{"id":"bai-hien-tai-don","menu":"hien-tai-don","title":"Thì hiện tại đơn (Present Simple)","html":"\u003cp>\u003cstrong>Thì hiện tại đơn\u003c/strong> diễn tả hành động thường xuyên xảy ra, thói quen, chân lý, sự thật hiển nhiên.\u003c/p> \u003ch4>Cấu trúc:\u003c/h4> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Động từ thường\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Động từ To-be\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>(+) Khẳng định\u003c/td> \u003ctd>S + V(s/es)\u003c/td> \u003ctd>S + am/is/are\u003c/td> \u003ctd>\u003cul> \u003cli>I/You/We/They \u003cstrong>work\u003c/strong> every day.\u003c/li> \u003cli>He/She/It \u003cstrong>works\u003c/strong> every day.\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(-) Phủ định\u003c/td> \u003ctd>S + do/does + not + V(nguyên thể)\u003c/td> \u003ctd>S + am/is/are + not\u003c/td> \u003ctd>\u003cul> \u003cli>I/You/We/They \u003cstrong>don't work\u003c/strong> every day.\u003c/li> \u003cli>He/She/It \u003cstrong>doesn't work\u003c/strong> every day.\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(?) Nghi vấn\u003c/td> \u003ctd>Do/Does + S + V(nguyên thể)?\u003c/td> \u003ctd>Am/Is/Are + S ...?\u003c/td> \u003ctd>\u003cul> \u003cli>\u003cstrong>Do\u003c/strong> I/you/we/they work every day?\u003c/li> \u003cli>\u003cstrong>Does\u003c/strong> he/she/it work every day?\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch4>Cách dùng:\u003c/h4> \u003cul> \u003cli>Diễn tả thói quen, hành động lặp đi lặp lại \u003cul> \u003cli>I \u003cstrong>go\u003c/strong> to the gym three times a week.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả sự thật, chân lý phổ quát \u003cul> \u003cli>The sun \u003cstrong>rises\u003c/strong> in the east.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả lịch trình, thời gian biểu \u003cul> \u003cli>The train \u003cstrong>leaves\u003c/strong> at 8 PM.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả cảm xúc, trạng thái, ý kiến ở hiện tại \u003cul> \u003cli>I \u003cstrong>like\u003c/strong> chocolate. / She \u003cstrong>thinks\u003c/strong> it's a good idea.\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003ch4>Dấu hiệu nhận biết:\u003c/h4> \u003cul> \u003cli>always, usually, often, sometimes, rarely, never\u003c/li> \u003cli>every day/week/month/year\u003c/li> \u003cli>once/twice a week\u003c/li> \u003cli>on Mondays/Tuesdays...\u003c/li> \u003c/ul> \u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Hiện tại đơn\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-forms\">\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign pos\">(+)\u003c/span>\u003ccode class=\"sc-code\">S + V(s/es) · S + am/is/are\u003c/code>\u003cspan class=\"sc-ex\">He \u003cb>works\u003c/b> every day.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign neg\">(−)\u003c/span>\u003ccode class=\"sc-code\">S + don't/doesn't + V · S + am/is/are + not\u003c/code>\u003cspan class=\"sc-ex\">She \u003cb>doesn't work\u003c/b> on Sunday.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Do/Does + S + V? · Am/Is/Are + S…?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>Does\u003c/b> he \u003cb>work\u003c/b> here?\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dùng khi\u003c/p>\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Thói quen\u003c/b>\u003cspan class=\"sc-ex\">I go to the gym 3 times a week.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Sự thật\u003c/b>\u003cspan class=\"sc-ex\">The sun rises in the east.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Lịch trình\u003c/b>\u003cspan class=\"sc-ex\">The train leaves at 8 PM.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Cảm xúc, ý kiến\u003c/b>\u003cspan class=\"sc-ex\">I like chocolate.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dấu hiệu\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">always\u003c/span>\u003cspan class=\"sc-chip\">usually\u003c/span>\u003cspan class=\"sc-chip\">often\u003c/span>\u003cspan class=\"sc-chip\">sometimes\u003c/span>\u003cspan class=\"sc-chip\">rarely\u003c/span>\u003cspan class=\"sc-chip\">never\u003c/span>\u003cspan class=\"sc-chip\">every day\u003c/span>\u003cspan class=\"sc-chip\">twice a week\u003c/span>\u003cspan class=\"sc-chip\">on Mondays\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">He / She / It thì động từ thêm \u003cb>s/es\u003c/b>: go → go\u003cb>es\u003c/b>, watch → watch\u003cb>es\u003c/b>.\u003c/p>\u003c/div>","order":0,"updated":"2026-10-24"},{"id":"bai-hien-tai-tiep-dien","menu":"hien-tai-tiep-dien","title":"Thì hiện tại tiếp diễn (Present Continuous)","html":"\u003cp>\u003cstrong>Thì hiện tại tiếp diễn\u003c/strong> diễn tả hành động đang xảy ra tại thời điểm nói, hoặc kế hoạch trong tương lai gần đã được sắp xếp.\u003c/p> \u003ch4>Cấu trúc:\u003c/h4> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>(+) Khẳng định\u003c/td> \u003ctd>S + am/is/are + V-ing\u003c/td> \u003ctd>I am working now.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(-) Phủ định\u003c/td> \u003ctd>S + am/is/are + not + V-ing\u003c/td> \u003ctd>He/She/It is not working now.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(?) Nghi vấn\u003c/td> \u003ctd>Am/Is/Are + S + V-ing?\u003c/td> \u003ctd>Are you/we/they working now?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch4>Cách dùng:\u003c/h4> \u003cul> \u003cli>Diễn tả hành động đang xảy ra tại thời điểm nói \u003cul> \u003cli>She \u003cstrong>is studying\u003c/strong> right now.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả kế hoạch, sắp xếp trong tương lai gần \u003cul> \u003cli>I \u003cstrong>am meeting\u003c/strong> John tomorrow.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả hành động tạm thời \u003cul> \u003cli>He \u003cstrong>is staying\u003c/strong> with his parents until he finds a new apartment.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả sự phàn nàn khi dùng với \"always\" \u003cul> \u003cli>She \u003cstrong>is always complaining\u003c/strong> about the weather.\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Dấu hiệu nhận biết:\u003c/strong> now, right now, at the moment, at present, Look!, Listen!, Keep silent!\u003c/p> \u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Hiện tại tiếp diễn\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-forms\">\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign pos\">(+)\u003c/span>\u003ccode class=\"sc-code\">S + am/is/are + V-ing\u003c/code>\u003cspan class=\"sc-ex\">I \u003cb>am working\u003c/b> now.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign neg\">(−)\u003c/span>\u003ccode class=\"sc-code\">S + am/is/are + not + V-ing\u003c/code>\u003cspan class=\"sc-ex\">She \u003cb>isn't working\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Am/Is/Are + S + V-ing?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>Are\u003c/b> they \u003cb>working\u003c/b>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"sc-tlw\">\u003cdiv class=\"sc-tl\">\u003cspan class=\"tl-axis\">\u003c/span>\u003cspan class=\"tl-span from-30 to-70 k-b\">\u003cspan>hành động đang làm dở\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-50 k-now\">\u003ci>\u003c/i>\u003cspan>BÂY GIỜ\u003csmall>đang diễn ra\u003c/small>\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dùng khi\u003c/p>\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Đang xảy ra lúc nói\u003c/b>\u003cspan class=\"sc-ex\">She is studying right now.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Kế hoạch gần\u003c/b>\u003cspan class=\"sc-ex\">I am meeting John tomorrow.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Tạm thời\u003c/b>\u003cspan class=\"sc-ex\">He is staying with his parents.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Phàn nàn (với always)\u003c/b>\u003cspan class=\"sc-ex\">She is always complaining.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dấu hiệu\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">now\u003c/span>\u003cspan class=\"sc-chip\">right now\u003c/span>\u003cspan class=\"sc-chip\">at the moment\u003c/span>\u003cspan class=\"sc-chip\">at present\u003c/span>\u003cspan class=\"sc-chip\">Look!\u003c/span>\u003cspan class=\"sc-chip\">Listen!\u003c/span>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-24"},{"id":"bai-qua-khu-don","menu":"qua-khu-don","title":"Thì quá khứ đơn (Past Simple)","html":"\u003cp>\u003cstrong>Thì quá khứ đơn\u003c/strong> diễn tả hành động đã xảy ra và chấm dứt trong quá khứ.\u003c/p> \u003ch3>Cấu trúc với Động từ thường:\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc với Động từ thường\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>(+)\u003c/td> \u003ctd>S + V2/ed\u003c/td> \u003ctd>I watched a movie yesterday.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(-)\u003c/td> \u003ctd>S + did + not + V\u003c/td> \u003ctd>I didn't watch a movie yesterday.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(?)\u003c/td> \u003ctd>Did + S + V?\u003c/td> \u003ctd>Did you watch a movie yesterday?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Cấu trúc với Động từ to be:\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>(+) Khẳng định\u003c/td> \u003ctd>S + was/were + (Adj/Noun)\u003c/td> \u003ctd>\u003cul> \u003cli>I \u003cstrong>was\u003c/strong> a student 5 years ago.\u003c/li> \u003cli>They \u003cstrong>were\u003c/strong> happy yesterday.\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(-) Phủ định\u003c/td> \u003ctd>S + was/were + not + (Adj/Noun)\u003c/td> \u003ctd>\u003cul> \u003cli>He \u003cstrong>wasn't\u003c/strong> (was not) at home last night.\u003c/li> \u003cli>We \u003cstrong>weren't\u003c/strong> (were not) at the party.\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(?) Nghi vấn\u003c/td> \u003ctd>Was/Were + S + (Adj/Noun)?\u003c/td> \u003ctd>\u003cul> \u003cli>\u003cstrong>Was\u003c/strong> she tired this morning?\u003c/li> \u003cli>\u003cstrong>Were\u003c/strong> you in London last summer?\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Quá khứ đơn\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-forms\">\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign pos\">(+)\u003c/span>\u003ccode class=\"sc-code\">S + V2/ed · S + was/were\u003c/code>\u003cspan class=\"sc-ex\">They \u003cb>went\u003c/b> shopping yesterday.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign neg\">(−)\u003c/span>\u003ccode class=\"sc-code\">S + didn't + V nguyên thể · S + wasn't/weren't\u003c/code>\u003cspan class=\"sc-ex\">We \u003cb>didn't come\u003c/b> last week.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Did + S + V nguyên thể? · Was/Were + S…?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>Did\u003c/b> you \u003cb>watch\u003c/b> TV? Yes, I did.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"sc-tlw\">\u003cdiv class=\"sc-tl\">\u003cspan class=\"tl-axis\">\u003c/span>\u003cspan class=\"tl-mark at-30 k-x\">\u003ci>\u003c/i>\u003cspan>Hôm qua\u003csmall>xong rồi\u003c/small>\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-85 k-now\">\u003ci>\u003c/i>\u003cspan>BÂY GIỜ\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dùng khi\u003c/p>\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Đã xong trong quá khứ\u003c/b>\u003cspan class=\"sc-ex\">I visited Paris last summer.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Thói quen ngày xưa\u003c/b>\u003cspan class=\"sc-ex\">I played football every weekend.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Chuỗi hành động\u003c/b>\u003cspan class=\"sc-ex\">She got up, had breakfast and went to work.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dấu hiệu\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">yesterday\u003c/span>\u003cspan class=\"sc-chip\">2 days ago\u003c/span>\u003cspan class=\"sc-chip\">last week\u003c/span>\u003cspan class=\"sc-chip\">last year\u003c/span>\u003cspan class=\"sc-chip\">in 2010\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Sau \u003cb>didn't\u003c/b> động từ trở về nguyên thể: didn't \u003cb>go\u003c/b> (không viết didn't went).\u003c/p>\u003c/div> \u003ch4>Cách dùng:\u003c/h4> \u003cul> \u003cli>Diễn tả hành động đã xảy ra và chấm dứt hoàn toàn trong quá khứ \u003cul> \u003cli>I \u003cstrong>visited\u003c/strong> Paris last summer.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả hành động lặp đi lặp lại trong quá khứ \u003cul> \u003cli>When I was a child, I \u003cstrong>played\u003c/strong> football every weekend.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả một chuỗi hành động xảy ra liên tiếp trong quá khứ \u003cul> \u003cli>She \u003cstrong>got up\u003c/strong>, \u003cstrong>had\u003c/strong> breakfast, and \u003cstrong>went\u003c/strong> to work.\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Dấu hiệu nhận biết:\u003c/strong> yesterday, ago, last (week/month)...\u003c/p>","order":0,"updated":"2026-10-24"},{"id":"bai-tuong-lai-don","menu":"tuong-lai-don","title":"Thì tương lai đơn (Future Simple)","html":"\u003cp>\u003cstrong>Thì tương lai\u003c/strong> đơn diễn tả hành động sẽ xảy ra trong tương lai, thường là quyết định tức thời, dự đoán, lời hứa.\u003c/p> \u003ch4>Cấu trúc:\u003c/h4> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>(+)\u003c/td> \u003ctd>S + will + V\u003c/td> \u003ctd>I \u003cstrong>will help\u003c/strong> you with this bag.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(-)\u003c/td> \u003ctd>S + will not (won't) + V\u003c/td> \u003ctd>I \u003cstrong>won't tell\u003c/strong> anyone your secret.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(?)\u003c/td> \u003ctd>Will + S + V?\u003c/td> \u003ctd>\u003cstrong>Will\u003c/strong> you \u003cstrong>marry\u003c/strong> me?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch4>Cách dùng:\u003c/h4> \u003cul> \u003cli>Diễn tả quyết định tức thời (vừa được đưa ra tại thời điểm nói) \u003cul> \u003cli>It's raining. I \u003cstrong>will take\u003c/strong> an umbrella.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả dự đoán không có căn cứ \u003cul> \u003cli>I think it \u003cstrong>will rain\u003c/strong> tomorrow.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả lời hứa, cam kết \u003cul> \u003cli>I \u003cstrong>will help\u003c/strong> you with your homework.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả lời đề nghị, tình nguyện \u003cul> \u003cli>The phone is ringing. I \u003cstrong>will answer\u003c/strong> it.\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Dấu hiệu:\u003c/strong> tomorrow, next year, I think, maybe...\u003c/p> \u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Tương lai đơn\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-forms\">\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign pos\">(+)\u003c/span>\u003ccode class=\"sc-code\">S + will + V\u003c/code>\u003cspan class=\"sc-ex\">I \u003cb>will help\u003c/b> you.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign neg\">(−)\u003c/span>\u003ccode class=\"sc-code\">S + won't + V\u003c/code>\u003cspan class=\"sc-ex\">I \u003cb>won't tell\u003c/b> anyone.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Will + S + V?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>Will\u003c/b> you \u003cb>come\u003c/b>?\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dùng khi\u003c/p>\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Quyết định ngay lúc nói\u003c/b>\u003cspan class=\"sc-ex\">It's raining. I will take an umbrella.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Dự đoán\u003c/b>\u003cspan class=\"sc-ex\">I think it will rain tomorrow.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Lời hứa\u003c/b>\u003cspan class=\"sc-ex\">I will help you with your homework.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Đề nghị giúp\u003c/b>\u003cspan class=\"sc-ex\">The phone is ringing. I will answer it.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dấu hiệu\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">tomorrow\u003c/span>\u003cspan class=\"sc-chip\">next year\u003c/span>\u003cspan class=\"sc-chip\">I think\u003c/span>\u003cspan class=\"sc-chip\">maybe\u003c/span>\u003cspan class=\"sc-chip\">probably\u003c/span>\u003cspan class=\"sc-chip\">in the future\u003c/span>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-24"},{"id":"bai-tuong-lai-gan","menu":"tuong-lai-gan","title":"Thì tương lai gần (Be going to)","html":"\u003cp>\u003cstrong>Thì tương lai gần\u003c/strong> diễn tả kế hoạch hoặc ý định đã được chuẩn bị từ trước, hoặc dự đoán dựa trên dấu hiệu hiện tại.\u003c/p> \u003ch4>Cấu trúc:\u003c/h4> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>(+)\u003c/td> \u003ctd>S + am/is/are + going to + V\u003c/td> \u003ctd>We \u003cstrong>are going to visit\u003c/strong> Hue next June.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(-)\u003c/td> \u003ctd>S + am/is/are + not + going to + V\u003c/td> \u003ctd>We \u003cstrong>aren't going to visit\u003c/strong> Hue.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(?)\u003c/td> \u003ctd>Am/Is/Are + S + going to + V?\u003c/td> \u003ctd>\u003cstrong>Are\u003c/strong> you \u003cstrong>going to buy\u003c/strong> that car?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch4>Cách dùng:\u003c/h4> \u003cul> \u003cli>Diễn tả kế hoạch, ý định đã được quyết định từ trước \u003cul> \u003cli>I \u003cstrong>am going to buy\u003c/strong> a new car next month.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả dự đoán dựa trên dấu hiệu hiện tại \u003cul> \u003cli>Look at those dark clouds. It \u003cstrong>is going to rain\u003c/strong>.\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Dấu hiệu:\u003c/strong> Look at those clouds!, next week (có kế hoạch)... \u003c/p>","order":0,"updated":"2026-10-24"},{"id":"bai-hien-tai-hoan-thanh","menu":"hien-tai-hoan-thanh","title":"Thì hiện tại hoàn thành (Present Perfect)","html":"\u003cp>\u003cstrong>Thì hiện tại hoàn thành\u003c/strong> diễn tả hành động đã xảy ra trong quá khứ nhưng có liên quan đến hiện tại, hoặc hành động bắt đầu từ quá khứ và vẫn tiếp tục đến hiện tại.\u003c/p> \u003ch4>Cấu trúc:\u003c/h4> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>(+)\u003c/td> \u003ctd>S + have/has + V3/ed\u003c/td> \u003ctd>She \u003cstrong>has lived\u003c/strong> here for 10 years.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(-)\u003c/td> \u003ctd>S + have/has + not + V3/ed\u003c/td> \u003ctd>She \u003cstrong>hasn't lived\u003c/strong> here before.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(?)\u003c/td> \u003ctd>Have/Has + S + V3/ed?\u003c/td> \u003ctd>\u003cstrong>Has\u003c/strong> she \u003cstrong>ever lived\u003c/strong> here?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t5\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Hiện tại hoàn thành\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-forms\">\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign pos\">(+)\u003c/span>\u003ccode class=\"sc-code\">S + have/has + V3/ed\u003c/code>\u003cspan class=\"sc-ex\">I \u003cb>have been\u003c/b> to London three times.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign neg\">(−)\u003c/span>\u003ccode class=\"sc-code\">S + haven't/hasn't + V3/ed\u003c/code>\u003cspan class=\"sc-ex\">Anna \u003cb>hasn't finished\u003c/b> her homework yet.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Have/Has + S + V3/ed?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>Have\u003c/b> you \u003cb>read\u003c/b> the message? Yes, I have.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign wh\">Wh-\u003c/span>\u003ccode class=\"sc-code\">Wh- + have/has + S + V3?\u003c/code>\u003cspan class=\"sc-ex\">Who \u003cb>has visited\u003c/b> you this week?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"sc-tlw\">\u003cdiv class=\"sc-tl\">\u003cspan class=\"tl-axis\">\u003c/span>\u003cspan class=\"tl-span from-15 to-85 k-a\">\u003cspan>have lived\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-15 k-a\">\u003ci>\u003c/i>\u003cspan>5 năm trước\u003csmall>bắt đầu\u003c/small>\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-85 k-now\">\u003ci>\u003c/i>\u003cspan>BÂY GIỜ\u003csmall>vẫn còn\u003c/small>\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dùng khi\u003c/p>\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Kinh nghiệm\u003c/b>\u003cspan class=\"sc-ex\">I have visited Paris.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Vừa xong, còn kết quả\u003c/b>\u003cspan class=\"sc-ex\">She has broken her leg.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Kéo dài đến nay\u003c/b>\u003cspan class=\"sc-ex\">I have lived in Hanoi for 5 years.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Khoảng thời gian chưa hết\u003c/b>\u003cspan class=\"sc-ex\">I have seen three movies this week.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dấu hiệu\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">since\u003c/span>\u003cspan class=\"sc-chip\">for\u003c/span>\u003cspan class=\"sc-chip\">just\u003c/span>\u003cspan class=\"sc-chip\">already\u003c/span>\u003cspan class=\"sc-chip\">yet\u003c/span>\u003cspan class=\"sc-chip\">ever\u003c/span>\u003cspan class=\"sc-chip\">never\u003c/span>\u003c/div>\u003c/div>\u003c/div> \u003ch4>Cách dùng:\u003c/h4> \u003cul> \u003cli>Diễn tả kinh nghiệm (hành động đã từng làm trong đời, không quan tâm thời gian cụ thể) \u003cul> \u003cli>I \u003cstrong>have visited\u003c/strong> Paris. (đã từng đến Paris, không biết cụ thể là khi nào)\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả hành động vừa mới xảy ra, có kết quả nhìn thấy được ở hiện tại \u003cul> \u003cli>She \u003cstrong>has broken\u003c/strong> her leg. (và hiện giờ chân cô ấy vẫn đang bị gãy)\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả hành động bắt đầu từ quá khứ và vẫn tiếp tục đến hiện tại \u003cul> \u003cli>I \u003cstrong>have lived\u003c/strong> in Hanoi for 5 years. (bắt đầu sống ở Hà Nội 5 năm trước và hiện vẫn đang sống ở đó)\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả hành động xảy ra trong khoảng thời gian chưa kết thúc \u003cul> \u003cli>I \u003cstrong>have seen\u003c/strong> three movies this week. (tuần này chưa kết thúc, có thể sẽ xem thêm)\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Dấu hiệu:\u003c/strong> since, for, just, already, yet, ever, never...\u003c/p>","order":0,"updated":"2026-10-24"},{"id":"bai-qua-khu-tiep-dien","menu":"qua-khu-tiep-dien","title":"Thì quá khứ tiếp diễn (Past Continuous)","html":"\u003cp>\u003cstrong>Thì quá khứ tiếp diễn\u003c/strong> diễn tả hành động đang xảy ra tại một thời điểm cụ thể trong quá khứ, hoặc hành động đang xảy ra thì có hành động khác xen vào.\u003c/p> \u003cp>Cấu trúc:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>(+)\u003c/td> \u003ctd>S + was/were + V-ing\u003c/td> \u003ctd>I \u003cstrong>was sleeping\u003c/strong> at 10 PM last night.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(-)\u003c/td> \u003ctd>S + was/were + not + V-ing\u003c/td> \u003ctd>I \u003cstrong>wasn't sleeping\u003c/strong> at 10 PM last night.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>(?)\u003c/td> \u003ctd>Was/Were + S + V-ing?\u003c/td> \u003ctd>\u003cstrong>Were\u003c/strong> you \u003cstrong>sleeping\u003c/strong> at 10 PM last night?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch4>Cách dùng:\u003c/h4> \u003cul> \u003cli>Diễn tả hành động đang xảy ra tại một thời điểm cụ thể trong quá khứ \u003cul> \u003cli>At 8 PM last night, I \u003cstrong>was watching\u003c/strong> TV.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả hành động đang xảy ra trong quá khứ thì có hành động khác xen vào \u003cul> \u003cli>I \u003cstrong>was taking\u003c/strong> a shower when the phone rang.\u003c/li> \u003c/ul>\u003c/li> \u003cli>Diễn tả hai hành động xảy ra song song trong quá khứ \u003cul> \u003cli>While I \u003cstrong>was cooking\u003c/strong>, she \u003cstrong>was setting\u003c/strong> the table.\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Dấu hiệu:\u003c/strong> at + giờ + thời gian trong quá khứ (at 8 p.m. yesterday), at this time last week, when, while…\u003c/p>","order":0,"updated":"2026-10-26"},{"id":"bai-qua-khu-hoan-thanh","menu":"qua-khu-hoan-thanh","title":"Thì quá khứ hoàn thành (Past Perfect)","html":"\u003cp class=\"lead\">Thì quá khứ hoàn thành (Past Perfect) dùng để nói về một việc đã xảy ra và xong \u003cb>trước\u003c/b> một thời điểm hoặc trước một việc khác trong quá khứ. Bài này gồm công thức, cách dùng, dấu hiệu nhận biết và cách phân biệt với quá khứ đơn.\u003c/p> \u003ch3>Quá khứ hoàn thành là gì?\u003c/h3> \u003cp>Thì quá khứ hoàn thành (Past Perfect) dùng để diễn tả một hành động xảy ra trước một hành động khác trong quá khứ. Để dễ hiểu, bạn hãy nhớ cụm từ: \"Quá khứ của Quá khứ\":\u003c/p> \u003cul> \u003cli>Hành động nào xảy ra trước ⇒ quá khứ hoàn thành\u003c/li> \u003cli>Hành động xảy ra sau ⇒ \u003cstrong>quá khứ đơn\u003c/strong>\u003c/li> \u003c/ul> \u003ch4>Ví dụ:\u003c/h4> \u003cul> \u003cli>I had finished my homework before my mom came home. (Tôi đã làm xong bài tập trước khi mẹ tôi về nhà.)\u003c/li> \u003cli>She had left the office when I arrived. (Cô ấy đã rời văn phòng khi tôi đến.)\u003c/li> \u003c/ul> \u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Quá khứ hoàn thành: \"quá khứ của quá khứ\"\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-tlw\">\u003cdiv class=\"sc-tl\">\u003cspan class=\"tl-axis\">\u003c/span>\u003cspan class=\"tl-mark at-22 k-a\">\u003ci>\u003c/i>\u003cspan>① had + V3\u003csmall>xảy ra TRƯỚC\u003c/small>\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-58 k-b\">\u003ci>\u003c/i>\u003cspan>② V2/ed\u003csmall>xảy ra SAU\u003c/small>\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-90 k-now\">\u003ci>\u003c/i>\u003cspan>BÂY GIỜ\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Ví dụ 1\u003c/b>\u003cspan class=\"sc-txt\">I \u003cb>had finished\u003c/b> my homework before my mom \u003cb>came\u003c/b> home.\u003c/span>\u003cspan class=\"sc-ex\">Làm bài xong trước, mẹ về sau.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Ví dụ 2\u003c/b>\u003cspan class=\"sc-txt\">She \u003cb>had left\u003c/b> the office when I \u003cb>arrived\u003c/b>.\u003c/span>\u003cspan class=\"sc-ex\">Cô ấy đi trước, tôi đến sau.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Mẹo: việc ① trước dùng \u003cb>had + V3\u003c/b>, việc ② sau dùng \u003cb>quá khứ đơn\u003c/b>.\u003c/p>\u003c/div> \u003ch3>Công thức quá khứ hoàn thành\u003c/h3> \u003cp>Công thức thì quá khứ hoàn thành có 3 dạng: khẳng định, phủ định và nghi vấn.\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth> \u003c/th> \u003cth>\u003cstrong>Khẳng định\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Phủ định\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Nghi vấn\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>Công thức\u003c/strong>\u003c/td> \u003ctd>S + had + V3/ed\u003c/td> \u003ctd>S + had not (hadn't) + V3/ed\u003c/td> \u003ctd>Had + S + V3/ed?\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Ví dụ\u003c/strong>\u003c/td> \u003ctd>He \u003cstrong>had submitted\u003c/strong> his paper before the deadline yesterday.\u003c/td> \u003ctd>They \u003cstrong>hadn't\u003c/strong> left when I arrived\u003c/td> \u003ctd>\u003cstrong>Had the match started\u003c/strong> when you arrived at the stadium?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cp>\u003cem>\u003cstrong>Mẹo\u003c/strong>: chỉ cần nhớ \u003cstrong>chia từ have/has\u003c/strong> trong \u003cstrong>Hiện tại hoàn thành\u003c/strong> về quá khứ “\u003cstrong>had\u003c/strong>”.\u003c/em>\u003c/p> \u003cul> \u003cli>\u003cem>\u003cstrong>Hiện tại hoàn thành:\u003c/strong> S + have/has + PII\u003c/em>\u003c/li> \u003cli>\u003cem>\u003cstrong>Quá khứ hoàn thành:\u003c/strong> S + had + PII\u003c/em>\u003c/li> \u003c/ul> \u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Công thức quá khứ hoàn thành\u003c/p>\u003cp class=\"sc-sub\">Cách nhớ nhanh: lấy hiện tại hoàn thành, đổi have/has thành had.\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-forms\">\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign pos\">(+)\u003c/span>\u003ccode class=\"sc-code\">S + had + V3/ed\u003c/code>\u003cspan class=\"sc-ex\">He \u003cb>had submitted\u003c/b> his paper before the deadline.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign neg\">(−)\u003c/span>\u003ccode class=\"sc-code\">S + hadn't + V3/ed\u003c/code>\u003cspan class=\"sc-ex\">They \u003cb>hadn't left\u003c/b> when I arrived.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Had + S + V3/ed?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>Had\u003c/b> the match \u003cb>started\u003c/b> when you arrived?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"sc-swap\">\u003ccode class=\"sc-code\">S + \u003cb>have/has\u003c/b> + V3\u003c/code>\u003cspan class=\"sc-arrow\">đổi thành\u003c/span>\u003ccode class=\"sc-code\">S + \u003cb>had\u003c/b> + V3\u003c/code>\u003c/div>\u003c/div>\u003c/div> \u003cp>\u003cem>Động từ trong quá khứ hoàn thành thường có dạng had + V3. Vì nhiều động từ là bất quy tắc, bạn cần nhớ đúng dạng V3 để chia chính xác. Nếu chưa chắc, hãy tra \u003cstrong>bảng động từ bất quy tắc\u003c/strong> nhé.\u003c/em>\u003c/p> \u003ch3>Cách dùng thì quá khứ hoàn thành\u003c/h3> \u003cp>Quá khứ hoàn thành có 4 cách dùng chính:\u003c/p> \u003ch3>a. Diễn tả hành động xảy ra trước một hành động khác trong quá khứ\u003c/h3> \u003cp>Trong một câu có hai hành động quá khứ:\u003c/p> \u003cul> \u003cli>Hành động nào xảy ra trước → Dùng \u003cstrong>Quá khứ hoàn thành\u003c/strong>.\u003c/li> \u003cli>Hành động nào xảy ra sau → Dùng \u003cstrong>Quá khứ đơn\u003c/strong>.\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> When we arrived at the cinema, the film \u003cstrong>had started\u003c/strong>. \u003cem>(Khi chúng tôi đến rạp, bộ phim đã bắt đầu rồi - Phim bắt đầu trước, chúng tôi đến sau).\u003c/em>\u003c/p> \u003ch3>b. Diễn tả hành động xảy ra trước một thời điểm xác định trong quá khứ\u003c/h3> \u003cp>Thì quá khứ hoàn thành diễn tả hành động xảy ra trước một thời điểm xác định trong quá khứ. Cách dùng này thường có các dấu hiệu: by the time/before + mốc thời gian\u003c/p> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> She \u003cstrong>had traveled\u003c/strong> to 10 countries by the time she was 20. \u003cem>(Cô ấy đã đi du lịch 10 nước trước lúc cô ấy 20 tuổi).\u003c/em>\u003c/p> \u003ch3>c. Dùng trong câu điều kiện loại 3\u003c/h3> \u003cp>Thì quá khứ hoàn thành dùng để diễn tả một điều kiện không có thật trong quá khứ (câu điều kiện loại 3).\u003c/p> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> If I \u003cstrong>had studied\u003c/strong> harder, I would have passed the exam. \u003cem>(Nếu tôi học chăm hơn, tôi đã đậu kỳ thi rồi - Thực tế là tôi không học chăm và đã trượt).\u003c/em>\u003c/p> \u003ch3>d. Dùng trong câu tường thuật\u003c/h3> \u003cp>Chúng ta dùng quá khứ hoàn thành trong câu tường thuật khi lùi thì từ Quá khứ đơn hoặc Hiện tại hoàn thành.\u003c/p> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> He said that he had lost his keys. (Anh ấy nói rằng anh ấy đã làm mất chìa khóa).\u003c/p> \u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">4 cách dùng quá khứ hoàn thành\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">1. Trước một việc khác\u003c/b>\u003cspan class=\"sc-txt\">When we arrived, the film \u003cb>had started\u003c/b>.\u003c/span>\u003cspan class=\"sc-ex\">Phim chiếu trước, chúng tôi đến sau.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">2. Trước một mốc thời gian\u003c/b>\u003cspan class=\"sc-txt\">She \u003cb>had traveled\u003c/b> to 10 countries \u003cb>by the time\u003c/b> she was 20.\u003c/span>\u003cspan class=\"sc-ex\">Dấu hiệu: by the time, before\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">3. Câu điều kiện loại 3\u003c/b>\u003cspan class=\"sc-txt\">If I \u003cb>had studied\u003c/b> harder, I would have passed.\u003c/span>\u003cspan class=\"sc-ex\">Điều không có thật trong quá khứ.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">4. Câu tường thuật\u003c/b>\u003cspan class=\"sc-txt\">He said that he \u003cb>had lost\u003c/b> his keys.\u003c/span>\u003cspan class=\"sc-ex\">Lùi thì từ \"I lost my keys\".\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div> \u003ch3>Dấu hiệu nhận biết thì quá khứ hoàn thành\u003c/h3> \u003cp>Dấu hiệu nhận biết thì quá khứ hoàn thành bao gồm:\u003c/p> \u003cul> \u003cli>\u003cstrong>Before/ By the time (+quá khứ đơn):\u003c/strong> Trước khi...\u003c/li> \u003cli>\u003cstrong>After (+quá khứ hoàn thành):\u003c/strong> Sau khi...\u003c/li> \u003cli>\u003cstrong>As soon as:\u003c/strong> Ngay sau khi...\u003c/li> \u003cli>\u003cstrong>Until then:\u003c/strong> Cho đến lúc đó...\u003c/li> \u003cli>\u003cstrong>By then:\u003c/strong> Tính đến lúc đó...\u003c/li> \u003cli>\u003cstrong>Just/ Already/ Never:\u003c/strong> Vừa mới/ Đã rồi/ Chưa từng (dùng để nhấn mạnh).\u003c/li> \u003cli>\u003cstrong>Prior to that time:\u003c/strong> Trước thời điểm đó / Trước lúc đó\u003c/li> \u003cli>\u003cstrong>By the end of + thời gian trong quá khứ:\u003c/strong> Tính đến cuối … / Trước khi kết thúc … (trong quá khứ)\u003c/li> \u003c/ul> \u003ch4>Ví dụ:\u003c/h4> \u003cul> \u003cli>\u003cstrong>When I got up this morning\u003c/strong>, my father \u003cstrong>had already\u003c/strong> \u003cstrong>left\u003c/strong>. (Khi tôi thức dậy sáng nay, cha tôi đã rời đi.)\u003c/li> \u003cli>\u003cstrong>By the time I met you\u003c/strong>, I \u003cstrong>had worked\u003c/strong> in that company for five years. (Vào thời điểm tôi gặp bạn, tôi đã làm việc trong công ty đó được năm năm.)\u003c/li> \u003c/ul> \u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Dấu hiệu quá khứ hoàn thành\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">before / by the time\u003c/b>\u003cspan class=\"sc-txt\">trước khi…\u003c/span>\u003cspan class=\"sc-ex\">vế còn lại dùng quá khứ đơn\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">after / as soon as\u003c/b>\u003cspan class=\"sc-txt\">sau khi / ngay khi…\u003c/span>\u003cspan class=\"sc-ex\">đi với vế quá khứ hoàn thành\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">until then / by then\u003c/b>\u003cspan class=\"sc-txt\">cho đến lúc đó\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">prior to that time\u003c/b>\u003cspan class=\"sc-txt\">trước thời điểm đó\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">by the end of + mốc QK\u003c/b>\u003cspan class=\"sc-txt\">tính đến cuối…\u003c/span>\u003cspan class=\"sc-ex\">by the end of 2020\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k6\">\u003cb class=\"sc-term\">just / already / never\u003c/b>\u003cspan class=\"sc-txt\">vừa / đã / chưa từng\u003c/span>\u003cspan class=\"sc-ex\">đứng sau had\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">By the time I met you, I \u003cb>had worked\u003c/b> there for five years.\u003c/p>\u003c/div> \u003ch3>Bị động quá khứ hoàn thành\u003c/h3> \u003cp>Cấu trúc câu bị động Quá khứ hoàn thành dùng để nhấn mạnh vào đối tượng chịu tác động của hành động, xảy ra trước một thời điểm hoặc một hành động khác trong quá khứ.\u003c/p> \u003cp>Công thức bị động quá khứ hoàn thành:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Khẳng định\u003c/td> \u003ctd>S + had + been + V3/ed (+ by O)\u003c/td> \u003ctd>The cake \u003cstrong>had been eaten\u003c/strong> before I arrived.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Phủ định\u003c/td> \u003ctd>S + had not (hadn't) + been + V3/ed\u003c/td> \u003ctd>The report \u003cstrong>hadn't been finished\u003c/strong> by 5 PM.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Nghi vấn\u003c/td> \u003ctd>Had + S + been + V3/ed?\u003c/td> \u003ctd>\u003cstrong>Had\u003c/strong> the house \u003cstrong>been painted\u003c/strong> before they moved in?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>Phân biệt quá khứ đơn và quá khứ hoàn thành\u003c/h3> \u003cp>Hai thì này rất dễ nhầm. Bảng dưới đây so sánh từng điểm:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Tiêu chí\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Quá khứ đơn (Past Simple)\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Quá khứ hoàn thành (Past Perfect)\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Công thức\u003c/td> \u003ctd>S + V2/ed\u003c/td> \u003ctd>S + had + V3/ed\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Cách dùng chính\u003c/td> \u003ctd>Diễn tả hành động đã xảy ra và kết thúc trong quá khứ.\u003c/td> \u003ctd>Diễn tả hành động xảy ra trước một hành động khác trong quá khứ.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Mốc thời gian\u003c/td> \u003ctd>Thường có mốc thời gian xác định (yesterday, last year...).\u003c/td> \u003ctd>Phải có một hành động/thời điểm quá khứ khác để làm mốc so sánh.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Liên từ đi kèm\u003c/td> \u003ctd>when, as soon as, then...\u003c/td> \u003ctd>before, after, by the time, until then...\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t5\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Quá khứ đơn hay quá khứ hoàn thành?\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-tlw\">\u003cdiv class=\"sc-tl\">\u003cspan class=\"tl-axis\">\u003c/span>\u003cspan class=\"tl-mark at-25 k-a\">\u003ci>\u003c/i>\u003cspan>Quá khứ hoàn thành\u003csmall>xảy ra trước\u003c/small>\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-60 k-b\">\u003ci>\u003c/i>\u003cspan>Quá khứ đơn\u003csmall>xảy ra sau\u003c/small>\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-90 k-now\">\u003ci>\u003c/i>\u003cspan>BÂY GIỜ\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"sc-vs\">\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">Quá khứ đơn\u003c/b>\u003ccode class=\"sc-code\">S + V2/ed\u003c/code>\u003cspan class=\"sc-txt\">Việc đã xong trong quá khứ, có mốc thời gian rõ.\u003c/span>\u003cspan class=\"sc-ex\">yesterday, last year · when, then\u003c/span>\u003c/div>\u003cspan class=\"sc-vsb\">VS\u003c/span>\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">Quá khứ hoàn thành\u003c/b>\u003ccode class=\"sc-code\">S + had + V3/ed\u003c/code>\u003cspan class=\"sc-txt\">Việc xảy ra trước một việc hoặc mốc khác trong quá khứ.\u003c/span>\u003cspan class=\"sc-ex\">before, after, by the time, until\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-htht-tiep-dien","menu":"htht-tiep-dien","title":"Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous)","html":"\u003cp class=\"lead\">Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous) dùng cho việc bắt đầu trong quá khứ, kéo dài đến bây giờ và có thể còn tiếp tục. Thì này nhấn mạnh \u003cb>quá trình\u003c/b>: việc đó đã diễn ra bao lâu.\u003c/p> \u003ch3>Hiện tại hoàn thành tiếp diễn là gì?\u003c/h3> \u003cp>Thì hiện tại hoàn thành tiếp diễn (Present Perfect Continuous) là thì dùng để diễn tả một hành động bắt đầu trong quá khứ, kéo dài đến hiện tại và có thể tiếp tục trong tương lai. Điểm khác biệt lớn nhất của thì này với \u003cstrong>thì hiện tại hoàn thành\u003c/strong> là nó nhấn mạnh vào \u003cstrong>tính liên tục\u003c/strong> hoặc \u003cstrong>thời gian (quá trình)\u003c/strong> của hành động, thay vì chỉ kết quả của hành động đó.\u003c/p> \u003cp>Ví dụ về thì hiện tại hoàn thành tiếp diễn:\u003c/p> \u003cul> \u003cli>It has been raining for 2 hours. (Trời đã mưa 2 tiếng đồng hồ rồi.)\u003c/li> \u003cli>We have been doing this work since 2018. (Chúng tôi đã làm công việc này từ năm 2018.)\u003c/li> \u003c/ul> \u003cp>\u003cem>\u003cstrong>Lưu ý:\u003c/strong> Cũng giống như các thì tiếp diễn khác, \u003cstrong>KHÔNG DÙNG\u003c/strong> Hiện tại hoàn thành tiếp diễn với các \u003cstrong>động từ chỉ trạng thái (Stative Verbs)\u003c/strong> như: know, believe, understand, love, hate, like, want, seem, appear...\u003c/em>\u003c/p> \u003cul> \u003cli>\u003cem>\u003cstrong>Sai:\u003c/strong> I have been knowing him for years.\u003c/em>\u003c/li> \u003cli>\u003cem>\u003cstrong>Đúng:\u003c/strong> I \u003cstrong>have known\u003c/strong> him for years. (Dùng thì Hiện tại hoàn thành).\u003c/em>\u003c/li> \u003c/ul> \u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Hiện tại hoàn thành tiếp diễn\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-tlw\">\u003cdiv class=\"sc-tl\">\u003cspan class=\"tl-axis\">\u003c/span>\u003cspan class=\"tl-span from-15 to-95 k-b\">\u003cspan>đã và đang diễn ra\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-15 k-a\">\u003ci>\u003c/i>\u003cspan>Bắt đầu\u003csmall>trong quá khứ\u003c/small>\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-78 k-now\">\u003ci>\u003c/i>\u003cspan>BÂY GIỜ\u003csmall>vẫn đang làm\u003c/small>\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-big\">\u003ccode class=\"sc-code\">S + have/has + been + V-ing\u003c/code>\u003c/p>\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Ví dụ\u003c/b>\u003cspan class=\"sc-txt\">It \u003cb>has been raining\u003c/b> for 2 hours.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Ví dụ\u003c/b>\u003cspan class=\"sc-txt\">We \u003cb>have been doing\u003c/b> this work since 2018.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Không dùng với động từ chỉ trạng thái như know, love, want: nói \u003cb>I have known him\u003c/b>, không nói I have been knowing him.\u003c/p>\u003c/div> \u003ch3>Công thức hiện tại hoàn thành tiếp diễn\u003c/h3> \u003cp>Công thức thì hiện tại hoàn thành tiếp diễn được chia thành 3 dạng như sau:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth colspan=\"2\"> \u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd colspan=\"2\">\u003cstrong>Thể khẳng định\u003c/strong>\u003c/td> \u003ctd>S + have/ has + been + V-ing\u003c/td> \u003ctd>They have been working all day. (Họ đã làm việc cả ngày.)\u003c/td> \u003c/tr> \u003ctr> \u003ctd colspan=\"2\">\u003cstrong>Thể phủ định\u003c/strong>\u003c/td> \u003ctd>S + haven’t/ hasn’t + been + V-ing\u003c/td> \u003ctd>She hasn’t been sleeping well for two weeks. (Hai tuần nay cô ấy ngủ không ngon.)\u003c/td> \u003c/tr> \u003ctr> \u003ctd rowspan=\"2\">\u003cstrong>Thể nghi vấn\u003c/strong>\u003c/td> \u003ctd>Yes/No questions\u003c/td> \u003ctd>\u003ctable>\u003cthead> \u003ctr> \u003cth>Have/ Has + S + been + V-ing?\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003c/tbody> \u003c/table> \u003cp>\u003cstrong>→ Trả lời:\u003c/strong>\u003c/p> \u003cul> \u003cli>Yes, S + have/has.\u003c/li> \u003cli>No, S + haven’t (have not)/hasn’t (has not).\u003c/li> \u003c/ul>\u003c/td> \u003ctd>\u003cp>Have you been learning French for 2 month
