ctd>Lên đến\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>90\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Towards\u003c/strong>\u003c/td>\u003ctd>Hướng tới\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Nhóm giới từ hay dùng nhất\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Nơi chốn\u003c/b>\u003cspan class=\"sc-txt\">in, on, at, under, above, between, among, next to, behind, in front of\u003c/span>\u003cspan class=\"sc-ex\">The cat is \u003cb>under\u003c/b> the table.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Thời gian\u003c/b>\u003cspan class=\"sc-txt\">in, on, at, before, after, during, since, until, within\u003c/span>\u003cspan class=\"sc-ex\">I study \u003cb>after\u003c/b> dinner.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Hướng đi\u003c/b>\u003cspan class=\"sc-txt\">to, into, out of, through, across, along, towards, up, down\u003c/span>\u003cspan class=\"sc-ex\">She ran \u003cb>across\u003c/b> the road.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Lý do, nhượng bộ\u003c/b>\u003cspan class=\"sc-txt\">because of, due to, despite, in spite of, instead of\u003c/span>\u003cspan class=\"sc-ex\">We stayed home \u003cb>because of\u003c/b> the rain.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Đừng học 90 từ một lúc: mỗi ngày học 10 từ, đặt mỗi từ trong một câu ngắn.\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-60-cau","menu":"60-cau-me-noi","title":"60 câu tiếng Anh chủ đề dọn dẹp nhà cửa","html":"\u003cp class=\"lead\">60 câu tiếng Anh ngắn bố mẹ dùng khi cùng con dọn dẹp nhà cửa, đi từ lúc bắt đầu đến lúc khen ngợi. Vừa làm việc nhà vừa nói tiếng Anh, con sẽ nhớ câu rất nhanh.\u003c/p>\u003ch3>Phần 1: Bắt đầu dọn dẹp (câu\n1–10)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>It&#x27;s time to clean up.\u003c/strong>\u003c/td>\u003ctd>Đến giờ dọn dẹp rồi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s clean the house together.\u003c/strong>\u003c/td>\u003ctd>Mình cùng dọn nhà nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Can you help me today?\u003c/strong>\u003c/td>\u003ctd>Hôm nay con có thể giúp mẹ không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s start with your room.\u003c/strong>\u003c/td>\u003ctd>Mình bắt đầu với phòng của con nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Don&#x27;t worry. It won&#x27;t take long.\u003c/strong>\u003c/td>\u003ctd>Đừng lo nhé. Sẽ không mất nhiều thời gian đâu.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We can do it together.\u003c/strong>\u003c/td>\u003ctd>Mình có thể cùng nhau làm.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s make the house nice and clean.\u003c/strong>\u003c/td>\u003ctd>Mình làm cho ngôi nhà sạch sẽ và đẹp đẽ nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Are you ready to help me?\u003c/strong>\u003c/td>\u003ctd>Con sẵn sàng giúp mẹ chưa?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s get started.\u003c/strong>\u003c/td>\u003ctd>Mình bắt đầu nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Thank you for helping me.\u003c/strong>\u003c/td>\u003ctd>Cảm ơn con đã giúp mẹ.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phần 2: Cất dọn đồ chơi (câu\n11–20)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>11\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s pick up your toys.\u003c/strong>\u003c/td>\u003ctd>Mình nhặt đồ chơi lên nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>12\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Please put your toys away.\u003c/strong>\u003c/td>\u003ctd>Con cất đồ chơi đi nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>13\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put the blocks in the box.\u003c/strong>\u003c/td>\u003ctd>Bỏ những khối đồ chơi vào hộp nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>14\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Where does this toy go?\u003c/strong>\u003c/td>\u003ctd>Món đồ chơi này để ở đâu nhỉ?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>15\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s put it back in its place.\u003c/strong>\u003c/td>\u003ctd>Mình đặt nó lại đúng chỗ nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>16\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Don&#x27;t leave your toys on the floor.\u003c/strong>\u003c/td>\u003ctd>Đừng để đồ chơi trên sàn nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>17\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Can you find the toy box?\u003c/strong>\u003c/td>\u003ctd>Con tìm hộp đồ chơi được không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>18\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put the cars in this basket.\u003c/strong>\u003c/td>\u003ctd>Bỏ những chiếc xe vào giỏ này nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>19\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s put the books on the shelf.\u003c/strong>\u003c/td>\u003ctd>Mình đặt sách lên kệ nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>20\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Your room looks better already.\u003c/strong>\u003c/td>\u003ctd>Phòng của con trông gọn gàng hơn rồi đấy.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phần 3: Dọn giường và\nquần áo (câu 21–30)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>21\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s make your bed.\u003c/strong>\u003c/td>\u003ctd>Mình dọn giường nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>22\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Pull up the blanket.\u003c/strong>\u003c/td>\u003ctd>Kéo chăn lên nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>23\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put your pillow in the right place.\u003c/strong>\u003c/td>\u003ctd>Đặt gối đúng chỗ nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>24\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s straighten the sheets.\u003c/strong>\u003c/td>\u003ctd>Mình vuốt ga giường cho phẳng nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>25\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Pick up your clothes.\u003c/strong>\u003c/td>\u003ctd>Nhặt quần áo lên nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>26\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put your dirty clothes in the laundry basket.\u003c/strong>\u003c/td>\u003ctd>Bỏ quần áo bẩn vào giỏ đồ giặt nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>27\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Fold your clean clothes.\u003c/strong>\u003c/td>\u003ctd>Gấp quần áo sạch của con nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>28\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put your clothes in the closet.\u003c/strong>\u003c/td>\u003ctd>Cất quần áo vào tủ nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>29\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s open the window.\u003c/strong>\u003c/td>\u003ctd>Mình mở cửa sổ nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>30\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Your room is looking nice and tidy.\u003c/strong>\u003c/td>\u003ctd>Phòng của con trông thật sạch sẽ và gọn gàng.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phần 4: Lau bàn, quét nhà\n(câu 31–40)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>31\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s clean the table.\u003c/strong>\u003c/td>\u003ctd>Mình lau bàn nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>32\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Can you wipe the table?\u003c/strong>\u003c/td>\u003ctd>Con có thể lau bàn không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>33\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Please use this cloth.\u003c/strong>\u003c/td>\u003ctd>Con dùng khăn này nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>34\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Be careful with the water.\u003c/strong>\u003c/td>\u003ctd>Cẩn thận với nước nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>35\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s sweep the floor.\u003c/strong>\u003c/td>\u003ctd>Mình quét sàn nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>36\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Can you hold the dustpan?\u003c/strong>\u003c/td>\u003ctd>Con có thể cầm cái hốt rác không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>37\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s put the trash in the bin.\u003c/strong>\u003c/td>\u003ctd>Mình bỏ rác vào thùng nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>38\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Don&#x27;t forget to clean under the table.\u003c/strong>\u003c/td>\u003ctd>Đừng quên dọn dưới gầm bàn nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>39\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s put everything back in its place.\u003c/strong>\u003c/td>\u003ctd>Mình cất mọi thứ về đúng chỗ nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>40\u003c/b>\u003c/td>\u003ctd>\u003cstrong>The house is getting cleaner.\u003c/strong>\u003c/td>\u003ctd>Ngôi nhà đang sạch hơn rồi.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phần 5: Phân loại và\ngấp quần áo (câu 41–50)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>41\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s sort the clothes.\u003c/strong>\u003c/td>\u003ctd>Mình phân loại quần áo nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>42\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put the white clothes here.\u003c/strong>\u003c/td>\u003ctd>Đặt quần áo màu trắng ở đây nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>43\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put the colored clothes over there.\u003c/strong>\u003c/td>\u003ctd>Đặt quần áo màu ở đằng kia nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>44\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s fold these towels.\u003c/strong>\u003c/td>\u003ctd>Mình gấp những chiếc khăn này nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>45\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Can you match the socks?\u003c/strong>\u003c/td>\u003ctd>Con có thể ghép những chiếc tất lại không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>46\u003c/b>\u003c/td>\u003ctd>\u003cstrong>This sock doesn&#x27;t have a match.\u003c/strong>\u003c/td>\u003ctd>Chiếc tất này chưa có chiếc nào thành đôi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>47\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put the clean clothes away.\u003c/strong>\u003c/td>\u003ctd>Cất quần áo sạch đi nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>48\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Everything has its place.\u003c/strong>\u003c/td>\u003ctd>Mọi thứ đều có chỗ của nó.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>49\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s keep things organized.\u003c/strong>\u003c/td>\u003ctd>Mình giữ mọi thứ ngăn nắp nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>50\u003c/b>\u003c/td>\u003ctd>\u003cstrong>You&#x27;re doing a great job.\u003c/strong>\u003c/td>\u003ctd>Con đang làm rất tốt.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phần 6: Hoàn thành và\nkhen ngợi (câu 51–60)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>51\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We&#x27;re almost done.\u003c/strong>\u003c/td>\u003ctd>Mình gần xong rồi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>52\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Just a little more.\u003c/strong>\u003c/td>\u003ctd>Chỉ còn một chút nữa thôi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>53\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s check the room.\u003c/strong>\u003c/td>\u003ctd>Mình kiểm tra lại căn phòng nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>54\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Wow, everything looks so clean.\u003c/strong>\u003c/td>\u003ctd>Wow, mọi thứ trông thật sạch sẽ.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>55\u003c/b>\u003c/td>\u003ctd>\u003cstrong>You did a great job today.\u003c/strong>\u003c/td>\u003ctd>Hôm nay con đã làm rất tốt.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>56\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Thank you for helping me.\u003c/strong>\u003c/td>\u003ctd>Cảm ơn con đã giúp mẹ.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>57\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I&#x27;m proud of you.\u003c/strong>\u003c/td>\u003ctd>Mẹ tự hào về con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>58\u003c/b>\u003c/td>\u003ctd>\u003cstrong>We make a great team.\u003c/strong>\u003c/td>\u003ctd>Mẹ con mình là một đội tuyệt vời.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>59\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Now it&#x27;s time to relax.\u003c/strong>\u003c/td>\u003ctd>Bây giờ đến lúc nghỉ ngơi rồi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>60\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s enjoy our clean home.\u003c/strong>\u003c/td>\u003ctd>Mình cùng tận hưởng ngôi nhà sạch sẽ nhé.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Từ vựng dọn dẹp cần nhớ\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c4\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">clean up\u003c/b>\u003cspan class=\"sc-txt\">dọn dẹp\u003c/span>\u003cspan class=\"sc-ex\">It's time to \u003cb>clean up\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">put away\u003c/b>\u003cspan class=\"sc-txt\">cất đi\u003c/span>\u003cspan class=\"sc-ex\">Please \u003cb>put\u003c/b> your toys \u003cb>away\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">make the bed\u003c/b>\u003cspan class=\"sc-txt\">dọn giường\u003c/span>\u003cspan class=\"sc-ex\">Let's \u003cb>make\u003c/b> your \u003cb>bed\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">fold\u003c/b>\u003cspan class=\"sc-txt\">gấp\u003c/span>\u003cspan class=\"sc-ex\">\u003cb>Fold\u003c/b> your clean clothes.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">wipe\u003c/b>\u003cspan class=\"sc-txt\">lau\u003c/span>\u003cspan class=\"sc-ex\">Can you \u003cb>wipe\u003c/b> the table?\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k6\">\u003cb class=\"sc-term\">sweep\u003c/b>\u003cspan class=\"sc-txt\">quét\u003c/span>\u003cspan class=\"sc-ex\">Let's \u003cb>sweep\u003c/b> the floor.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k7\">\u003cb class=\"sc-term\">dustpan\u003c/b>\u003cspan class=\"sc-txt\">cái hốt rác\u003c/span>\u003cspan class=\"sc-ex\">Can you hold the \u003cb>dustpan\u003c/b>?\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k8\">\u003cb class=\"sc-term\">laundry basket\u003c/b>\u003cspan class=\"sc-txt\">giỏ đồ giặt\u003c/span>\u003cspan class=\"sc-ex\">Put it in the \u003cb>laundry basket\u003c/b>.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Mỗi lần dọn nhà, chọn 1 phần (10 câu) để nói. Đến lần thứ 6 là con đã nghe đủ 60 câu.\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-meo-ngu-phap","menu":"meo-ngu-phap","title":"Mẹo ghi nhớ ngữ pháp tiếng Anh lâu và hiệu quả","html":"\u003cp>\u003cstrong>Học ngữ pháp tiếng Anh\u003c/strong> không chỉ là ghi nhớ quy tắc mà còn là việc áp dụng chúng một cách tự nhiên. Dưới đây là những mẹo giúp bạn ghi nhớ ngữ pháp lâu và hiệu quả.\u003c/p> \u003cul> \u003cli>\u003cstrong>Học đi đôi với hành – Áp dụng ngay vào đặt câu, viết đoạn văn ngắn:\u003c/strong> Ngay sau khi học một quy tắc ngữ pháp mới, hãy viết ít nhất 5 câu sử dụng quy tắc đó. Bên cạnh đó, hãy áp dụng vào các tình huống thực tế trong cuộc sống của bạn. Ví dụ, sau khi học thì hiện tại tiếp diễn, hãy viết 5 câu về những gì bạn và gia đình đang làm.\u003c/li> \u003cli>\u003cstrong>Sử dụng sơ đồ tư duy (mind maps) để hệ thống hóa kiến thức: \u003c/strong>Sơ đồ tư duy giúp bạn thấy được mối liên hệ giữa các chủ điểm ngữ pháp. Ví dụ, vẽ sơ đồ tư duy về \"Thì trong tiếng Anh\" với các nhánh con là các thì khác nhau, kèm theo công thức, cách dùng và ví dụ. Sơ đồ trực quan giúp bộ não dễ ghi nhớ hơn văn bản thông thường.\u003c/li> \u003c/ul> \u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Sơ đồ tư duy và lịch ôn bài\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cp class=\"sc-label\">Ví dụ sơ đồ tư duy: Các thì\u003c/p>\u003cdiv class=\"sc-mind\">\u003cdiv class=\"m-root\">Các thì\u003c/div>\u003cdiv class=\"m-branches\">\u003cdiv class=\"m-b k1\">\u003cb>Hiện tại\u003c/b>\u003cspan>đơn · tiếp diễn · hoàn thành · HTHT tiếp diễn\u003c/span>\u003c/div>\u003cdiv class=\"m-b k3\">\u003cb>Quá khứ\u003c/b>\u003cspan>đơn · tiếp diễn · hoàn thành\u003c/span>\u003c/div>\u003cdiv class=\"m-b k5\">\u003cb>Tương lai\u003c/b>\u003cspan>đơn · gần (be going to) · hoàn thành\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Lịch ôn lại một bài\u003c/p>\u003cdiv class=\"sc-days\">\u003cspan>\u003cb>1\u003c/b>\u003csmall>ngày 1\u003c/small>\u003c/span>\u003cspan>\u003cb>3\u003c/b>\u003csmall>ngày 3\u003c/small>\u003c/span>\u003cspan>\u003cb>7\u003c/b>\u003csmall>ngày 7\u003c/small>\u003c/span>\u003cspan>\u003cb>14\u003c/b>\u003csmall>ngày 14\u003c/small>\u003c/span>\u003cspan>\u003cb>30\u003c/b>\u003csmall>ngày 30\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Vẽ sơ đồ ra giấy, mỗi nhánh ghi công thức và một câu ví dụ của chính mình.\u003c/p>\u003c/div> \u003cul> \u003cli>\u003cstrong>Đọc truyện, xem phim có phụ đề tiếng Anh để làm quen với cấu trúc tự nhiên:\u003c/strong> Tiếp xúc với ngôn ngữ tự nhiên giúp bạn thấy ngữ pháp \"hoạt động\" như thế nào trong thực tế. Bắt đầu với nội dung đơn giản (truyện tranh, phim hoạt hình), sau đó tăng dần độ khó. Khi gặp cấu trúc mới, hãy ghi lại và tìm hiểu quy tắc ngữ pháp đằng sau.\u003c/li> \u003cli>\u003cstrong>Tìm bạn học nhóm hoặc người hướng dẫn để cùng trao đổi và sửa lỗi:\u003c/strong> Học nhóm giúp bạn nhận ra lỗi sai mà bản thân không thấy. Thực hành nói và viết, sau đó nhờ người khác góp ý. Giải thích quy tắc ngữ pháp cho người khác cũng là cách hiệu quả để kiểm tra hiểu biết của bạn.\u003c/li> \u003cli>\u003cstrong>Kiên trì lặp lại và ôn tập thường xuyên (spaced repetition):\u003c/strong> Thay vì học dồn một lúc, hãy chia nhỏ và học lặp lại theo thời gian. Ví dụ: học thì hiện tại đơn vào ngày 1, ôn lại vào ngày 3, ngày 7, ngày 14, ngày 30. Phương pháp này giúp kiến thức chuyển từ trí nhớ ngắn hạn sang trí nhớ dài hạn.\u003c/li> \u003c/ul>","order":0,"updated":"2026-10-24"},{"id":"bai-3000-tu","menu":"3000-tu-qua-tho","title":"Học từ vựng tiếng Anh qua thơ lục bát","html":"\u003cp class=\"lead\">Bài thơ lục bát giúp nhớ từ vựng tiếng Anh theo vần điệu. Đây là bài thơ sưu tầm, lưu truyền rộng rãi trên mạng (khuyết danh); trang đã sửa lỗi chính tả các từ tiếng Anh, bỏ những câu dịch sai hoặc không phù hợp với trẻ em.\u003c/p>\u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bí quyết\u003c/span>\u003cp class=\"sc-title\">Cách học bằng thơ\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Đọc to\u003c/b>\u003cspan class=\"sc-txt\">Đọc mỗi lần 4 câu, nhấn vào từ tiếng Anh in đậm.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Che nghĩa\u003c/b>\u003cspan class=\"sc-txt\">Che phần tiếng Việt, nhìn từ tiếng Anh để đoán nghĩa.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Đặt câu\u003c/b>\u003cspan class=\"sc-txt\">Chọn 3 từ mới và đặt mỗi từ một câu ngắn.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"poem\">\u003cp>\u003cb>Hello\u003c/b> có nghĩa xin chào\u003cbr>\u003cb>Goodbye\u003c/b> tạm biệt, thì thào \u003cb>whisper\u003c/b>\u003cbr>\u003cb>Lie\u003c/b> nằm, \u003cb>sleep\u003c/b> ngủ, \u003cb>dream\u003c/b> mơ\u003cbr>\u003cb>Here\u003c/b> đây, \u003cb>there\u003c/b> đó, \u003cb>which\u003c/b> nào, \u003cb>where\u003c/b> đâu\u003c/p>\u003cp>\u003cb>Long\u003c/b> dài, \u003cb>short\u003c/b> ngắn, \u003cb>tall\u003c/b> cao\u003cbr>\u003cb>Sentence\u003c/b> có nghĩa là câu\u003cbr>\u003cb>Lesson\u003c/b> bài học, \u003cb>rainbow\u003c/b> cầu vồng\u003cbr>\u003cb>Husband\u003c/b> là đức ông chồng\u003c/p>\u003cp>\u003cb>Daddy\u003c/b> cha bố, \u003cb>please don't\u003c/b> xin đừng\u003cbr>\u003cb>Darling\u003c/b> tiếng gọi em cưng\u003cbr>\u003cb>Merry\u003c/b> vui thích, cái sừng là \u003cb>horn\u003c/b>\u003cbr>Rách rồi xài đỡ chữ \u003cb>torn\u003c/b>\u003c/p>\u003cp>\u003cb>To sing\u003c/b> là hát, \u003cb>a song\u003c/b> một bài\u003cbr>Nói sai sự thật \u003cb>to lie\u003c/b>\u003cbr>\u003cb>Go\u003c/b> đi, \u003cb>come\u003c/b> đến, một vài là \u003cb>some\u003c/b>\u003cbr>Đứng \u003cb>stand\u003c/b>, \u003cb>look\u003c/b> ngó, \u003cb>lie\u003c/b> nằm\u003c/p>\u003cp>\u003cb>Five\u003c/b> năm, \u003cb>four\u003c/b> bốn, \u003cb>hold\u003c/b> cầm, \u003cb>play\u003c/b> chơi\u003cbr>\u003cb>One life\u003c/b> là một cuộc đời\u003cbr>\u003cb>Happy sung\u003c/b> sướng, \u003cb>laugh\u003c/b> cười, \u003cb>cry\u003c/b> kêu\u003cbr>\u003cb>Charming\u003c/b> duyên dáng, mỹ miều \u003cb>graceful\u003c/b>\u003c/p>\u003cp>Mặt trăng là chữ \u003cb>the moon\u003c/b>\u003cbr>\u003cb>World\u003c/b> là thế giới, sớm \u003cb>soon\u003c/b>, \u003cb>lake\u003c/b> hồ\u003cbr>Dao \u003cb>knife\u003c/b>, \u003cb>spoon\u003c/b> muỗng, cuốc \u003cb>hoe\u003c/b>\u003cbr>Đêm \u003cb>night\u003c/b>, \u003cb>dark\u003c/b> tối, khổng lồ \u003cb>giant\u003c/b>\u003c/p>\u003cp>\u003cb>Fun\u003c/b> vui, \u003cb>far\u003c/b> xa, \u003cb>near\u003c/b> gần\u003cbr>\u003cb>Sorry\u003c/b> xin lỗi, \u003cb>dull\u003c/b> đần, \u003cb>wise\u003c/b> khôn\u003cbr>\u003cb>Bury\u003c/b> có nghĩa là chôn\u003cbr>\u003cb>Our souls\u003c/b> tạm dịch linh hồn chúng ta\u003c/p>\u003cp>Xe hơi du lịch là \u003cb>car\u003c/b>\u003cbr>\u003cb>Sir\u003c/b> ngài, \u003cb>Lord\u003c/b> đức, thưa bà \u003cb>madam\u003c/b>\u003cbr>\u003cb>Thousand\u003c/b> nghĩa đúng mười trăm\u003cbr>Ngày \u003cb>day\u003c/b>, tuần \u003cb>week\u003c/b>, \u003cb>year\u003c/b> năm, \u003cb>hour\u003c/b> giờ\u003c/p>\u003cp>\u003cb>Wait there\u003c/b> đứng đó đợi chờ\u003cbr>\u003cb>Nightmare\u003c/b> ác mộng, \u003cb>dream\u003c/b> mơ, \u003cb>pray\u003c/b> cầu\u003cbr>Trừ ra \u003cb>except\u003c/b>, \u003cb>deep\u003c/b> sâu\u003cbr>\u003cb>Daughter\u003c/b> con gái, \u003cb>bridge\u003c/b> cầu, \u003cb>pond\u003c/b> ao\u003c/p>\u003cp>\u003cb>Enter\u003c/b> tạm dịch đi vào\u003cbr>\u003cb>Shoulder\u003c/b> cứ dịch là vai\u003cbr>\u003cb>Writer\u003c/b> văn sĩ, cái đài \u003cb>radio\u003c/b>\u003cbr>\u003cb>A bowl\u003c/b> là một cái tô\u003c/p>\u003cp>Chữ \u003cb>tear\u003c/b> nước mắt, \u003cb>tomb\u003c/b> mồ, \u003cb>miss\u003c/b> cô\u003cbr>Máy khâu dùng tạm chữ \u003cb>sew\u003c/b>\u003cbr>Kẻ thù dịch đại là \u003cb>foe\u003c/b> chẳng lầm\u003cbr>\u003cb>Shelter\u003c/b> tạm dịch là hầm\u003c/p>\u003cp>Chữ \u003cb>shout\u003c/b> là hét, nói thầm \u003cb>whisper\u003c/b>\u003cbr>\u003cb>What time\u003c/b> là hỏi mấy giờ\u003cbr>\u003cb>Clear\u003c/b> trong, \u003cb>clean\u003c/b> sạch, mờ mờ là \u003cb>dim\u003c/b>\u003cbr>Gặp ông ta dịch \u003cb>see him\u003c/b>\u003c/p>\u003cp>\u003cb>Swim\u003c/b> bơi, \u003cb>wade\u003c/b> lội, \u003cb>drown\u003c/b> chìm chết trôi\u003cbr>\u003cb>Mountain\u003c/b> là núi, \u003cb>hill\u003c/b> đồi\u003cbr>\u003cb>Valley\u003c/b> thung lũng, cây sồi \u003cb>oak tree\u003c/b>\u003cbr>Tiền xin đóng học \u003cb>school fee\u003c/b>\u003c/p>\u003cp>Yêu tôi dùng chữ \u003cb>love me\u003c/b> chẳng lầm\u003cbr>\u003cb>To steal\u003c/b> tạm dịch cầm nhầm\u003cbr>Tẩy chay \u003cb>boycott\u003c/b>, gia cầm \u003cb>poultry\u003c/b>\u003cbr>\u003cb>Cattle\u003c/b> gia súc, ong \u003cb>bee\u003c/b>\u003c/p>\u003cp>\u003cb>Something to eat\u003c/b> chút gì để ăn\u003cbr>\u003cb>Lip\u003c/b> môi, \u003cb>tongue\u003c/b> lưỡi, \u003cb>teeth\u003c/b> răng\u003cbr>\u003cb>Exam\u003c/b> thi cử, cái bằng \u003cb>licence\u003c/b>\u003cbr>\u003cb>Lovely\u003c/b> có nghĩa dễ thương\u003c/p>\u003cp>\u003cb>Pretty\u003c/b> xinh đẹp, thường thường \u003cb>so-so\u003c/b>\u003cbr>\u003cb>Lotto\u003c/b> là chơi lô tô\u003cbr>Nấu ăn là \u003cb>cook\u003c/b>, \u003cb>wash clothes\u003c/b> giặt đồ\u003cbr>\u003cb>Push\u003c/b> thì có nghĩa đẩy, xô\u003c/p>\u003cp>\u003cb>Marriage\u003c/b> đám cưới, \u003cb>single\u003c/b> độc thân\u003cbr>\u003cb>Foot\u003c/b> thì có nghĩa bàn chân\u003cbr>\u003cb>Far\u003c/b> là xa cách, còn gần là \u003cb>near\u003c/b>\u003cbr>\u003cb>Spoon\u003c/b> có nghĩa cái thìa\u003c/p>\u003cp>Toán trừ \u003cb>subtract\u003c/b>, toán chia \u003cb>divide\u003c/b>\u003cbr>\u003cb>Dream\u003c/b> thì có nghĩa giấc mơ\u003cbr>\u003cb>Month\u003c/b> thì là tháng, thời giờ là \u003cb>time\u003c/b>\u003cbr>\u003cb>Job\u003c/b> thì có nghĩa việc làm\u003c/p>\u003cp>\u003cb>Lady\u003c/b> phái nữ, phái nam \u003cb>gentleman\u003c/b>\u003cbr>\u003cb>Close friend\u003c/b> có nghĩa bạn thân\u003cbr>\u003cb>Leaf\u003c/b> là chiếc lá, còn \u003cb>sun\u003c/b> mặt trời\u003cbr>\u003cb>Fall down\u003c/b> có nghĩa là rơi\u003c/p>\u003cp>\u003cb>Welcome\u003c/b> chào đón, mời là \u003cb>invite\u003c/b>\u003cbr>\u003cb>Short\u003c/b> là ngắn, \u003cb>long\u003c/b> là dài\u003cbr>Mũ thì là \u003cb>hat\u003c/b>, chiếc hài là \u003cb>shoe\u003c/b>\u003cbr>\u003cb>Autumn\u003c/b> có nghĩa mùa thu\u003c/p>\u003cp>\u003cb>Summer\u003c/b> mùa hạ, cái tù là \u003cb>jail\u003c/b>\u003cbr>\u003cb>Duck\u003c/b> là vịt, \u003cb>pig\u003c/b> là heo\u003cbr>\u003cb>Rich\u003c/b> là giàu có, còn nghèo là \u003cb>poor\u003c/b>\u003cbr>\u003cb>Crab\u003c/b> thì có nghĩa con cua\u003c/p>\u003cp>\u003cb>Church\u003c/b> nhà thờ đó, còn chùa \u003cb>temple\u003c/b>\u003cbr>\u003cb>Aunt\u003c/b> có nghĩa dì, cô\u003cbr>\u003cb>Chair\u003c/b> là cái ghế, cái hồ là \u003cb>pool\u003c/b>\u003cbr>\u003cb>Late\u003c/b> là muộn, sớm là \u003cb>soon\u003c/b>\u003c/p>\u003cp>\u003cb>Hospital\u003c/b> bệnh viện, \u003cb>school\u003c/b> là trường\u003cbr>\u003cb>Dew\u003c/b> thì có nghĩa là sương\u003cbr>\u003cb>Happy\u003c/b> vui vẻ, chán chường \u003cb>weary\u003c/b>\u003cbr>\u003cb>Exam\u003c/b> có nghĩa kỳ thi\u003c/p>\u003cp>\u003cb>Nervous\u003c/b> lo lắng, \u003cb>mommy\u003c/b> mẹ hiền\u003cbr>\u003cb>Region\u003c/b> có nghĩa là miền\u003cbr>\u003cb> \u003cbr>\u003cb>Hear\u003c/b> là nghe, \u003cb>watch\u003c/b> là xem\u003c/p>\u003cp>\u003cb>Electric\u003c/b> là điện, còn \u003cb>lamp\u003c/b> bóng đèn\u003cbr>\u003cb>Praise\u003c/b> có nghĩa ngợi khen\u003cbr>\u003cb>Crowd\u003c/b> đông đúc, lấn chen \u003cb>hustle\u003c/b>\u003cbr>\u003cb>Capital\u003c/b> là thủ đô\u003c/p>\u003cp>\u003cb>City\u003c/b> thành phố, \u003cb>local\u003c/b> địa phương\u003cbr>\u003cb>Country\u003c/b> có nghĩa quê hương\u003cbr>\u003cb>Field\u003c/b> là đồng ruộng, còn vườn \u003cb>garden\u003c/b>\u003cbr>Chốc lát là chữ \u003cb>moment\u003c/b>\u003c/p>\u003cp>\u003cb>Fish\u003c/b> là con cá, \u003cb>chicken\u003c/b> gà tơ\u003cbr>\u003cb>Naive\u003c/b> có nghĩa ngây thơ\u003cbr>\u003cb>Poet\u003c/b> thi sĩ, \u003cb>great writer\u003c/b> văn hào\u003cbr>\u003cb>Tall\u003c/b> thì có nghĩa là cao\u003c/p>\u003cp>\u003cb>Short\u003c/b> là thấp ngắn, còn chào \u003cb>hello\u003c/b>\u003cbr>\u003cb>Uncle\u003c/b> là chú, \u003cb>aunt\u003c/b> cô\u003cbr>\u003cb>Shy\u003c/b> là mắc cỡ, \u003cb>coarse\u003c/b> là thô\u003cbr>\u003cb>Come on\u003c/b> có nghĩa mời vô\u003c/p>\u003cp>\u003cb>Go away\u003c/b> đi khỏi, còn vồ \u003cb>pounce\u003c/b>\u003cbr>\u003cb>Poem\u003c/b> có nghĩa là thơ\u003cbr>\u003cb>Strong\u003c/b> khoẻ mạnh, mệt phờ \u003cb>dog-tired\u003c/b>\u003cbr>Bầu trời thường gọi \u003cb>sky\u003c/b>\u003c/p>\u003cp>\u003cb>Life\u003c/b> là sự sống, còn \u003cb>die\u003c/b> lìa đời\u003cbr>\u003cb>Shed tears\u003c/b> có nghĩa lệ rơi\u003cbr>\u003cb>Fully\u003c/b> là đủ, nửa vời \u003cb>by halves\u003c/b>\u003cbr>Ở lại dùng chữ \u003cb>stay\u003c/b>\u003c/p>\u003cp>Bỏ đi là \u003cb>leave\u003c/b>, còn nằm là \u003cb>lie\u003c/b>\u003cbr>\u003cb>Tomorrow\u003c/b> có nghĩa ngày mai\u003cbr>Hoa sen \u003cb>lotus\u003c/b>, hoa lài \u003cb>jasmine\u003c/b>\u003cbr>\u003cb>Private\u003c/b> có nghĩa là riêng của mình\u003c/p>\u003cp>Cảm giác là chữ \u003cb>feeling\u003c/b>\u003cbr>\u003cb>Camera\u003c/b> máy ảnh, hình là \u003cb>photo\u003c/b>\u003cbr>Động vật là \u003cb>animal\u003c/b>\u003cbr>\u003cb>Big\u003c/b> là \u003cb>to\u003c/b> lớn, \u003cb>little\u003c/b> nhỏ nhoi\u003c/p>\u003cp>\u003cb>Elephant\u003c/b> là con voi\u003cbr>\u003cb>Goby\u003c/b> cá bống, cá mòi \u003cb>sardine\u003c/b>\u003cbr>Mỏng mảnh thì là chữ \u003cb>thin\u003c/b>\u003cbr>Cổ là chữ \u003cb>neck\u003c/b>, còn \u003cb>chin\u003c/b> cái cằm\u003c/p>\u003cp>\u003cb>Visit\u003c/b> có nghĩa viếng thăm\u003cbr>\u003cb>Lie down\u003c/b> có nghĩa là nằm nghỉ ngơi\u003cbr>\u003cb>Mouse\u003c/b> con chuột, \u003cb>bat\u003c/b> con dơi\u003cbr>\u003cb>Separate\u003c/b> có nghĩa tách rời, chia ra\u003c/p>\u003cp>\u003cb>Gift\u003c/b> thì có nghĩa món quà\u003cbr>\u003cb>Guest\u003c/b> thì là khách, chủ nhà \u003cb>host\u003c/b>\u003cbr>Lối ra \u003cb>exit\u003c/b>, \u003cb>enter\u003c/b> đi vào\u003cbr>\u003cb>Up\u003c/b> lên, còn xuống là \u003cb>down\u003c/b>\u003c/p>\u003cp>\u003cb>Beside\u003c/b> bên cạnh, \u003cb>about\u003c/b> khoảng chừng\u003cbr>\u003cb>Stop\u003c/b> có nghĩa là ngừng\u003cbr>\u003cb>Ocean\u003c/b> là biển, rừng là \u003cb>jungle\u003c/b>\u003cbr>\u003cb>Silly\u003c/b> là kẻ dại khờ\u003c/p>\u003cp>Khôn ngoan \u003cb>smart\u003c/b>, đù đờ \u003cb>sluggish\u003c/b>\u003cbr>Cửa sổ là chữ \u003cb>window\u003c/b>\u003cbr>\u003cb>Special\u003c/b> đặc biệt, \u003cb>normal\u003c/b> thường thôi\u003cbr>\u003cb>Lazy\u003c/b> làm biếng quá rồi\u003c/p>\u003cp>Hứng thì cứ việc \u003cb>go on\u003c/b>\u003cbr>Còn không thì \u003cb>stop\u003c/b>, ta còn nghỉ ngơi!\u003cbr>Cằm \u003cb>chin\u003c/b>, có \u003cb>beard\u003c/b> là râu\u003cbr>\u003cb>Razor\u003c/b> dao cạo, \u003cb>head\u003c/b> đầu, da \u003cb>skin\u003c/b>\u003c/p>\u003cp>\u003cb>Thousand\u003c/b> thì gọi là nghìn\u003cbr>\u003cb>Billion\u003c/b> là tỷ, \u003cb>look\u003c/b> nhìn, rồi \u003cb>then\u003c/b>\u003cbr>Đầu tư \u003cb>invest\u003c/b>, quyền \u003cb>right\u003c/b>\u003cbr>\u003cb>Windy\u003c/b> có gió, \u003cb>rainstorm\u003c/b> bão bùng\u003c/p>\u003cp>\u003cb>Midnight\u003c/b> nửa đêm, anh hùng \u003cb>hero\u003c/b>\u003cbr>\u003cb>Come on\u003c/b> xin cứ nhào vô\u003cbr>\u003cb>No fear\u003c/b> không sợ, các cô \u003cb>ladies\u003c/b>\u003cbr>Con cò \u003cb>stork\u003c/b>, \u003cb>fly\u003c/b> bay\u003c/p>\u003cp>Mây \u003cb>cloud\u003c/b>, \u003cb>at\u003c/b> ở, \u003cb>blue sky\u003c/b> xanh trời\u003cbr>\u003cb>Oh my goodness\u003c/b>! Trời ơi\u003cbr>\u003cb>Mind you\u003c/b> lưu ý, \u003cb>word\u003c/b> lời nói hay\u003cbr>\u003cb>Here and there\u003c/b> đó cùng đây\u003c/p>\u003cp>\u003cb>Travel\u003c/b> du lịch, \u003cb>full\u003c/b> đầy, \u003cb>smart\u003c/b> khôn\u003cbr>Cô đơn ta dịch \u003cb>alone\u003c/b>\u003cbr>Anh văn \u003cb>English\u003c/b>, nỗi buồn \u003cb>sorrow\u003c/b>\u003cbr>\u003cb>Old man\u003c/b> ông lão, bắt đầu \u003cb>begin\u003c/b>\u003c/p>\u003cp>\u003cb>Eat\u003c/b> ăn, \u003cb>learn\u003c/b> học, \u003cb>look\u003c/b> nhìn\u003cbr>\u003cb>Easy to forget\u003c/b> dễ quên\u003cbr>\u003cb>Because\u003c/b> là bởi… cho nên, \u003cb>dumb\u003c/b> đần\u003cbr>\u003cb>Vietnamese\u003c/b> người nước Nam\u003c/p>\u003cp>\u003cb>Need to know\u003c/b> biết, nó cần lắm thay\u003cbr>\u003cb>Since\u003c/b> từ, \u003cb>before\u003c/b> trước, \u003cb>now\u003c/b> nay\u003cbr>Đèn \u003cb>lamp\u003c/b>, sách \u003cb>book\u003c/b>, đêm \u003cb>night\u003c/b>, \u003cb>sit\u003c/b> ngồi\u003cbr>\u003cb>Sorry\u003c/b> thương xót, \u003cb>me\u003c/b> tôi\u003c/p>\u003cp>\u003cb>Please don't laugh\u003c/b> đừng cười, làm ơn\u003cbr>\u003cb>Far\u003c/b> xa, \u003cb>near\u003c/b> gọi là gần\u003cbr>\u003cb>Wedding\u003c/b> lễ cưới, \u003cb>diamond\u003c/b> kim cương\u003cbr>\u003cb>So cute\u003c/b> là quá dễ thương\u003c/p>\u003cp>\u003cb>Shopping\u003c/b> mua sắm, có sương \u003cb>foggy\u003c/b>\u003cbr>\u003cb>Skinny\u003c/b> ốm nhách, \u003cb>fat\u003c/b> phì\u003cbr>\u003cb>Fighting\u003c/b> chiến đấu, quá lỳ \u003cb>stubborn\u003c/b>\u003cbr>\u003cb>Cotton\u003c/b> ta dịch bông gòn\u003c/p>\u003cp>\u003cb>A well\u003c/b> là giếng, đường mòn là \u003cb>trail\u003c/b>\u003cbr>\u003cb>Poem\u003c/b> có nghĩa bài thơ\u003cbr>\u003cb>Poet\u003c/b> thi sĩ nên mơ mộng nhiều\u003cbr>\u003cb>One-way\u003c/b> nghĩa nó một chiều\u003c/p>\u003cp>\u003cb>The field\u003c/b> đồng ruộng, con diều là \u003cb>kite\u003c/b>\u003cbr>Của tôi có nghĩa là \u003cb>mine\u003c/b>\u003cbr>\u003cb>To bite\u003c/b> là cắn, \u003cb>to find\u003c/b> kiếm tìm\u003cbr>\u003cb>To carve\u003c/b> chạm khắc, \u003cb>heart\u003c/b> tim\u003c/p>\u003cp>\u003cb>Dryer\u003c/b> máy sấy, đắm chìm \u003cb>to sink\u003c/b>\u003cbr>\u003cb>Feeling\u003c/b> cảm giác, nghĩ \u003cb>think\u003c/b>\u003cbr>\u003cb>Print\u003c/b> có nghĩa là \u003cb>in\u003c/b>, \u003cb>dark\u003c/b> mờ\u003cbr>\u003cb>Letter\u003c/b> có nghĩa lá thư\u003c/p>\u003cp>\u003cb>To live\u003c/b> là sống, đơn sơ \u003cb>simple\u003c/b>\u003cbr>\u003cb>Clock\u003c/b> là cái đồng hồ\u003cbr>\u003cb>Crown\u003c/b> vương miện, nấm mồ \u003cb>grave\u003c/b>\u003cbr>\u003cb>King\u003c/b> vua, nói nhảm \u003cb>to rave\u003c/b>\u003c/p>\u003cp>\u003cb>Brave can\u003c/b> đảm, \u003cb>to pave\u003c/b> lát đường\u003cbr>\u003cb>School\u003c/b> nghĩa nó là trường\u003cbr>\u003cb>Lolly\u003c/b> là kẹo, còn đường \u003cb>sugar\u003c/b>\u003cbr>\u003cb>Station\u003c/b> trạm, nhà ga cũng là \u003cb>station\u003c/b>\u003c/p>\u003cp>\u003cb>Fish sauce\u003c/b> nước mắm, \u003cb>tomato\u003c/b> cà chua\u003cbr>\u003cb>Even\u003c/b> huề, \u003cb>win\u003c/b> thắng, \u003cb>lose\u003c/b> thua\u003cbr>\u003cb>Turtle\u003c/b> là một con rùa\u003cbr>\u003cb>Shark\u003c/b> là cá mập, \u003cb>crab\u003c/b> cua, \u003cb>claw\u003c/b> càng\u003c/p>\u003cp>\u003cb>Complete\u003c/b> là được hoàn toàn\u003cbr>\u003cb>Fishing\u003c/b> câu cá, \u003cb>drill\u003c/b> khoan, \u003cb>puncture\u003c/b> dùi\u003cbr>\u003cb>Clinic\u003c/b> phòng mạch, sần sùi \u003cb>lumpy\u003c/b>\u003cbr>\u003cb>In danger\u003c/b> bị lâm nguy\u003c/p>\u003cp>Giải phẫu nhỏ là \u003cb>surgery\u003c/b> đúng rồi\u003cbr>\u003cb>No more\u003c/b> ta dịch là thôi\u003cbr>\u003cb>Again\u003c/b> làm nữa, bồi hồi \u003cb>fretful\u003c/b>\u003cbr>Phô mai ta dịch là \u003cb>cheese\u003c/b>\u003c/p>\u003cp>\u003cb>Cake\u003c/b> là bánh ngọt, còn mì \u003cb>noodle\u003c/b>\u003cbr>\u003cb>Orange\u003c/b> cam, táo \u003cb>apple\u003c/b>\u003cbr>\u003cb>Jackfruit\u003c/b> trái mít, \u003cb>vegetable\u003c/b> là rau\u003cbr>\u003cb>Custard apple\u003c/b> mãng cầu\u003c/p>\u003cp>\u003cb>Prune\u003c/b> là mận khô, \u003cb>sound\u003c/b> âm\u003cbr>\u003cb>Plough\u003c/b> tức là đi cày\u003cbr>\u003cb>Week\u003c/b> tuần, \u003cb>month\u003c/b> tháng, \u003cb>what time\u003c/b> mấy giờ\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"p-6hx6lv","menu":"m-8hjylc","title":"15 lời khuyên khi học tiếng Anh","html":"\u003cp class=\"lead\">15 lời khuyên giúp việc học tiếng Anh hiệu quả hơn, áp dụng được cho cả trẻ em và người lớn.\u003c/p>\u003col class=\"tips\">\u003cli>Tích cực xem truyền hình, video, nghe đài, đọc báo tiếng Anh hoặc nói chuyện với người bản ngữ bất cứ khi nào có cơ hội.\u003c/li>\u003cli>Sử dụng tiếng Anh ở nhiều nơi, không chỉ trong lớp học.\u003c/li>\u003cli>Chơi trò chơi và tập hát các bài hát tiếng Anh.\u003c/li>\u003cli>Khi nói chuyện bằng tiếng Anh, cố gắng diễn đạt bằng mọi cách có thể, kể cả dùng điệu bộ.\u003c/li>\u003cli>Hỏi lại hoặc đề nghị người nói nhắc lại nếu chưa hiểu rõ.\u003c/li>\u003cli>Đừng bao giờ sợ mắc lỗi khi nói và viết tiếng Anh.\u003c/li>\u003cli>Áp dụng từ và cấu trúc mới học được trong nhiều tình huống khác nhau.\u003c/li>\u003cli>Đọc các bài viết khác nhau về cùng một chủ đề, rồi tập nói và viết về chủ đề đó.\u003c/li>\u003cli>Cố gắng đoán nghĩa của từ, của câu dựa vào nội dung bài đọc, bài nghe hoặc tình huống giao tiếp; không nên quá phụ thuộc vào từ điển.\u003c/li>\u003cli>So sánh để thấy sự khác nhau giữa tiếng Anh và tiếng Việt.\u003c/li>\u003cli>Tự sửa lỗi trước khi được bạn bè hoặc thầy cô sửa.\u003c/li>\u003cli>Học theo nhóm hoặc theo cặp.\u003c/li>\u003cli>Học thuộc các quy tắc ngữ pháp, từ mới và các đoạn hội thoại mẫu.\u003c/li>\u003cli>Nghe tiếng Anh (bài nghe, video, bài hát) và tập viết chính tả thường xuyên.\u003c/li>\u003cli>Áp dụng các cách trên đều đặn trong 2–3 tháng, bạn sẽ thấy rõ kết quả học tập của mình.\u003c/li>\u003c/ol>","order":0,"updated":"2026-10-26"},{"id":"p-qagven","menu":"m-4z3h45","title":"Cách phát âm đuôi -ed","html":"\u003cp class=\"lead\">Đuôi -ed của động từ có quy tắc (thì quá khứ đơn, quá khứ phân từ) có 3 cách đọc, tùy vào \u003cb>âm cuối\u003c/b> của động từ gốc.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cách đọc\u003c/th>\u003cth>Khi nào\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>/ɪd/\u003c/strong>\u003c/td>\u003ctd>Động từ tận cùng bằng âm /t/ hoặc /d/\u003c/td>\u003ctd>wanted, needed, visited, decided\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>/t/\u003c/strong>\u003c/td>\u003ctd>Động từ tận cùng bằng âm vô thanh /p/, /k/, /f/, /s/, /ʃ/, /tʃ/, /θ/\u003c/td>\u003ctd>stopped, looked, laughed, kissed, washed, watched\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>/d/\u003c/strong>\u003c/td>\u003ctd>Các trường hợp còn lại (nguyên âm và phụ âm hữu thanh)\u003c/td>\u003ctd>played, cleaned, opened, called, lived, cried\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Mẹo nhớ\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">/ɪd/\u003c/b>\u003cspan class=\"sc-txt\">Tiền đô\u003c/span>\u003cspan class=\"sc-ex\">t, d\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">/t/\u003c/b>\u003cspan class=\"sc-txt\">Khi sang sông phải chờ thu phí\u003c/span>\u003cspan class=\"sc-ex\">k, s, p, sh, ch, th, f\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">/d/\u003c/b>\u003cspan class=\"sc-txt\">Còn lại\u003c/span>\u003cspan class=\"sc-ex\">nguyên âm, b, g, l, m, n, r, v, z…\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Chữ cuối là x (fixed, mixed) đọc là /t/ vì x phát âm là /ks/.\u003c/p>\u003c/div>\u003ch3>Trường hợp đặc biệt\u003c/h3>\u003cp>Một số tính từ tận cùng -ed luôn đọc là /ɪd/: \u003cb>naked\u003c/b>, \u003cb>wicked\u003c/b>, \u003cb>beloved\u003c/b>, \u003cb>sacred\u003c/b>, \u003cb>crooked\u003c/b>, \u003cb>ragged\u003c/b>, \u003cb>learned\u003c/b> (uyên bác), \u003cb>aged\u003c/b> (cao tuổi), \u003cb>blessed\u003c/b>.\u003c/p>\u003ch3>Luyện đọc\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say1\">\u003cthead>\u003ctr>\u003cth>Từ\u003c/th>\u003cth>Cách đọc đuôi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>started\u003c/strong>\u003c/td>\u003ctd>/ɪd/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>ended\u003c/strong>\u003c/td>\u003ctd>/ɪd/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>helped\u003c/strong>\u003c/td>\u003ctd>/t/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>worked\u003c/strong>\u003c/td>\u003ctd>/t/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>danced\u003c/strong>\u003c/td>\u003ctd>/t/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>listened\u003c/strong>\u003c/td>\u003ctd>/d/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>enjoyed\u003c/strong>\u003c/td>\u003ctd>/d/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>rained\u003c/strong>\u003c/td>\u003ctd>/d/\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"p-yve4wt","menu":"m-h8hplr","title":"Cách phát âm đuôi -s/-es","html":"\u003cp class=\"lead\">Đuôi -s/-es xuất hiện ở danh từ số nhiều (books), động từ ngôi thứ ba số ít (he plays) và sở hữu cách (Tom's). Đuôi này có 3 cách đọc, tùy vào \u003cb>âm cuối\u003c/b> của từ gốc, không phải chữ cái cuối.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cách đọc\u003c/th>\u003cth>Khi nào\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>/s/\u003c/strong>\u003c/td>\u003ctd>Từ tận cùng bằng âm vô thanh /p/, /t/, /k/, /f/, /θ/\u003c/td>\u003ctd>stops, cats, books, laughs, months\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>/ɪz/\u003c/strong>\u003c/td>\u003ctd>Từ tận cùng bằng âm gió /s/, /z/, /ʃ/, /tʃ/, /dʒ/, /ʒ/ (thường là chữ s, x, z, sh, ch, ge, ce)\u003c/td>\u003ctd>buses, boxes, washes, watches, oranges, pages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>/z/\u003c/strong>\u003c/td>\u003ctd>Các trường hợp còn lại (nguyên âm và phụ âm hữu thanh)\u003c/td>\u003ctd>dogs, pens, plays, trees, sings, cars\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Mẹo nhớ\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">/s/\u003c/b>\u003cspan class=\"sc-txt\">Thời phong kiến phương Tây\u003c/span>\u003cspan class=\"sc-ex\">p, t, k, f, th\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">/ɪz/\u003c/b>\u003cspan class=\"sc-txt\">Sóng gió chẳng sợ zó giông\u003c/span>\u003cspan class=\"sc-ex\">s, x, z, sh, ch, ge, ce\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">/z/\u003c/b>\u003cspan class=\"sc-txt\">Còn lại\u003c/span>\u003cspan class=\"sc-ex\">nguyên âm, b, d, g, l, m, n, r, v…\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Đặt tay lên cổ khi đọc âm cuối: cổ không rung là âm vô thanh, đọc -s là /s/; cổ rung thì đọc /z/.\u003c/p>\u003c/div>\u003ch3>Trường hợp đặc biệt\u003c/h3>\u003cul>\u003cli>\u003cb>house\u003c/b> /haʊs/ → \u003cb>houses\u003c/b> /ˈhaʊzɪz/\u003c/li>\u003cli>\u003cb>says\u003c/b> đọc là /sez/, \u003cb>does\u003c/b> đọc là /dʌz/.\u003c/li>\u003cli>Chữ cuối là \u003cb>e câm\u003c/b> thì nhìn âm phía trước: \u003cb>make\u003c/b> → makes /s/, \u003cb>love\u003c/b> → loves /z/, \u003cb>rose\u003c/b> → roses /ɪz/.\u003c/li>\u003c/ul>\u003ch3>Luyện đọc\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say1\">\u003cthead>\u003ctr>\u003cth>Từ\u003c/th>\u003cth>Cách đọc đuôi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>hats\u003c/strong>\u003c/td>\u003ctd>/s/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>maps\u003c/strong>\u003c/td>\u003ctd>/s/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>roofs\u003c/strong>\u003c/td>\u003ctd>/s/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>beds\u003c/strong>\u003c/td>\u003ctd>/z/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>apples\u003c/strong>\u003c/td>\u003ctd>/z/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>days\u003c/strong>\u003c/td>\u003ctd>/z/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>kisses\u003c/strong>\u003c/td>\u003ctd>/ɪz/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>brushes\u003c/strong>\u003c/td>\u003ctd>/ɪz/\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>bridges\u003c/strong>\u003c/td>\u003ctd>/ɪz/\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"p-72milk","menu":"m-72milk","title":"100 thành ngữ tiếng Anh hay dùng","html":"\u003cp class=\"lead\">100 thành ngữ tiếng Anh (idioms) người bản xứ hay dùng trong đời sống hằng ngày. Thành ngữ không dịch từng chữ được, nên hãy học cả cụm và nghĩa của nó. Bấm nút loa để nghe cách đọc.\u003c/p>\u003cp>Phiên âm trong bảng theo giọng Anh – Mỹ. Bài chia thành 4 phần, mỗi phần 25 câu; mỗi ngày học 5 câu là vừa.\u003c/p>\u003ch3>Phần 1: Câu 1–25\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Thành ngữ\u003c/th>\u003cth>Phiên âm\u003c/th>\u003cth>Nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>A piece of cake\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ə pis əv keɪk/\u003c/span>\u003c/td>\u003ctd>Dễ như ăn bánh\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Break the ice\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/breɪk ði aɪs/\u003c/span>\u003c/td>\u003ctd>Phá vỡ sự ngại ngùng ban đầu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Hit the road\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/hɪt ðə roʊd/\u003c/span>\u003c/td>\u003ctd>Lên đường\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let the cat out of the bag\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/lɛt ðə kæt aʊt əv ðə bæɡ/\u003c/span>\u003c/td>\u003ctd>Lỡ tiết lộ bí mật\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Under the weather\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈʌndər ðə ˈwɛðər/\u003c/span>\u003c/td>\u003ctd>Không khỏe\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Once in a blue moon\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/wʌns ɪn ə blu mun/\u003c/span>\u003c/td>\u003ctd>Rất hiếm khi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Cost an arm and a leg\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/kɔːst ən ɑːrm ænd ə lɛɡ/\u003c/span>\u003c/td>\u003ctd>Rất đắt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Bite the bullet\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/baɪt ðə ˈbʊlɪt/\u003c/span>\u003c/td>\u003ctd>Cắn răng chịu đựng\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Spill the beans\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/spɪl ðə binz/\u003c/span>\u003c/td>\u003ctd>Tiết lộ bí mật\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cstrong>The ball is in your court\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ðə bɔːl ɪz ɪn jɔːr kɔːrt/\u003c/span>\u003c/td>\u003ctd>Đến lượt bạn quyết định\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>11\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Burn the midnight oil\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/bɜrn ðə ˈmɪdnaɪt ɔɪl/\u003c/span>\u003c/td>\u003ctd>Thức khuya làm việc, học bài\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>12\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Call it a day\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/kɔːl ɪt ə deɪ/\u003c/span>\u003c/td>\u003ctd>Dừng làm việc trong ngày\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>13\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Cut corners\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/kʌt ˈkɔːrnərz/\u003c/span>\u003c/td>\u003ctd>Làm tắt, làm qua loa\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>14\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Get out of hand\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɡɛt aʊt əv hænd/\u003c/span>\u003c/td>\u003ctd>Vượt ngoài tầm kiểm soát\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>15\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Hang in there\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/hæŋ ɪn ðɛr/\u003c/span>\u003c/td>\u003ctd>Cố lên, kiên trì lên\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>16\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Hit the nail on the head\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/hɪt ðə neɪl ɑːn ðə hɛd/\u003c/span>\u003c/td>\u003ctd>Nói, làm chính xác\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>17\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Keep an eye on\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/kip ən aɪ ɑːn/\u003c/span>\u003c/td>\u003ctd>Để mắt đến\u003c/td>\u003c/tr>\u003ctr>\u u003ctd>Trêu ai\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>58\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put yourself in my shoes\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/pʊt jɔːrˈsɛlf ɪn maɪ ʃuz/\u003c/span>\u003c/td>\u003ctd>Đặt mình vào vị trí của tôi\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>59\u003c/b>\u003c/td>\u003ctd>\u003cstrong>See eye to eye\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/si aɪ tə aɪ/\u003c/span>\u003c/td>\u003ctd>Đồng quan điểm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>60\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Sit on the fence\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/sɪt ɑːn ðə fɛns/\u003c/span>\u003c/td>\u003ctd>Không chọn bên nào\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>61\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Start from scratch\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/stɑːrt frʌm skrætʃ/\u003c/span>\u003c/td>\u003ctd>Bắt đầu từ con số không\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>62\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Take a rain check\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/teɪk ə reɪn tʃɛk/\u003c/span>\u003c/td>\u003ctd>Hẹn dịp khác\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>63\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Take it with a grain of salt\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/teɪk ɪt wɪð ə ɡreɪn əv sɔːlt/\u003c/span>\u003c/td>\u003ctd>Đừng tin hoàn toàn\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>64\u003c/b>\u003c/td>\u003ctd>\u003cstrong>The last straw\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ðə læst strɔː/\u003c/span>\u003c/td>\u003ctd>Giọt nước tràn ly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>65\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Through thick and thin\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/θru θɪk ænd θɪn/\u003c/span>\u003c/td>\u003ctd>Qua mọi thăng trầm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>66\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Throw in the towel\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/θroʊ ɪn ðə ˈtaʊəl/\u003c/span>\u003c/td>\u003ctd>Bỏ cuộc\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>67\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Twist someone's arm\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/twɪst ˈsʌmwʌnz ɑːrm/\u003c/span>\u003c/td>\u003ctd>Thuyết phục, ép ai\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>68\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Under your nose\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈʌndər jɔːr noʊz/\u003c/span>\u003c/td>\u003ctd>Ngay trước mắt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>69\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Wrap your head around\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ræp jɔːr hɛd əˈraʊnd/\u003c/span>\u003c/td>\u003ctd>Hiểu được điều gì khó\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>70\u003c/b>\u003c/td>\u003ctd>\u003cstrong>You're on thin ice\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/jʊr ɑːn θɪn aɪs/\u003c/span>\u003c/td>\u003ctd>Bạn đang ở tình thế nguy hiểm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>71\u003c/b>\u003c/td>\u003ctd>\u003cstrong>A blessing in disguise\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ə ˈblɛsɪŋ ɪn dɪsˈɡaɪz/\u003c/span>\u003c/td>\u003ctd>Trong cái rủi có cái may\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>72\u003c/b>\u003c/td>\u003ctd>\u003cstrong>A dime a dozen\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ə daɪm ə ˈdʌzən/\u003c/span>\u003c/td>\u003ctd>Rất phổ biến, không đặc biệt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>73\u003c/b>\u003c/td>\u003ctd>\u003cstrong>A drop in the bucket\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ə drɑːp ɪn ðə ˈbʌkɪt/\u003c/span>\u003c/td>\u003ctd>Chẳng đáng là bao\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>74\u003c/b>\u003c/td>\u003ctd>\u003cstrong>A hard nut to crack\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ə hɑːrd nʌt tə kræk/\u003c/span>\u003c/td>\u003ctd>Vấn đề, người khó xử lý\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>75\u003c/b>\u003c/td>\u003ctd>\u003cstrong>A storm in a teacup\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ə stɔːrm ɪn ə ˈtiˌkʌp/\u003c/span>\u003c/td>\u003ctd>Chuyện bé xé ra to\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phần 4: Câu 76–100\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Thành ngữ\u003c/th>\u003cth>Phiên âm\u003c/th>\u003cth>Nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>76\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Actions speak louder than words\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈækʃənz spik ˈlaʊdər ðæn wɜrdz/\u003c/span>\u003c/td>\u003ctd>Hành động quan trọng hơn lời nói\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>77\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Add fuel to the fire\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/æd ˈfjuəl tə ðə ˈfaɪər/\u003c/span>\u003c/td>\u003ctd>Đổ thêm dầu vào lửa\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>78\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Against the clock\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/əˈɡɛnst ðə klɑːk/\u003c/span>\u003c/td>\u003ctd>Chạy đua với thời gian\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>79\u003c/b>\u003c/td>\u003ctd>\u003cstrong>All ears\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɔːl ɪrz/\u003c/span>\u003c/td>\u003ctd>Rất chăm chú lắng nghe\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>80\u003c/b>\u003c/td>\u003ctd>\u003cstrong>All in the same boat\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɔːl ɪn ðə seɪm boʊt/\u003c/span>\u003c/td>\u003ctd>Tất cả cùng cảnh ngộ\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>81\u003c/b>\u003c/td>\u003ctd>\u003cstrong>All over the place\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɔːl ˈoʊvər ðə pleɪs/\u003c/span>\u003c/td>\u003ctd>Lộn xộn, khắp nơi\u003c/td>\u /b>\u003c/td>\u003ctd>\u003cstrong>Walk slowly.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/wɔːk ˈsloʊli/\u003c/span>\u003c/td>\u003ctd>Đi chậm thôi.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Nghe lời và giữ an toàn (câu 11–20)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Phiên âm\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>11\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Sit down.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/sɪt daʊn/\u003c/span>\u003c/td>\u003ctd>Ngồi xuống đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>12\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Stand up.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/stænd ʌp/\u003c/span>\u003c/td>\u003ctd>Đứng lên nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>13\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Come here.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/kʌm hɪr/\u003c/span>\u003c/td>\u003ctd>Lại đây nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>14\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Look at mommy.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/lʊk æt ˈmɑːmi/\u003c/span>\u003c/td>\u003ctd>Nhìn mẹ nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>15\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Listen to mommy.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈlɪsən tə ˈmɑːmi/\u003c/span>\u003c/td>\u003ctd>Nghe mẹ nói nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>16\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Hold my hand.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/hoʊld maɪ hænd/\u003c/span>\u003c/td>\u003ctd>Nắm tay mẹ nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>17\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Stay close to me.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/steɪ kloʊs tə mi/\u003c/span>\u003c/td>\u003ctd>Ở gần mẹ nhé d>\u003cspan class=\"ipa\">/ju kæn du ɪt/\u003c/span>\u003c/td>\u003ctd>Con làm được mà.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>26\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Good job!\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɡʊd dʒɑːb/\u003c/span>\u003c/td>\u003ctd>Giỏi lắm!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>27\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Well done!\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/wel dʌn/\u003c/span>\u003c/td>\u003ctd>Làm tốt lắm!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>28\u003c/b>\u003c/td>\u003ctd>\u003cstrong>I&#x27;m proud of you.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/aɪm praʊd əv ju/\u003c/span>\u003c/td>\u003ctd>Mẹ tự hào về con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>29\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Don&#x27;t cry.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/doʊnt kraɪ/\u003c/span>\u003c/td>\u003ctd>Đừng khóc nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>30\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Calm down.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/kɑːm daʊn/\u003c/span>\u003c/td>\u003ctd>Bình tĩnh nào.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Hỏi han và rủ con (câu 31–40)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Phiên âm\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>31\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Take a deep breath.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/teɪk ə diːp breθ/\u003c/span>\u003c/td>\u003ctd>Hít thở sâu nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>32\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Mommy is here.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈmɑːmi ɪz hɪr/\u003c/span>\u003c/td>\u003ctd>Mẹ ở đây rồi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>33\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Are you okay?\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɑːr ju oʊˈkeɪ/\u003c/span>\u003c/td>\u003ctd>Con ổn không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>34\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Are you hungry?\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɑːr ju ˈhʌŋɡri/\u003c/span>\u003c/td>\u003ctd>Con đói chưa?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>35\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Are you sleepy?\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɑːr ju ˈsliːpi/\u003c/span>\u003c/td>\u003ctd>Con buồn ngủ chưa?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>36\u003c/b>\u003c/td>\u003ctd>\u003cstrong>What happened?\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/wʌt ˈhæpənd/\u003c/span>\u003c/td>\u003ctd>Có chuyện gì vậy?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>37\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Do you need help?\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/du ju niːd help/\u003c/span>\u003c/td>\u003ctd>Con cần giúp không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>38\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s go.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/lets ɡoʊ/\u003c/span>\u003c/td>\u003ctd>Đi thôi nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>39\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s eat.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/lets iːt/\u003c/span>\u003c/td>\u003ctd>Ăn thôi nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>40\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s read.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/lets riːd/\u003c/span>\u003c/td>\u003ctd>Đọc sách nhé.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Ăn uống và dọn dẹp (câu 41–50)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Phiên âm\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>41\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s clean up.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/lets kliːn ʌp/\u003c/span>\u003c/td>\u003ctd>Cùng dọn dẹp nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>42\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put your toys away.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/pʊt jər tɔɪz əˈweɪ/\u003c/span>\u003c/td>\u003ctd>Cất đồ chơi đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>43\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Clean your room.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/kliːn jər ruːm/\u003c/span>\u003c/td>\u003ctd>Dọn phòng đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>44\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Wipe your mouth.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/waɪp jər maʊθ/\u003c/span>\u003c/td>\u003ctd>Lau miệng đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>45\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Chew slowly.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/tʃuː ˈsloʊli/\u003c/span>\u003c/td>\u003ctd>Nhai chậm thôi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>46\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Finish your food.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈfɪnɪʃ jər fuːd/\u003c/span>\u003c/td>\u003ctd>Ăn hết đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>47\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Eat your vegetables.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/iːt jər ˈvedʒtəblz/\u003c/span>\u003c/td>\u003ctd>Ăn rau đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>48\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Don&#x27;t spill it.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/doʊnt spɪl ɪt/\u003c/span>\u003c/td>\u003ctd>Đừng làm đổ nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>49\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Turn off the light.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/tɜːrn ɔːf ðə laɪt/\u003c/span>\u003c/td>\u003ctd>Tắt đèn đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>50\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Flush the toilet.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/flʌʃ ðə ˈtɔɪlət/\u003c/span>\u003c/td>\u003ctd>Nhớ xả nước nhé.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Mặc đồ và đi đứng (câu 51–60)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Phiên âm\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>51\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put on your shoes.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/pʊt ɑːn jər ʃuːz/\u003c/span>\u003c/td>\u003ctd>Mang giày vào nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>52\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Put on your jacket.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/pʊt ɑːn jər ˈdʒækɪt/\u003c/span>\u003c/td>\u003ctd>Mặc áo khoác vào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>53\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Zip up your jacket.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/zɪp ʌp jər ˈdʒækɪt/\u003c/span>\u003c/td>\u003ctd>Kéo khóa áo lên nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>54\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Button your shirt.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈbʌtn jər ʃɜːrt/\u003c/span>\u003c/td>\u003ctd>Cài cúc áo vào nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>55\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Comb your hair.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/koʊm jər her/\u003c/span>\u003c/td>\u003ctd>Chải tóc đi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>56\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Don&#x27;t sit so close.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/doʊnt sɪt soʊ kloʊs/\u003c/span>\u003c/td>\u003ctd>Đừng ngồi sát quá.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>57\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Quiet feet, please.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ˈkwaɪət fiːt pliːz/\u003c/span>\u003c/td>\u003ctd>Đi nhẹ chân thôi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>58\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Don&#x27;t jump on the bed.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/doʊnt dʒʌmp ɑːn ðə bed/\u003c/span>\u003c/td>\u003ctd>Đừng nhảy trên giường.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>59\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Watch your step.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/wɑːtʃ jər step/\u003c/span>\u003c/td>\u003ctd>Coi chừng bước chân.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>60\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Leave it there.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/liːv ɪt ðer/\u003c/span>\u003c/td>\u003ctd>Để yên ở đó nhé.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Đi ngủ và yêu thương (câu 61–70)\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Phiên âm\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>61\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Don&#x27;t play with water.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/doʊnt pleɪ wɪð ˈwɔːtər/\u003c/span>\u003c/td>\u003ctd>Đừng nghịch nước nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>62\u003c/b>\u003c/td>\u003ctd>\u003cstrong>It&#x27;s bedtime.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/ɪts ˈbedtaɪm/\u003c/span>\u003c/td>\u003ctd>Đến giờ ngủ rồi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>63\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Time to sleep.\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"ipa\">/taɪm tə sliːp/\u003c/span>\u003c/td>\u003ctd>Đi ngủ thôi nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>64\u003c/b>\u003c/td>\u003ctd >Ra ngoài\u003c/b>\u003cspan class=\"sc-txt\">Hold my hand · Watch your step · Be careful\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Bữa ăn\u003c/b>\u003cspan class=\"sc-txt\">Let's eat · Eat your vegetables · Wipe your mouth\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Khen con\u003c/b>\u003cspan class=\"sc-txt\">Good job! · Well done! · I'm proud of you\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Tối\u003c/b>\u003cspan class=\"sc-txt\">It's bedtime · Close your eyes · Sweet dreams\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Mỗi tuần chọn 10 câu, dán lên tủ lạnh và dùng mỗi ngày. Sau 7 tuần là thuộc đủ 70 câu.\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"p-sgh7t5","menu":"m-sgh7t5","title":"14 chủ đề giao tiếp tại nhà với con","html":"\u003cp class=\"lead\">14 tình huống quen thuộc trong một ngày ở nhà, mỗi tình huống 10 câu tiếng Anh ngắn bố mẹ nói với con, đi từ lúc gọi con dậy đến lúc chúc con ngủ ngon.\u003c/p>\u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Lộ trình\u003c/span>\u003cp class=\"sc-title\">14 chủ đề trong một ngày\u003c/p>\u003cp class=\"sc-sub\">Mỗi chủ đề 10 câu, tổng cộng 140 câu.\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">1. Gọi con dậy\u003c/span>\u003cspan class=\"sc-chip\">2. Đánh răng, rửa mặt\u003c/span>\u003cspan class=\"sc-chip\">3. Thay quần áo\u003c/span>\u003cspan class=\"sc-chip\">4. Đến lúc phải đi rồi\u003c/span>\u003cspan class=\"sc-chip\">5. Ăn cơm\u003c/span>\u003cspan class=\"sc-chip\">6. Uống nước, ăn nhẹ\u003c/span>\u003cspan class=\"sc-chip\">7. Đi vệ sinh\u003c/span>\u003cspan class=\"sc-chip\">8. Chơi cùng con\u003c/span>\u003cspan class=\"sc-chip\">9. Cất đồ chơi\u003c/span>\u003cspan class=\"sc-chip\">10. Khi con khóc, buồn\u003c/span>\u003cspan class=\"sc-chip\">11. Khen con, động viên con\u003c/span>\u003cspan class=\"sc-chip\">12. Tắm rửa\u003c/span>\u003cspan class=\"sc-chip\">13. Chuẩn bị đi ngủ\u003c/span>\u003cspan class=\"sc-chip\">14. Nói lời yêu thương\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Mỗi ngày chọn 1 chủ đề và chỉ nói tiếng Anh trong tình huống đó. Sau 2 tuần là đi hết 14 chủ đề.\u003c/p>\u003c/div>\u003ch3>Chủ đề 1: Gọi con dậy\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say2\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Tiếng Anh\u003c/th>\u003cth>Tiếng Việt\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Baby, wake up.\u003c/strong>\u003c/td>\u003ctd>Con yêu, dậy nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Open your eyes.\u003c/strong>\u003c/td>\u003ctd>Mở mắt ra nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cstrong>It&#x27;s morning.\u003c/strong>\u003c/td>\u003ctd>Sáng rồi con.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Time to get up.\u003c/strong>\u003c/td>\u003ctd>Đến giờ dậy rồi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Did you sleep well?\u003c/strong>\u003c/td>\u003ctd>Con ngủ ngon không?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Sit up, please.\u003c/strong>\u003c/td>\u003ctd>Con ngồi dậy nhé.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Stretch your arms.\u003c/strong>\u003c/td>\u003ctd>Duỗi tay ra nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Give me a smile.\u003c/strong>\u003c/td>\u003ctd>Cười với mẹ một cái nào.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cstrong>Let&#x27;s start the day.\u003c/strong>\u003c/td>\u003ctd>Mình bắt đầu ngày mới nhé.\u003c/td>\u003c/tr>\u0 ass=\"lead\">14 bản đồ từ vựng theo chủ đề quen thuộc với các con: gia đình, hoạt động hằng ngày, nghề nghiệp, đồ chơi, ngôi nhà, quần áo… Mỗi bản đồ có một mẫu câu hỏi – đáp ở giữa và các từ vựng xung quanh để thay vào.\u003c/p>\u003cp>Cách học: đọc mẫu câu ở giữa, rồi lần lượt thay từng từ xung quanh vào chỗ dấu “…”. Bấm nút loa ở câu ví dụ để nghe.\u003c/p>\u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Lộ trình\u003c/span>\u003cp class=\"sc-title\">14 chủ đề\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">1. Gia đình\u003c/span>\u003cspan class=\"sc-chip\">2. Hoạt động hằng ngày\u003c/span>\u003cspan class=\"sc-chip\">3. Đang làm gì?\u003c/span>\u003cspan class=\"sc-chip\">4. Nghề nghiệp\u003c/span>\u003cspan class=\"sc-chip\">5. Hỏi đường, phương tiện\u003c/span>\u003cspan class=\"sc-chip\">6. Lời dặn an toàn\u003c/span>\u003cspan class=\"sc-chip\">7. Môn học\u003c/span>\u003cspan class=\"sc-chip\">8. Đồ chơi\u003c/span>\u003cspan class=\"sc-chip\">9. Miêu tả người, vật\u003c/span>\u003cspan class=\"sc-chip\">10. Đồ vật trong phòng\u003c/span>\u003cspan class=\"sc-chip\">11. Đồ dùng học tập\u003c/span>\u003cspan class=\"sc-chip\">12. Ước mơ nghề nghiệp\u003c/span>\u003cspan class=\"sc-chip\">13. Ngôi nhà của em\u003c/span>\u003cspan class=\"sc-chip\">14. Quần áo và giá tiền\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Vẽ lại bản đồ ra giấy, thêm hình vẽ của chính con vào mỗi nhánh để nhớ lâu hơn.\u003c/p>\u003c/div>\u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">1. Gia đình\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">Who&#x27;s that? – He&#x27;s / She&#x27;s my…\u003c/span>\u003cspan class=\"vm-a\">How old is your…? – He&#x27;s / She&#x27;s … years old.\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>grandfather\u003c/b>\u003csmall>ông\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>grandmother\u003c/b>\u003csmall>bà\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>father\u003c/b>\u003csmall>bố\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k4\">\u003cb>mother\u003c/b>\u003csmall>mẹ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k5\">\u003cb>brother\u003c/b>\u003csmall>anh, em trai\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k6\">\u003cb>sister\u003c/b>\u003csmall>chị, em gái\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k7\">\u003cb>baby\u003c/b>\u003csmall>em bé\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k8\">\u003cb>cousin\u003c/b>\u003csmall>anh chị em họ\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k1\">\u003cb>uncle\u003c/b>\u003csmall>chú, bác, cậu\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>aunt\u003c/b>\u003csmall>cô, dì, bác gái\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Ví dụ\u003c/p>\u003cul class=\"vm-ex\">\u003cli>Who&#x27;s that? – He&#x27;s my grandfather.\u003c/li>\u003cli>How old is your grandfather? – He&#x27;s sixty-eight years old.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Bản đồ từ\u003c/span>\u003cp class=\"sc-title\">2. Hoạt động hằng ngày\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"vm\">\u003cdiv class=\"vm-core\">\u003cspan class=\"vm-q\">What time do you…?\u003c/span>\u003cspan class=\"vm-a\">I … at …\u003c/span>\u003c/div>\u003cdiv class=\"vm-leaves\">\u003cspan class=\"vm-leaf k1\">\u003cb>get up\u003c/b>\u003csmall>thức dậy\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k2\">\u003cb>brush my teeth\u003c/b>\u003csmall>đánh răng\u003c/small>\u003c/span>\u003cspan class=\"vm-leaf k3\">\u003cb>take a shower\u003c/b>\u003csmall>tắm vòi sen\u003c/small>\u003c/span>\u003cspan
