/* ===== hands-free player ===== */
const player = { on: false, playing: false, i: 0, units: [], resumeNext: false, postId: null, lock: null };
const plBar = document.createElement("div");
plBar.className = "player"; plBar.hidden = true; plBar.setAttribute("role", "region"); plBar.setAttribute("aria-label", "Nghe cả bài");
document.body.appendChild(plBar);
function collectUnits(){
  const pr = $("#prose"); if(!pr) return [];
  const cand = [...pr.querySelectorAll("h3,h4,p,li,tr")].filter(el => !el.closest(".sc") && !el.closest("thead") && !el.classList.contains("note"));
  const list = cand.filter(el => el.tagName === "TR" || (!el.closest("tr") && !el.querySelector("p")));
  const h = $("article h1.title"); return h ? [h, ...list] : list;
}
function unitParts(el){
  const parts = segments(speechText(el, {noLists: true}));
  return prefs.vi && hasVi() ? parts : parts.filter(p => p.lang === "en");
}
async function wake(on){ try{ if(on && !player.lock && navigator.wakeLock) player.lock = await navigator.wakeLock.request("screen"); else if(!on && player.lock){ await player.lock.release(); player.lock = null; } }catch(e){} }
function playerStart(from){
  if(!hasTTS) return toast("Thiết bị này chưa hỗ trợ đọc to.");
  player.units = collectUnits(); if(!player.units.length) return;
  player.on = true; player.postId = route(); player.i = Math.max(0, Math.min(from || 0, player.units.length - 1));
  document.body.classList.add("pl-on"); wake(true); playUnit();
}
function markUnit(){
  document.querySelectorAll(".reading").forEach(x => x.classList.remove("reading"));
  const el = player.units[player.i];
  if(el && player.on){ el.classList.add("reading"); try{ el.scrollIntoView({block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }catch(e){} }
}
function playUnit(){
  player.playing = true; markUnit(); plUI();
  const el = player.units[player.i]; if(!el) return playerDone();
  const parts = unitParts(el);
  if(!parts.length){ player.i++; return player.i < player.units.length ? playUnit() : playerDone(); }
  speakParts(parts, prefs.rate, () => { player.i++; if(player.i < player.units.length) playUnit(); else playerDone(); });
}
function playerPause(){ stopSpeech(); player.playing = false; plUI(); }
function playerStop(){ stopSpeech(); player.on = false; player.playing = false; player.resumeNext = false; document.body.classList.remove("pl-on"); document.querySelectorAll(".reading").forEach(x => x.classList.remove("reading")); plBar.hidden = true; wake(false); }
function nextLesson(){ const all = flatPosts(), cur = postById(player.postId) || postsOf(player.postId)[0]; const i = all.indexOf(cur); return all.slice(i + 1).find(p => !isPending(p) && p.menu !== "trang-chu"); }
function playerDone(){
  player.playing = false; document.querySelectorAll(".reading").forEach(x => x.classList.remove("reading"));
  const nx = prefs.auto ? nextLesson() : null;
  if(nx){ plUI("Xong bài. Sang bài tiếp: " + nx.title + "…"); setTimeout(() => { if(!player.on) return; player.resumeNext = true; location.hash = postLink(nx); }, 1800); }
  else { plUI(prefs.auto ? "Đã nghe hết các bài." : "Đã đọc xong bài này."); wake(false); }
}
function afterReadPlayer(){
  if(player.resumeNext){ player.resumeNext = false; if(player.on) setTimeout(() => playerStart(0), 500); return; }
  if(player.on && player.postId !== route()) playerStop();
}
function shortVoice(v){
  const n = (v.name || "").replace(/^Microsoft\s+/i, "").replace(/\s*-\s*(Vietnamese|English).*$/i, "").replace(/\s*\(.*?\)\s*/g, " ").trim();
  return (n || v.lang) + (isNatural(v) ? " ★" : "");
}
function plUI(msg){
  if(!player.on){ plBar.hidden = true; return; }
  plBar.hidden = false;
  const n = player.units.length, i = Math.min(player.i, n - 1), pct = n ? Math.round((player.playing ? i : Math.min(player.i, n)) * 100 / n) : 0;
  const noVi = prefs.vi && !hasVi();
  plBar.innerHTML = `<div class="pl-in">
    <div class="pl-ctrl"><button class="pl-b" data-pl="prev" aria-label="Đoạn trước">${I.prev}</button>
      <button class="pl-b pl-main" data-pl="toggle" aria-label="${player.playing ? "Tạm dừng" : "Đọc tiếp"}">${player.playing ? I.pause : I.play}</button>
      <button class="pl-b" data-pl="next" aria-label="Đoạn sau">${I.next}</button></div>
    <div class="pl-info"><b>${esc(msg || (player.playing ? "Đang đọc" : "Đã tạm dừng"))}</b><small>Đoạn ${Math.min(player.i + 1, n)} / ${n}${noVi ? " · máy chưa có giọng tiếng Việt, chỉ đọc phần tiếng Anh" : ""}</small><span class="pl-prog"><i style="width:${pct}%"></i></span></div>
    <div class="pl-opts">
      <label class="pl-sel"><span class="sr">Tốc độ</span><select data-pl="rate">${[[0.7, "Chậm"], [0.9, "Vừa"], [1.05, "Nhanh"]].map(([v, l]) => `<option value="${v}" ${prefs.rate == v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="pl-chk"><input type="checkbox" data-pl="vi" ${prefs.vi ? "checked" : ""} ${hasVi() ? "" : "disabled"}>Đọc tiếng Việt</label>
      <label class="pl-chk"><input type="checkbox" data-pl="auto" ${prefs.auto ? "checked" : ""}>Tự sang bài sau</label>
      ${voicesOf("vi").length > 1 ? `<label class="pl-sel"><span>Giọng Việt</span><select data-pl="vivoice">${voicesOf("vi").map(v => `<option value="${esc(v.name)}" ${voiceFor("vi") === v ? "selected" : ""}>${esc(shortVoice(v))}</option>`).join("")}</select></label>` : ""}
      ${voicesOf("en").length > 1 ? `<label class="pl-sel"><span>Giọng Anh</span><select data-pl="envoice">${voicesOf("en").slice(0, 12).map(v => `<option value="${esc(v.name)}" ${voiceFor("en") === v ? "selected" : ""}>${esc(shortVoice(v))}</option>`).join("")}</select></label>` : ""}</div>
    ${hasVi() && !isNatural(voiceFor("vi")) ? `<p class="pl-tip">Giọng Việt trên máy này còn hơi máy móc. Mở trang bằng <b>Microsoft Edge</b> (giọng HoaiMy, NamMinh) hoặc trên <b>iPhone, iPad</b> (giọng Linh) để nghe tự nhiên hơn.</p>` : ""}
    <button class="pl-b pl-x" data-pl="close" aria-label="Tắt chế độ nghe">${I.x}</button></div>`;
}
plBar.addEventListener("click", e => {
  const b = e.target.closest("button[data-pl]"); if(!b) return;
  const k = b.dataset.pl;
  if(k === "toggle"){ if(player.playing) playerPause(); else if(player.i >= player.units.length) playerStart(0); else playUnit(); }
  else if(k === "prev"){ stopSpeech(); player.i = Math.max(0, player.i - 1); playUnit(); }
  else if(k === "next"){ stopSpeech(); player.i = Math.min(player.units.length - 1, player.i + 1); playUnit(); }
  else if(k === "close") playerStop();
});
plBar.addEventListener("change", e => {
  const k = e.target.dataset.pl;
  if(k === "rate"){ prefs.rate = +e.target.value; store.set("tanm-rate", prefs.rate); if(player.playing){ stopSpeech(); playUnit(); } }
  if(k === "vi"){ prefs.vi = e.target.checked; store.set("tanm-vi", prefs.vi); }
  if(k === "auto"){ prefs.auto = e.target.checked; store.set("tanm-auto", prefs.auto); }
  if(k === "vivoice" || k === "envoice"){
    const lang = k === "vivoice" ? "vi" : "en";
    prefs[lang + "Voice"] = e.target.value; store.set("tanm-" + k, e.target.value);
    stopSpeech(); player.playing = false;
    speakParts([{lang, t: lang === "vi" ? "Xin chào, đây là giọng đọc tiếng Việt." : "Hello, this is the English voice."}], prefs.rate, () => {});
    plUI();
  }
});
document.addEventListener("click", e => {
  if(!player.on) return;
  const el = e.target.closest("#prose h3,#prose h4,#prose p,#prose li,#prose tr");
  if(!el || e.target.closest("a,button,input,select")) return;
  const k = player.units.indexOf(el); if(k >= 0){ stopSpeech(); player.i = k; playUnit(); }
});

/* ===== Anh – Việt translator ===== */
const canTranslate = () => !!cap.sample || STANDALONE;
const trUI = { open: false, busy: false, out: "", err: "", toVi: true };
const trPanel = document.createElement("aside");
trPanel.className = "trp"; trPanel.hidden = true; trPanel.setAttribute("aria-label", "Dịch Anh – Việt");
trPanel.innerHTML = `<div class="trp-head"><b>${I.translate}Dịch Anh – Việt</b><button class="pl-b" data-tr="close" aria-label="Đóng">${I.x}</button></div>
  <label class="sr" for="tr-in">Câu cần dịch</label><textarea id="tr-in" class="inp" rows="4" placeholder="Gõ hoặc dán câu tiếng Anh (hoặc tiếng Việt) vào đây…"></textarea>
  <div class="trp-row"><span class="trp-dir" id="tr-dir">Anh → Việt</span><span class="trp-sp"></span><button class="btn btn-sm btn-g" data-tr="say">${I.speak}Nghe</button><button class="btn btn-sm btn-p" data-tr="go">Dịch</button></div>
  <div class="trp-out" id="tr-out" aria-live="polite"></div>
  <p class="trp-src" id="tr-src"></p>`;
document.body.appendChild(trPanel);
const trIn = trPanel.querySelector("#tr-in");
function trSetDir(){ trUI.toVi = !VI_CH.test(trIn.value); trPanel.querySelector("#tr-dir").textContent = trUI.toVi ? "Anh → Việt" : "Việt → Anh"; }
trIn.addEventListener("input", trSetDir);
trIn.addEventListener("keydown", e => { if(e.key === "Enter" && (e.ctrlKey || e.metaKey)) runTranslate(); });
function trRender(){
  const o = trPanel.querySelector("#tr-out");
  o.innerHTML = trUI.busy ? `<span class="trp-wait">Đang dịch…</span>` : trUI.err ? `<span class="trp-err">${esc(trUI.err)}</span>`
    : trUI.out ? `<p>${esc(trUI.out)}</p><div class="trp-row">${trUI.toVi ? "" : `<button class="btn btn-sm btn-g" data-tr="say-out">${I.speak}Nghe</button>`}<button class="btn btn-sm btn-g" data-tr="copy">${I.copy}Chép</button></div>` : `<span class="trp-wait">Bản dịch sẽ hiện ở đây.</span>`;
  trPanel.querySelector("#tr-src").textContent = cap.sample ? "Bản dịch do Claude thực hiện." : "Dịch tự động qua dịch vụ MyMemory (miễn phí, giới hạn số lượt mỗi ngày). Bản dịch máy có thể chưa chuẩn.";
}
function trOpen(text){
  trUI.open = true; trPanel.hidden = false; document.body.classList.add("tr-on");
  if(text != null){ trIn.value = text; trSetDir(); }
  trRender(); if(text) runTranslate(); else trIn.focus();
}
function trClose(){ trUI.open = false; trPanel.hidden = true; document.body.classList.remove("tr-on"); }
async function translateText(text, toVi){
  if(cap.sample){
    const r = await cap.sample(`Bạn là bộ dịch giúp trẻ em Việt Nam học tiếng Anh. Dịch đoạn sau sang ${toVi ? "tiếng Việt" : "tiếng Anh"} cho tự nhiên, dễ hiểu. Chỉ trả lời bản dịch, không giải thích, không thêm dấu ngoặc.\n\n${text}`, {modelTier: "quick"});
    return (r && r.text || "").trim();
  }
  const parts = []; let buf = "";
  for(const s of (text.match(/[^.!?\n]+[.!?\n]*/g) || [text])){ if((buf + s).length > 450 && buf){ parts.push(buf); buf = ""; } buf += s; }
  if(buf) parts.push(buf);
  const out = [];
  for(const p of parts){
    const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(p.trim()) + "&langpair=" + (toVi ? "en|vi" : "vi|en"));
    const j = await res.json();
    if(!res.ok || (j.responseStatus && +j.responseStatus !== 200)) throw {code: +j.responseStatus === 429 ? "rate_limited" : "upstream", message: j.responseDetails};
    out.push(j.responseData.translatedText);
  }
  return out.join(" ").replace(/\s+/g, " ").trim();
}
async function runTranslate(){
  const text = trIn.value.trim(); if(!text) return trIn.focus();
  if(text.length > 2000){ trUI.err = "Đoạn quá dài. Hãy dịch từng đoạn ngắn (dưới 2000 ký tự)."; return trRender(); }
  trSetDir(); trUI.busy = true; trUI.err = ""; trUI.out = ""; trRender();
  try{ trUI.out = await translateText(text, trUI.toVi); if(!trUI.out) trUI.err = "Chưa dịch được câu này. Thử lại hoặc viết ngắn hơn."; }
  catch(e){ const c = e && e.code;
    trUI.err = c === "not_granted" ? "Chưa được cho phép dùng bộ dịch. Bấm Dịch lần nữa và chọn Cho phép."
      : c === "rate_limited" ? "Đã dùng hết lượt dịch hôm nay hoặc dịch quá nhanh. Thử lại sau ít phút."
      : navigator.onLine === false ? "Máy đang mất mạng nên chưa dịch được." : "Chưa dịch được lúc này. Thử lại sau ít phút."; }
  trUI.busy = false; trRender();
}
trPanel.addEventListener("click", async e => {
  const b = e.target.closest("[data-tr]"); if(!b) return;
  const k = b.dataset.tr;
  if(k === "close") trClose();
  else if(k === "go") runTranslate();
  else if(k === "say"){ const t = trIn.value.trim(); if(t) speakParts(segments(t), prefs.rate); }
  else if(k === "say-out") speakParts([{lang: "en", t: trUI.out}], prefs.rate);
  else if(k === "copy"){ try{ await navigator.clipboard.writeText(trUI.out); toast("Đã chép bản dịch."); }catch(err){ const r = document.createRange(); r.selectNodeContents(trPanel.querySelector("#tr-out p")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Đã chọn sẵn bản dịch, bấm Ctrl+C để chép."); } }
});

/* ===== selection bubble: Nghe / Chậm / Dịch ===== */
let bubble = null;
function hideBubble(){ if(bubble){ bubble.remove(); bubble = null; } }
document.addEventListener("mouseup", showBubbleSoon); document.addEventListener("touchend", showBubbleSoon);
document.addEventListener("selectionchange", () => { const s = getSelection(); if(!s || s.isCollapsed) setTimeout(() => { const s2 = getSelection(); if(!s2 || s2.isCollapsed) hideBubble(); }, 200); });
function showBubbleSoon(e){ if(e && e.target && e.target.closest && e.target.closest(".speak,.trp,.player")) return; setTimeout(showBubble, 10); }
function showBubble(){
  if(ui.mode !== "read") return;
  const s = getSelection(); if(!s || s.isCollapsed || !s.rangeCount) return hideBubble();
  const text = s.toString().trim(); const pr = $("#main");
  if(!text || text.length > 1500 || !pr || !pr.contains(s.anchorNode)) return hideBubble();
  const r = s.getRangeAt(0).getBoundingClientRect();
  hideBubble(); bubble = document.createElement("div"); bubble.className = "speak";
  bubble.innerHTML = (hasTTS ? `<button type="button" data-rate="1">${I.speak}Nghe</button><button type="button" data-rate="0.7">${I.slow}Chậm</button>` : "") + (canTranslate() ? `<button type="button" data-trs="1">${I.translate}Dịch</button>` : "");
  if(!bubble.innerHTML){ bubble = null; return; }
  document.body.appendChild(bubble);
  const bw = bubble.offsetWidth, x = Math.min(Math.max(8, r.left + r.width / 2 - bw / 2 + scrollX), document.documentElement.clientWidth - bw - 8 + scrollX);
  bubble.style.left = x + "px"; bubble.style.top = (r.bottom + scrollY + 8) + "px";
  bubble.addEventListener("mousedown", e => e.preventDefault());
  bubble.addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.trs){ hideBubble(); trOpen(text); return; }
    stopSpeech(); speakParts(segments(text), +b.dataset.rate * prefs.rate / 0.9); });
}

/* ===== global clicks (reading + shared) ===== */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-tog],[data-learn]"); if(!t) return;
  if(t.dataset.tog){ const id = t.dataset.tog; const cur = t.getAttribute("aria-expanded") === "true"; ui.open[id] = !cur; store.set("tanm-open", ui.open); render(); return; }
  if(t.dataset.learn){ const id = t.dataset.learn; if(learned[id]) delete learned[id]; else learned[id] = Date.now(); store.set(LEARN_KEY, learned); render(); if(learned[id]) toast("Giỏi lắm! Đã đánh dấu bài này."); return; }
  const a = t.dataset.act;
  if(a === "side"){ ui.side = !ui.side; render(); }
  else if(a === "home"){ e.preventDefault(); ui.q = ""; if(ui.mode === "admin") await leaveAdmin(); go("trang-chu"); }
  else if(a === "fs+" || a === "fs-"){ fs = Math.max(14, Math.min(22, fs + (a === "fs+" ? 1 : -1))); store.set(FS_KEY, fs); document.documentElement.style.setProperty("--fs", fs + "px"); }
  else if(a === "clearq"){ ui.q = ""; render(); }
  else if(a === "listen"){ if(player.on && player.postId === route()){ if(!player.playing) playUnit(); } else playerStart(0); }
  else if(a === "hint-x"){ store.set("tanm-hint", 1); const h = t.closest(".hint"); if(h) h.remove(); }
  else if(a === "tr-open"){ if(trUI.open) trClose(); else trOpen(getSelection().toString().trim() || null); }
  else if(a === "clearq-go"){ ui.q = ""; }
  else if(a === "admin"){ playerStop(); trClose(); ui.mode = "admin"; store.sset("tanm-admin", "1"); render(); window.scrollTo(0, 0); }
  else if(a === "read"){ await leaveAdmin(); render(); window.scrollTo(0, 0); }
  else if(a === "pw-eye"){ const p = $("#pw"); if(p){ const show = p.type === "password"; p.type = show ? "text" : "password"; t.textContent = show ? "Ẩn" : "Hiện"; p.focus(); } }
  else if(ui.mode === "admin") adminAction(a, t, e);
});
async function leaveAdmin(){ if(ui.dirtyEditor && !(await dialog({title:"Bỏ thay đổi đang sửa?", text:"Bài viết đang mở có chỉnh sửa chưa lưu vào bản nháp.", ok:"Bỏ thay đổi", danger:true}))) return false;
  ui.dirtyEditor = false; ui.mode = "read"; store.sset("tanm-admin", null); return true; }

let lockTimer;
function afterLogin(){
  const f = $("#login"); if(!f) return;
  const pw = $("#pw"); if(pw && !pw.disabled) pw.focus();
  const fi = failInfo(); clearTimeout(lockTimer);
  if(fi.until && fi.until > Date.now()) lockTimer = setTimeout(() => { ui.loginErr = ""; render(); }, fi.until - Date.now() + 50);
  f.addEventListener("submit", async e => {
    e.preventDefault(); const v = pw.value; if(!v) return;
    const btn = f.querySelector('[type="submit"]'); btn.disabled = true; btn.textContent = "Đang kiểm tra…";
    const ok = await checkPw(v);

}
function restoreDraft(){
  if(!authed()) return;
  const rec = store.get(DRAFT_KEY, null);
  if(!rec) return;
  if(rec.publishing && rec.publishing === PUBLISHED.site.savedAt){ store.del(DRAFT_KEY); setTimeout(() => toast("Đã xuất bản. Các cháu sẽ thấy nội dung mới."), 300); return; }
  if(rec.base === (PUBLISHED.site.savedAt || "") && rec.draft) draft = rec.draft;
  else if(rec.draft){ draft = rec.draft; ui.staleDraft = true; }
}
function touch(){ if(!draft) draft = clone(PUBLISHED); return draft; }
function saveDraft(extra){ if(draft) store.set(DRAFT_KEY, Object.assign({base: PUBLISHED.site.savedAt || "", draft}, extra || {})); else store.del(DRAFT_KEY); }
function changed(){ saveDraft(); }

function countChanges(){
  if(!draft) return 0; let n = 0; const P = PUBLISHED;
  const mp = new Map(P.menus.map(m => [m.id, JSON.stringify(m)])), pp = new Map(P.posts.map(p => [p.id, JSON.stringify(p)]));
  for(const m of draft.menus) if(mp.get(m.id) !== JSON.stringify(m)) n++;
  for(const p of draft.posts) if(pp.get(p.id) !== JSON.stringify(p)) n++;
  n += P.menus.filter(m => !menuById(m.id, draft)).length + P.posts.filter(p => !postById(p.id, draft)).length;
  const sv = x => JSON.stringify(Object.assign({}, x, {auth: null}));
  if(sv(P.site) !== sv(draft.site) || JSON.stringify(P.site.auth) !== JSON.stringify(draft.site.auth)) n++;
  return n;
}

function menuOptions(sel, excludeId, allowRoot){
  const ex = new Set(excludeId ? [excludeId, ...descendants(excludeId).map(m => m.id)] : []);
  let out = allowRoot ? `<option value="">— Cấp cao nhất (menu chính) —</option>` : "";
  (function w(pid, depth){ for(const m of kids(pid)){ if(ex.has(m.id)) continue;
    out += `<option value="${m.id}" ${m.id === sel ? "selected" : ""}>${"   ".repeat(depth)}${depth ? "└ " : ""}${esc(m.title)}</option>`; w(m.id, depth + 1); } })(null, 0);
  return out;
}

let savedRange = null;
function keepSel(){ const s = getSelection(), b = $("#ep-body"); if(b && s.rangeCount && b.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange(); }
function restoreSel(){ const b = $("#ep-body"); if(!b) return; b.focus(); if(savedRange && b.contains(savedRange.startContainer)){ const s = getSelection(); s.removeAllRanges(); s.addRange(savedRange); } }
function insertHTML(h){ restoreSel(); document.execCommand("insertHTML", false, h); ui.dirtyEditor = true; keepSel(); }
function insertBlock(h){
  const b = $("#ep-body"); restoreSel(); const sel = getSelection();
  let n = sel.rangeCount && b.contains(sel.anchorNode) ? sel.anchorNode : null;
  while(n && n.parentNode !== b) n = n.parentNode;
  if(n && n.nodeType === 3){ const p = document.createElement("p"); n.replaceWith(p); p.appendChild(n); n = p; }
  const t = document.createElement("template"); t.innerHTML = h; const last = t.content.lastChild;
  if(n) n.after(t.content); else b.appendChild(t.content);
  const r = document.createRange(); r.selectNodeContents(last); r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
  ui.dirtyEditor = true; keepSel();
}
function cellAtCaret(){ restoreSel(); const s = getSelection(); let n = s.anchorNode; if(n && n.nodeType === 3) n = n.parentNode; return n && n.closest ? n.closest("td,th") : null; }

      if(!r) break; const c = Math.min(8, Math.max(1, +r[0] || 3)), n = Math.min(30, Math.max(1, +r[1] || 3));
      insertBlock(`<div class="table-wrap"><table><thead><tr>${"<th>Tiêu đề</th>".repeat(c)}</tr></thead><tbody>${("<tr>" + "<td>&nbsp;</td>".repeat(c) + "</tr>").repeat(n)}</tbody></table></div><p><br></p>`); break; }
    case "row": case "col": case "delrow": { const cell = cellAtCaret(); if(!cell) return toast("Đặt con trỏ vào một ô trong bảng trước.");
      const tr = cell.parentElement, table = cell.closest("table");
      if(cmd === "row"){ const nr = document.createElement("tr"); nr.innerHTML = "<td>&nbsp;</td>".repeat(tr.children.length); (tr.parentElement.tagName === "THEAD" ? table.tBodies[0] || table : tr.parentElement).insertBefore(nr, tr.parentElement.tagName === "THEAD" ? (table.tBodies[0] ? table.tBodies[0].firstChild : null) : tr.nextSibling); }
      else if(cmd === "col"){ const idx = [...tr.children].indexOf(cell); table.querySelectorAll("tr").forEach(r => { const c = document.createElement(r.parentElement.tagName === "THEAD" ? "th" : "td"); c.innerHTML = "&nbsp;"; r.insertBefore(c, r.children[idx + 1] || null); }); }
      else { if(tr.parentElement.tagName === "THEAD") return toast("Không xóa hàng tiêu đề."); tr.remove(); }
      ui.dirtyEditor = true; break; }
    default: document.execCommand(cmd, false, null); ui.dirtyEditor = true;
  }
}
const figureHTML = (src, cap) => `<figure><img src="${esc(src)}" alt="${esc(cap || "")}">${cap ? `<figcaption>${esc(cap)}</figcaption>` : ""}</figure><p><br></p>`;
function saveFile(name, text, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function imageToDataURL(file, max, type){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, (max || 1200) / Math.max(im.naturalWidth, max ? im.naturalHeight : 0)), c = document.createElement("canvas");
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      const g = c.getContext("2d"); if(type !== "image/png"){ g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); } g.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL(type || "image/jpeg", 0.8)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); }; im.src = url;
  });
}
async function uploadImage(file){
  if(file.size > 15 * 1024 * 1024) return toast("Ảnh quá lớn (tối đa 15 MB).");
  if(STANDALONE){ try{ const src = await imageToDataURL(file); const capt = await dialog({title:"Chú thích ảnh", fields:[{label:"Chú thích (để trống nếu không cần)"}], ok:"Chèn ảnh", cancel:"Bỏ qua"});
      insertBlock(figureHTML(src, capt ? capt[0] : "")); toast("Đã chèn ảnh. Ảnh được gói luôn vào file index.html."); }catch(e){ toast("Không đọc được ảnh này. Thử ảnh JPG hoặc PNG khác."); } return; }
  toast("Đang tải ảnh lên…");
  try{ const r = await cap.assets.upload(file); const capt = await dialog({title:"Chú thích ảnh", fields:[{label:"Chú thích (để trống nếu không cần)"}], ok:"Chèn ảnh", cancel:"Bỏ qua"});
    insertBlock(figureHTML("/_blob/" + r.id, capt ? capt[0] : "")); toast("Đã chèn ảnh."); }
  catch(e){ toast(e && e.code === "not_granted" ? "Chưa được cấp quyền tải ảnh lên." : "Không tải được ảnh. Thử ảnh khác hoặc ảnh nhỏ hơn."); }
}

/* sanitizer: keep only the tags lessons use */
const OK_TAGS = new Set("P H2 H3 H4 STRONG B EM I U S MARK UL OL LI A IMG FIGURE FIGCAPTION TABLE THEAD TBODY TR TH TD BR HR BLOCKQUOTE DIV SPAN CODE SUB SUP SMALL".split(" "));
const OK_CLASS = {has: c => /^(formula|note|lead|table-wrap|say[123]|ipa|fx|vm|vm-[a-z]+|poem|talk|talk-vi|tips|sc|sc-[a-z0-9]+|tl-[a-z]+|at-\d{1,3}|from-\d{1,3}|to-\d{1,3}|k-?[a-z0-9]+|t[1-5]|n[1-3]|b[1-3]|m-[a-z]+|c[2-5]|v|up|tall|plain|noun|pos|neg|q|wh)$/.test(c)};
function sanitize(html){
  const t = document.createElement("template"); t.innerHTML = html;
  (function clean(node){
    for(const el of [...node.childNodes]){
      if(el.nodeType === 8){ el.remove(); continue; }
      if(el.nodeType !== 1) continue;
      const tag = el.tagName;
      if(["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "LINK", "META", "TITLE", "svg", "SVG", "FORM", "INPUT", "BUTTON"].includes(tag)){ el.remove(); continue; }
      clean(el);
      if(!OK_TAGS.has(tag)){ el.replaceWith(...el.childNodes); continue; }
      for(const at of [...el.attributes]){
        const n = at.name.toLowerCase(), v = at.value;
        const keep = (tag === "A" && n === "href" && /^#[\w-]+$/.test(v)) || (tag === "IMG" && n === "src" && /^(\/_blob\/[0-9a-f]+|data:image\/)/i.test(v))
          || (tag === "IMG" && n === "alt") || ((tag === "TD" || tag === "TH") && (n === "colspan" || n === "rowspan") && /^\d+$/.test(v)) || (n === "class");
        if(!keep) el.removeAttribute(at.name);
      }
      if(el.hasAttribute("class")){ const cls = el.getAttribute("class").split(/\s+/).filter(c => OK_CLASS.has(c)); cls.length ? el.setAttribute("class", cls.join(" ")) : el.removeAttribute("class"); }
      if(tag === "A" && !el.hasAttribute("href")){ el.replaceWith(...el.childNodes); continue; }
      if(tag === "IMG" && !el.hasAttribute("src")){ el.remove(); continue; }
      if(tag === "IMG") el.setAttribute("loading", "lazy");
      if((tag === "SPAN" || tag === "DIV") && !el.attributes.length) el.replaceWith(...el.childNodes);
    }
  })(t.content);
  return t.innerHTML.replace(/<p>(\s|&nbsp;|<br>)*<\/p>\s*$/g, "").trim();
}

async function changePassword(e){
  e.preventDefault();
  const old = $("#pw-old").value, n1 = $("#pw-new").value, n2 = $("#pw-new2").value;
  if(!(await checkPw(old))) return toast("Mật khẩu hiện tại chưa đúng.");
  if(n1.length < 8) return toast("Mật khẩu mới cần ít nhất 8 ký tự.");
  if(n1 !== n2) return toast("Hai lần nhập mật khẩu mới chưa khớp.");
  if(!cap.artifact && !STANDALONE) return toast("Chỉ đổi được mật khẩu khi mở trang trên Claude.");
  const salt = randomHex(16), iter = 150000;
  const rec = {salt, iter, hash: await hashPw(n1, salt, iter)};
  touch().site.auth = rec; changed();
  publish({auth: rec});
}

async function publish(opt){
  opt = opt || {};
  if(ui.dirtyEditor && !(await dialog({title:"Bài đang sửa chưa lưu", text:"Chỉnh sửa trong khung soạn thảo chưa được lưu vào bản nháp sẽ không được xuất bản.", ok:"Vẫn xuất bản", cancel:"Quay lại"}))) return;
  if(!draft) return;
  const ok = opt.auth ? await dialog({title:"Đổi mật khẩu và xuất bản?", text:`Mật khẩu mới sẽ có hiệu lực ngay. ${countChanges() > 1 ? "Các thay đổi khác trong bản nháp cũng được xuất bản cùng lúc. " : ""}Trang sẽ tải lại.`, ok:"Đổi mật khẩu"})
    : STANDALONE ? await dialog({title:"Xuất bản thay đổi?", text:`Trang sẽ tạo file <b>index.html</b> mới có ${countChanges()} thay đổi. Sau đó anh/chị tải file này lên hosting, thay cho file cũ.`, ok:"Tạo file index.html"})
    : await dialog({title:"Xuất bản thay đổi?", text:`${countChanges()} thay đổi sẽ hiện ngay cho mọi người đang mở trang. Trang sẽ tải lại sau khi xuất bản.`, ok:"Xuất bản"});
  if(!ok){ if(opt.auth){ draft.site.auth = PUBLISHED.site.auth; changed(); } return; }
  if(STANDALONE) return exportSite(opt);
  if(!cap.artifact) return toast("Chỉ xuất bản được khi mở trang trên Claude.");
  const out = clone(draft); out.site.savedAt = new Date().toISOString(); out.site.version = (PUBLISHED.site.version || 1) + 1;
  saveDraft({publishing: out.site.savedAt}); store.sset("tanm-admin", "1");
  const prevAuth = store.sget(AUTH_KEY); if(out.site.auth) store.sset(AUTH_KEY, out.site.auth.hash);
  const btn = $('[data-act="publish"]'); if(btn){ btn.disabled = true; btn.textContent = "Đang xuất bản…"; }
  try{ await cap.artifact.publish(buildDoc(out)); }
  catch(err){
    store.sset(AUTH_KEY, prevAuth); if(opt.auth){ draft.site.auth = PUBLISHED.site.auth; } saveDraft();
    const c = err && err.code;
    if(c === "conflict") toast("Trang vừa được cập nhật ở nơi khác. Đang tải lại; bản nháp vẫn được giữ.");
    else if(c === "not_writer" || c === "not_granted"){ toast("Tài khoản này không có quyền xuất bản."); }
    else if(c === "too_large") toast("Nội dung quá lớn. Hãy dùng ảnh nhỏ hơn.");
    else toast("Chưa xuất bản được. Thử lại sau ít phút.");
    render();
  }
}
async function exportSite(opt){
  const out = clone(draft); out.site.savedAt = new Date().toISOString(); out.site.version = (PUBLISHED.site.version || 1) + 1;
  saveDraft({publishing: out.site.savedAt});
  saveFile("index.html", buildDoc(out), "text/html");
  await dialog({title:"Đã tạo file index.html", text:`Kiểm tra thư mục Tải về (Downloads). Tải file <b>index.html</b> này lên hosting, ghi đè file cũ. Mở lại trang trên hosting là thấy nội dung mới${opt.auth ? ", và từ lúc đó phải đăng nhập bằng mật khẩu mới" : ""}.`, ok:"Đã hiểu", cancel:""});
}
function buildDoc(d){
  const json = JSON.stringify(d).replace(/</g, "\\u003c");
  return SKEL + PAGE_TOP + $("#site-css").outerHTML + MID + '<div id="app"></div><script type="application/json" id="site-data">' + json + "<\/script>" + $("#site-js").outerHTML + "</body></html>";
}
