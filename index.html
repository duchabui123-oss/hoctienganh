s? (Bạn đã học tiếng Pháp được 2 tháng rồi phải không?)\u003c/p> \u003cp>→ \u003cstrong>Trả lời:\u003c/strong> Yes, I have (đúng vậy)\u003c/p>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>WH- Questions\u003c/td> \u003ctd>\u003ctable>\u003cthead> \u003ctr> \u003cth>When/Where/Why/What/How + have/has + S + been + V-ing?\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003c/tbody> \u003c/table> \u003cp>→ \u003cstrong>Trả lời:\u003c/strong> S + Have/has + been + V-ing.\u003c/p>\u003c/td> \u003ctd>\u003cp>What have you been doing here for 2 hours? (Bạn làm gì ở đây 2 tiếng vừa rồi?)\u003c/p> \u003cp>→ \u003cstrong>Trả lời:\u003c/strong> I have been fixing my bike. (Tôi đang sửa xe đạp.)\u003c/p> \u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Công thức hiện tại hoàn thành tiếp diễn\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-forms\">\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign pos\">(+)\u003c/span>\u003ccode class=\"sc-code\">S + have/has + been + V-ing\u003c/code>\u003cspan class=\"sc-ex\">They \u003cb>have been working\u003c/b> all day.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign neg\">(−)\u003c/span>\u003ccode class=\"sc-code\">S + haven't/hasn't + been + V-ing\u003c/code>\u003cspan class=\"sc-ex\">She \u003cb>hasn't been cleaning\u003c/b> her bed.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Have/Has + S + been + V-ing?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>Have\u003c/b> you \u003cb>been learning\u003c/b> French for 2 months? Yes, I have.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign wh\">Wh-\u003c/span>\u003ccode class=\"sc-code\">Wh- + have/has + S + been + V-ing?\u003c/code>\u003cspan class=\"sc-ex\">What \u003cb>have\u003c/b> you \u003cb>been doing\u003c/b>? I have been fixing my bike.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div> \u003ch3>Cách dùng thì hiện tại hoàn thành tiếp diễn\u003c/h3> \u003cp>Thì hiện tại hoàn thành tiếp diễn có 2 cách dùng chính:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Nhấn mạnh tính liên tục của hành động bắt đầu từ quá khứ và kéo dài đến hiện tại.\u003c/td> \u003ctd>\u003cul> \u003cli>Ms. Anna \u003cstrong>has been teaching\u003c/strong> English in my school for 15 years. (Cô Anna đã dạy tiếng Anh ở trường tôi được 15 năm rồi.)\u003c/li> \u003cli>It \u003cstrong>has been raining\u003c/strong> all day. (Trời đã mưa liên tục suốt cả ngày rồi - hiện tại vẫn đang mưa).\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Hành động vừa mới kết thúc nhưng để lại kết quả/dấu vết ở hiện tại.\u003c/td> \u003ctd>\u003cul> \u003cli>I’m out of breath because I \u003cstrong>have been running\u003c/strong>. (Tôi đang thở dốc vì tôi vừa mới chạy bộ xong).\u003c/li> \u003cli>Why are your hands so dirty? \u003cstrong>Have\u003c/strong> you \u003cstrong>been repairing\u003c/strong> the car? (Sao tay anh bẩn thế? Anh vừa sửa xe à?)\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Hai cách dùng chính\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-vs\">\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">Nhấn mạnh sự liên tục\u003c/b>\u003cspan class=\"sc-txt\">Bắt đầu từ quá khứ, kéo dài đến bây giờ.\u003c/span>\u003cspan class=\"sc-ex\">Ms. Anna \u003cb>has been teaching\u003c/b> English for 15 years.\u003cbr/>It \u003cb>has been raining\u003c/b> all day.\u003c/span>\u003c/div>\u003cspan class=\"sc-vsb\">VS\u003c/span>\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">Vừa xong, còn dấu vết\u003c/b>\u003cspan class=\"sc-txt\">Việc vừa dừng nhưng kết quả còn thấy rõ.\u003c/span>\u003cspan class=\"sc-ex\">I'm out of breath because I \u003cb>have been running\u003c/b>.\u003cbr/>Why are your hands so dirty? \u003cb>Have\u003c/b> you \u003cb>been repairing\u003c/b> the car?\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div> \u003ch3>Dấu hiệu của thì hiện tại hoàn thành tiếp diễn\u003c/h3> \u003cp>Dấu hiệu thì hiện tại hoàn thành tiếp diễn bao gồm:\u003c/p> \u003cul> \u003cli>\u003cstrong>Since + mốc thời gian:\u003c/strong> since 8 a.m., since last week...\u003c/li> \u003cli>\u003cstrong>For + khoảng thời gian:\u003c/strong> For 2 hours, for a long time...\u003c/li> \u003cli>\u003cstrong>All + thời gian:\u003c/strong> All day, all morning, all week...\u003c/li> \u003cli>\u003cstrong>Recently / Lately:\u003c/strong> Gần đây.\u003c/li> \u003cli>\u003cstrong>Up until now:\u003c/strong> Cho đến tận bây giờ.\u003c/li> \u003c/ul> \u003ch4>Ví dụ:\u003c/h4> \u003cul> \u003cli>They have been studying \u003cstrong>for three hours\u003c/strong>. (Họ đã học trong ba tiếng và vẫn đang học.)\u003c/li> \u003cli>I haven't been feeling so well \u003cstrong>lately\u003c/strong>. (Gần đây tôi cảm thấy không được khỏe lắm.)\u003c/li> \u003c/ul> \u003cp>\u003cb>Since\u003c/b> và \u003cb>For\u003c/b> rất dễ nhầm: since đi với \u003cb>mốc\u003c/b> thời gian, for đi với \u003cb>khoảng\u003c/b> thời gian.\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>Since + \u003cstrong>mốc thời gian/thời điểm\u003c/strong>\u003c/th> \u003cth>\u003cul> \u003cli>I have been studying English \u003cstrong>since 2020.\u003c/strong> → Tôi học tiếng Anh từ năm 2020 đến nay.\u003c/li> \u003cli>She has been working here \u003cstrong>since last month.\u003c/strong> → Cô ấy làm ở đây từ tháng trước đến giờ.\u003c/li> \u003c/ul>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>For + \u003cstrong>khoảng thời gian\u003c/strong>\u003c/td> \u003ctd>They have been waiting \u003cstrong>for two hours\u003c/strong>. → Họ đã chờ 2 tiếng rồi.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Since hay For?\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-tlw\">\u003cdiv class=\"sc-tl\">\u003cspan class=\"tl-axis\">\u003c/span>\u003cspan class=\"tl-span from-20 to-88 k-b\">\u003cspan>FOR + khoảng thời gian: 2 hours, 3 years\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-20 k-a\">\u003ci>\u003c/i>\u003cspan>SINCE + mốc\u003csmall>2020, 8 a.m., last week\u003c/small>\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-88 k-now\">\u003ci>\u003c/i>\u003cspan>BÂY GIỜ\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">since 2020\u003c/b>\u003cspan class=\"sc-ex\">I have been studying English \u003cb>since 2020\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">for two hours\u003c/b>\u003cspan class=\"sc-ex\">They have been waiting \u003cb>for two hours\u003c/b>.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Từ khóa khác\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">all day\u003c/span>\u003cspan class=\"sc-chip\">all week\u003c/span>\u003cspan class=\"sc-chip\">recently\u003c/span>\u003cspan class=\"sc-chip\">lately\u003c/span>\u003cspan class=\"sc-chip\">up until now\u003c/span>\u003c/div>\u003c/div>\u003c/div> \u003ch3>Phân biệt thì hiện tại hoàn thành và thì hiện tại hoàn thành tiếp diễn\u003c/h3> \u003cp>Bảng dưới đây giúp phân biệt hai thì này:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Tiêu chí\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Hiện tại hoàn thành (Simple)\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Hiện tại hoàn thành tiếp diễn (Continuous)\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Tính hoàn thiện\u003c/td> \u003ctd>\u003cp>Diễn tả hành động \u003cstrong>đã hoàn thành xong\u003c/strong>.\u003c/p> \u003cp>→ I \u003cstrong>have written\u003c/strong> an email to you. (Tôi vừa viết xong email rồi).\u003c/p>\u003c/td> \u003ctd>\u003cp>Diễn tả hành động \u003cstrong>vẫn đang tiếp tục\u003c/strong> cho đến hiện tại.\u003c/p> \u003cp>→ I \u003cstrong>have been writing\u003c/strong> some emails to you. (Tôi vẫn đang trong quá trình viết).\u003c/p>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Sự tập trung\u003c/td> \u003ctd>\u003cp>Tập trung vào \u003cstrong>kết quả\u003c/strong> của hành động.\u003c/p> \u003cp>→ You \u003cstrong>have cleaned\u003c/strong> the bathroom! It looks lovely! (Nhấn mạnh cái nhà tắm đã sạch).\u003c/p>\u003c/td> \u003ctd>\u003cp>Tập trung vào bản chất \u003cstrong>quá trình/hành động\u003c/strong>.\u003c/p> \u003cp>→ I \u003cstrong>have been cleaning\u003c/strong> the bathroom. It was so dirty. (Nhấn mạnh việc tôi đang hì hục dọn).\u003c/p>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Câu hỏi trả lời\u003c/td> \u003ctd>\u003cp>Trả lời cho: \u003cstrong>How many? / How much?\u003c/strong> (Số lượng/Kết quả).\u003c/p> \u003cp>→ She \u003cstrong>has read\u003c/strong> ten books this summer. (Nhấn mạnh số lượng 10 cuốn).\u003c/p>\u003c/td> \u003ctd>\u003cp>Trả lời cho: \u003cstrong>How long?\u003c/strong> (Khoảng thời gian).\u003c/p> \u003cp>→ She \u003cstrong>has been reading\u003c/strong> that book all day. (Nhấn mạnh việc đọc suốt cả ngày).\u003c/p>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Tính bền vững\u003c/td> \u003ctd>\u003cp>Diễn tả hành động mang tính \u003cstrong>lâu dài, bền bỉ\u003c/strong> hoặc thói quen cố định.\u003c/p> \u003cp>→ She \u003cstrong>has run\u003c/strong> a lot for 3 years. (Thói quen chạy bộ bền bỉ suốt 3 năm).\u003c/p>\u003c/td> \u003ctd>\u003cp>Nhấn mạnh hành động mang tính \u003cstrong>tạm thời\u003c/strong>, mới xảy ra gần đây.\u003c/p> \u003cp>→ She \u003cstrong>has been running\u003c/strong> a lot recently. (Dạo gần đây mới chạy nhiều, trước đó thì không).\u003c/p>\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch4>Xem thêm trong trang:\u003c/h4> \u003cul>\u003cli>\u003ca href=\"#hien-tai-don\">Hiện tại đơn\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#hien-tai-tiep-dien\">Hiện tại tiếp diễn\u003c/a>\u003c/li>\u003c/ul> \u003cdiv class=\"sc t5\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Đã xong hay vẫn đang làm?\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-vs\">\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">Hiện tại hoàn thành\u003c/b>\u003ccode class=\"sc-code\">have/has + V3\u003c/code>\u003cspan class=\"sc-txt\">Nhấn \u003cb>kết quả\u003c/b>. Trả lời \u003ci>How many? How much?\u003c/i>\u003c/span>\u003cspan class=\"sc-ex\">You \u003cb>have cleaned\u003c/b> the bathroom! It looks lovely.\u003cbr/>She \u003cb>has read\u003c/b> ten books this summer.\u003c/span>\u003c/div>\u003cspan class=\"sc-vsb\">VS\u003c/span>\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">Hiện tại hoàn thành tiếp diễn\u003c/b>\u003ccode class=\"sc-code\">have/has + been + V-ing\u003c/code>\u003cspan class=\"sc-txt\">Nhấn \u003cb>quá trình\u003c/b>. Trả lời \u003ci>How long?\u003c/i>\u003c/span>\u003cspan class=\"sc-ex\">I \u003cb>have been writing\u003c/b> emails to you.\u003cbr/>She \u003cb>has been reading\u003c/b> that book all day.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div> \u003ch3>Bị động hiện tại hoàn thành tiếp diễn\u003c/h3> \u003cp>Công thức bị động hiện tại hoàn thành tiếp diễn như sau:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Thể\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cấu trúc\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Khẳng định\u003c/td> \u003ctd>S + have/has + been + being + V3/ed\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Phủ định\u003c/td> \u003ctd>S + have/has + not + been + being + V3/ed\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Nghi vấn\u003c/td> \u003ctd>Have/Has + S + been + being + V3/ed?\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch4>Ví dụ:\u003c/h4> \u003cul> \u003cli>\u003cstrong>Chủ động:\u003c/strong> They have been repairing the road. (Họ đã và đang sửa con đường.)\u003c/li> \u003cli>\u003cstrong>Bị động:\u003c/strong> The road \u003cstrong>has been being repaired\u003c/strong>. (Con đường đã và đang được sửa.)\u003c/li> \u003c/ul> \u003cp>\u003cem>\u003cstrong>Lưu ý:\u003c/strong> Cấu trúc này rất ít dùng trong thực tế. Người ta thường dùng bị động của thì hiện tại hoàn thành để câu gọn và tự nhiên hơn, mà nghĩa vẫn tương đương.\u003c/em>\u003c/p> \u003cul> \u003cli>\u003cem>\u003cstrong>Thay vì nói:\u003c/strong> The project \u003cstrong>has been being developed\u003c/strong> for 2 years. (Nghe rất nặng nề)\u003c/em>\u003c/li> \u003cli>\u003cem>\u003cstrong>Hãy nói:\u003c/strong> The project \u003cstrong>has been developed\u003c/strong> for 2 years. (Gọn và chuẩn hơn)\u003c/em>\u003c/li> \u003c/ul>","order":0,"updated":"2026-10-26"},{"id":"bai-tuong-lai-hoan-thanh","menu":"tuong-lai-hoan-thanh","title":"Thì tương lai hoàn thành (Future Perfect)","html":"\u003cp class=\"lead\">Thì tương lai hoàn thành (Future Perfect) dùng để nói một việc sẽ \u003cb>xong trước\u003c/b> một thời điểm hoặc trước một việc khác trong tương lai.\u003c/p> \u003ch3>Định nghĩa thì tương lai hoàn thành\u003c/h3> \u003cp>\u003cstrong>Thì tương lai hoàn thành\u003c/strong> (Future Perfect) diễn tả một việc trong tương lai sẽ kết thúc trước một việc khác, hoặc sẽ hoàn tất trước một thời điểm trong tương lai.\u003c/p> \u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Tương lai hoàn thành\u003c/p>\u003cp class=\"sc-sub\">Việc sẽ hoàn tất trước một thời điểm trong tương lai.\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-tlw\">\u003cdiv class=\"sc-tl\">\u003cspan class=\"tl-axis\">\u003c/span>\u003cspan class=\"tl-mark at-15 k-now\">\u003ci>\u003c/i>\u003cspan>BÂY GIỜ\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-55 k-x up\">\u003ci>\u003c/i>\u003cspan>Xong việc\u003csmall>will have + V3\u003c/small>\u003c/span>\u003c/span>\u003cspan class=\"tl-mark at-85 k-b\">\u003ci>\u003c/i>\u003cspan>Hạn chót\u003csmall>by / before…\u003c/small>\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"sc-forms\">\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign pos\">(+)\u003c/span>\u003ccode class=\"sc-code\">S + will have + V3\u003c/code>\u003cspan class=\"sc-ex\">I \u003cb>will have finished\u003c/b> the report before the deadline.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign neg\">(−)\u003c/span>\u003ccode class=\"sc-code\">S + won't have + V3\u003c/code>\u003cspan class=\"sc-ex\">They \u003cb>won't have decorated\u003c/b> the wall before the parade.\u003c/span>\u003c/div>\u003cdiv class=\"sc-f\">\u003cspan class=\"sc-sign q\">(?)\u003c/span>\u003ccode class=\"sc-code\">Will + S + have + V3?\u003c/code>\u003cspan class=\"sc-ex\">\u003cb>Will\u003c/b> you \u003cb>have eaten\u003c/b> before you get to the airport?\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div> \u003ch3>Cấu trúc tương lai hoàn thành\u003c/h3> \u003cp>Công thức thì tương lai hoàn thành có 3 dạng:\u003c/p> \u003cp class=\"formula\">\u003cem>\u003cstrong>Khẳng định\u003c/strong> : S + will + have + V3/ed\u003c/em>\u003c/p> \u003cp class=\"formula\">\u003cem>\u003cstrong>Phủ định\u003c/strong>: S + won't (will not = won't) + have + V3/ed \u003c/em>\u003c/p> \u003cp class=\"formula\">\u003cem>\u003cstrong>Câu hỏi\u003c/strong>: Will + S + have + V3/ed? → Yes, S + will. / No, S + won't.\u003c/em>\u003c/p> \u003ch3>Ký hiệu trong công thức:\u003c/h3> \u003cul> \u003cli>S (subject) = Chủ ngữ\u003c/li> \u003cli>Will &amp; have = trợ động từ\u003c/li> \u003cli>V3/ed = quá khứ phân từ (phân từ 2) (gồm cả động từ có quy tắc và bất quy tắc)\u003c/li> \u003c/ul> \u003ch4>Câu khẳng định\u003c/h4> \u003ch4>S + will + have + V3/ed\u003c/h4> \u003ch4>Ví dụ:\u003c/h4> \u003cul> \u003cli>I \u003cstrong>will have finished\u003c/strong> this course by next week (Đến tuần sau tôi sẽ học xong khóa này.)\u003c/li> \u003cli>\u003cstrong>By the time\u003c/strong> you get home, I \u003cstrong>will have cleaned\u003c/strong> the house from top to bottom (Trước khi bạn về đến nhà, tôi sẽ dọn xong cả nhà.)\u003c/li> \u003c/ul> \u003cdiv class=\"sc t2\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Tương lai hoàn thành qua 2 ví dụ\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Hạn chót: tuần sau\u003c/b>\u003cspan class=\"sc-txt\">I \u003cb>will have finished\u003c/b> this course \u003cb>by next week\u003c/b>.\u003c/span>\u003cspan class=\"sc-ex\">Đến tuần sau là học xong rồi.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Hạn chót: 10 giờ tối\u003c/b>\u003cspan class=\"sc-txt\">\u003cb>By 10 p.m.\u003c/b>, my sister \u003cb>will have finished\u003c/b> her homework.\u003c/span>\u003cspan class=\"sc-ex\">Trước 10 giờ, em gái sẽ làm xong bài.\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Dấu hiệu\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">by + thời gian\u003c/span>\u003cspan class=\"sc-chip\">by the end of…\u003c/span>\u003cspan class=\"sc-chip\">by the time + S + V\u003c/span>\u003cspan class=\"sc-chip\">before + thời gian\u003c/span>\u003c/div>\u003c/div>\u003c/div> \u003ch4>Câu phủ định\u003c/h4> \u003ch3>S + won't + have + V3/ed (will not = won't)\u003c/h3> \u003ch4>Ví dụ:\u003c/h4> \u003cul> \u003cli>We \u003cstrong>will not have eaten\u003c/strong> breakfast before we get to the airport \u003cstrong>tomorrow morning\u003c/strong> (Sáng mai chúng tôi sẽ chưa ăn sáng xong trước khi đến sân bay.)\u003c/li> \u003cli>They \u003cstrong>won't have decorated\u003c/strong> the wall \u003cstrong>before\u003c/strong> the parade (Họ sẽ chưa trang trí xong bức tường trước cuộc diễu hành.)\u003c/li> \u003c/ul> \u003ch4>Câu hỏi\u003c/h4> \u003ch4>Will + S + have + V3/ed?\u003c/h4> \u003cp class=\"formula\">\u003cem>\u003cstrong>Trả lời\u003c/strong>: Yes, S + will / No, S + won't.\u003c/em>\u003c/p> \u003ch4>Ví dụ:\u003c/h4> \u003cul> \u003cli>\u003cstrong>Will you have eaten\u003c/strong> breakfast before you get to the airport \u003cstrong>tomorrow morning\u003c/strong>? (Sáng mai bạn sẽ ăn sáng xong trước khi đến sân bay chứ?)\u003c/li> \u003cli>\u003cstrong>Will they have decorated\u003c/strong> the wall \u003cstrong>before\u003c/strong> the parade? (Liệu họ có trang trí xong bức tường trước cuộc diễu hành không?)\u003c/li> \u003c/ul> \u003ch4>Xem thêm trong trang:\u003c/h4> \u003cul>\u003cli>\u003ca href=\"#dong-tu-bat-quy-tac\">Danh sách động từ bất quy tắc\u003c/a>\u003c/li>\u003c/ul> \u003ch3>Cách dùng thì tương lai hoàn thành\u003c/h3> \u003cp>Thì tương lai hoàn thành có 2 cách dùng chính:\u003c/p> \u003ch3>1. Dùng để diễn tả một hành động hoàn thành trước một thời điểm cụ thể trong tương lai\u003c/h3> \u003cp>\u003cstrong>Thì tương lai hoàn thành\u003c/strong> dùng để diễn tả một hành động hoàn thành trước một thời điểm cụ thể trong tương lai.\u003c/p> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> Khi kể về kế hoạch sắp tới:\u003c/p> \u003cp>I \u003cstrong>will have graduated\u003c/strong> from university by the end of next year. (Tôi sẽ tốt nghiệp đại học trước cuối năm sau.)\u003c/p> \u003cp>⇒ Thể hiện việc \"\u003cstrong>tốt nghiệp\u003c/strong>\" sẽ được hoàn thành trước 1 thời điểm cụ thể ở tương lai - đó là năm sau\u003c/p> \u003ch3>2. Dùng để diễn tả một hành động kéo dài đến một thời điểm cụ thể trong tương lai\u003c/h3> \u003cp>Thì tương lai hoàn thành dùng để diễn tả 1 hành động kéo dài đến 1 thời điểm cụ thể trong tương lai.\u003c/p> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> Khi nói về công việc:\u003c/p> \u003cp>This time next month, I \u003cstrong>will have worked\u003c/strong> at my company for exactly 10 years, so I plan to change my job. (Giờ này tháng sau, tôi sẽ làm ở công ty tròn 10 năm, nên tôi định đổi việc.)\u003c/p> \u003cp>⇒ Nghĩa là hành động \"làm việc\" sẽ được kéo dài đến tận 1 thời điểm cụ thể ở tương lai - giờ này tháng sau.\u003c/p> \u003ch4>Xem thêm trong trang:\u003c/h4> \u003cul>\u003cli>\u003ca href=\"#tuong-lai-don\">Tương lai đơn\u003c/a>\u003c/li>\u003c/ul> \u003ch3>Dấu hiệu nhận biết tương lai hoàn thành\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Dấu hiệu nhận biết thì tương lai hoàn thành\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>By + thời gian trong tương lai\u003c/td> \u003ctd>By 10 p.m., my sister will have finished her homework\u003c/td> \u003c/tr> \u003ctr> \u003ctd>By the end of + thời gian trong tương lai\u003c/td> \u003ctd>By the end of June, I will have finished my course\u003c/td> \u003c/tr> \u003ctr> \u003ctd>By the time + S + V\u003c/td> \u003ctd>By the time her father is fifty-five, he will have retired\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Before + thời gian trong tương lai \u003c/td> \u003ctd>Before 11 o’clock tomorrow, I will have started my project\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-cau-truc-khac","menu":"cau-truc-khac","title":"Cấu trúc ngữ pháp tiếng Anh cơ bản khác","html":"\u003cp>Sau khi nắm vững các loại từ, cấu trúc câu và thì, chúng ta cần thêm một số \"mảnh ghép\" ngữ pháp khác để hoàn thiện câu tiếng Anh.\u003c/p> \u003cdiv class=\"sc t3\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Lộ trình\u003c/span>\u003cp class=\"sc-title\">Lộ trình phần Cấu trúc khác\u003c/p>\u003cp class=\"sc-sub\">Năm mảnh ghép để câu tiếng Anh đầy đủ hơn.\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-road\">\u003ca class=\"sc-step\" href=\"#mao-tu\">\u003cb>1\u003c/b>\u003cspan>Mạo từ a, an, the\u003csmall>khi nào dùng, khi nào bỏ\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"sc-step\" href=\"#dong-tu-khiem-khuyet\">\u003cb>2\u003c/b>\u003cspan>Động từ khiếm khuyết\u003csmall>can, may, should, must…\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"sc-step\" href=\"#cau-bi-dong\">\u003cb>3\u003c/b>\u003cspan>Câu bị động\u003csmall>be + V3\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"sc-step\" href=\"#cau-dieu-kien\">\u003cb>4\u003c/b>\u003cspan>Câu điều kiện\u003csmall>loại 0 và loại 1\u003c/small>\u003c/span>\u003c/a>\u003ca class=\"sc-step\" href=\"#so-sanh\">\u003cb>5\u003c/b>\u003cspan>So sánh\u003csmall>bằng, hơn, nhất\u003c/small>\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>","order":0,"updated":"2026-10-24"},{"id":"bai-mao-tu","menu":"mao-tu","title":"Mạo từ (a, an, the)","html":"\u003cp>\u003cstrong>Mạo từ\u003c/strong> là những từ nhỏ đứng trước danh từ. Tiếng Anh có ba loại mạo từ:\u003c/p> \u003cul> \u003cli>\u003cstrong>Mạo từ bất định:\u003c/strong> a, an (chỉ vật không xác định)\u003c/li> \u003cli>\u003cstrong>Mạo từ xác định:\u003c/strong> the (chỉ vật xác định)\u003c/li> \u003cli>\u003cstrong>Mạo từ zero:\u003c/strong> không dùng mạo từ\u003c/li> \u003c/ul> \u003ch3>1. Quy tắc sử dụng \"A\" và \"An\"\u003c/h3> \u003cp>\"A\" và \"an\" dùng với danh từ số ít đếm được, chỉ vật chưa xác định (đề cập lần đầu).\u003c/p> \u003cul> \u003cli>Dùng \"a\" trước từ bắt đầu bằng âm phụ âm: \u003cul> \u003cli>\u003cstrong>a\u003c/strong> book, \u003cstrong>a\u003c/strong> car, \u003cstrong>a\u003c/strong> university (đọc là /ˌjuːnɪˈvɜːsəti/, bắt đầu bằng âm /j/ - phụ âm)\u003c/li> \u003c/ul>\u003c/li> \u003cli>Dùng \"an\" trước từ bắt đầu bằng âm nguyên âm: \u003cul> \u003cli>\u003cstrong>an\u003c/strong> apple, \u003cstrong>an\u003c/strong> egg, \u003cstrong>an\u003c/strong> hour (đọc là /aʊə(r)/, bắt đầu bằng âm /aʊ/ - nguyên âm)\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Lưu ý:\u003c/strong> Quy tắc này dựa vào âm đầu tiên khi phát âm, không phải chữ cái đầu tiên.\u003c/p> \u003cdiv class=\"sc t4\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">A / An hay The?\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-vs\">\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">A / An\u003c/b>\u003cspan class=\"sc-txt\">Vật \u003cb>chưa xác định\u003c/b>, nhắc lần đầu. Chỉ dùng với danh từ đếm được số ít.\u003c/span>\u003cspan class=\"sc-ex\">\u003cb>a\u003c/b> book · \u003cb>a\u003c/b> university (âm /j/)\u003cbr>\u003cb>an\u003c/b> apple · \u003cb>an\u003c/b> hour (âm /aʊ/)\u003c/span>\u003c/div>\u003cspan class=\"sc-vsb\">VS\u003c/span>\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">The\u003c/b>\u003cspan class=\"sc-txt\">Vật \u003cb>đã xác định\u003c/b>: đã nhắc trước đó, duy nhất, hoặc ai cũng biết. Dùng được cả số ít, số nhiều.\u003c/span>\u003cspan class=\"sc-ex\">I bought a book. \u003cb>The\u003c/b> book was interesting.\u003cbr>\u003cb>the\u003c/b> sun · \u003cb>the\u003c/b> tallest girl · \u003cb>the\u003c/b> Mekong River\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-label\">Không dùng mạo từ\u003c/p>\u003cdiv class=\"sc-chips\">\u003cspan class=\"sc-chip\">nói chung: Water is essential\u003c/span>\u003cspan class=\"sc-chip\">Dogs are loyal\u003c/span>\u003cspan class=\"sc-chip\">tên người, nước: Vietnam\u003c/span>\u003cspan class=\"sc-chip\">bữa ăn: have breakfast\u003c/span>\u003cspan class=\"sc-chip\">by car, by bus\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Chọn a hay an theo \u003cb>âm\u003c/b> đầu tiên khi đọc, không theo chữ cái.\u003c/p>\u003c/div> \u003ch3>2. Các trường hợp sử dụng \"The\"\u003c/h3> \u003cp>\"The\" dùng với cả danh từ số ít và số nhiều, chỉ vật đã xác định. Dùng \"the\" khi:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Trường hợp\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Vật đã được nhắc trước đó\u003c/td> \u003ctd>Danh từ xác định\u003c/td> \u003ctd>I bought a book yesterday. \u003cstrong>The book\u003c/strong> was interesting.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Vật duy nhất hoặc hai bên đều biết\u003c/td> \u003ctd>Người nói &amp; nghe đều hiểu rõ\u003c/td> \u003ctd>The sun is very hot today.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Tên sông, biển và vật duy nhất\u003c/td> \u003ctd>Chỉ có một\u003c/td> \u003ctd>The Amazon River is in South America.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Với tính từ so sánh nhất\u003c/td> \u003ctd>the + adj-est\u003c/td> \u003ctd>She’s \u003cstrong>the tallest\u003c/strong> girl in her class.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Tên đại dương, biển, sông, dãy núi, sa mạc, quần đảo\u003c/td> \u003ctd>Danh từ địa lý đặc biệt\u003c/td> \u003ctd>the Pacific Ocean, the Mekong River, the Himalayas\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>3. Khi nào không dùng mạo từ?\u003c/h3> \u003cp>Không dùng mạo từ (Zero Article) trong các trường hợp:\u003c/p> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Trường hợp\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>Danh từ không đếm được nói chung\u003c/td> \u003ctd>Không chỉ vật cụ thể\u003c/td> \u003ctd>Water is essential for life.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Danh từ số nhiều nói chung\u003c/td> \u003ctd>Nói về cả loài\u003c/td> \u003ctd>Dogs are loyal animals.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Tên riêng (người, thành phố, quốc gia, châu lục, hầu hết hồ)\u003c/td> \u003ctd>Viết hoa, không dùng mạo từ\u003c/td> \u003ctd>Lake Baikal is the deepest lake in the world.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Bữa ăn, thể thao, màu sắc, ngôn ngữ (nói chung)\u003c/td> \u003ctd>Không xác định cụ thể\u003c/td> \u003ctd>We have breakfast at 7 AM.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Phương tiện đi lại (giới từ \u003cstrong>by\u003c/strong>)\u003c/td> \u003ctd>by + phương tiện\u003c/td> \u003ctd>by car, by bus, by train\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-dong-tu-khiem-khuyet","menu":"dong-tu-khiem-khuyet","title":"Động từ khiếm khuyết","html":"\u003cp>\u003cstrong>Động từ khiếm khuyết\u003c/strong> (Modal Verbs) là những động từ đặc biệt dùng để nói về khả năng, sự bắt buộc, sự cho phép, lời khuyên hay lời đề nghị. Theo sau chúng là động từ nguyên mẫu không \"to\", và chúng không đổi dạng theo ngôi hay số.\u003c/p> \u003ch3>1. Can/Could/Be able to: Diễn tả khả năng, sự cho phép\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Modal Verbs\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>Can\u003c/strong>\u003c/td> \u003ctd>Khả năng ở hiện tại.\u003c/td> \u003ctd>I&nbsp;\u003cstrong>can\u003c/strong>&nbsp;speak English.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Could\u003c/strong>\u003c/td> \u003ctd>\u003cul> \u003cli>Khả năng trong quá khứ.\u003c/li> \u003cli>Lời yêu cầu lịch sự.\u003c/li> \u003cli>Khả năng có thể xảy ra.\u003c/li> \u003c/ul>\u003c/td> \u003ctd>\u003cul> \u003cli>I&nbsp;\u003cstrong>could\u003c/strong> swim when I was five.\u003c/li> \u003cli>\u003cstrong>Could\u003c/strong>&nbsp;you help me, please?\u003c/li> \u003cli>It \u003cstrong>could\u003c/strong>&nbsp;rain tomorrow.\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Be able to\u003c/strong>\u003c/td> \u003ctd>Thay thế \"can\" ở các thì khác (tương lai, hoàn thành...).\u003c/td> \u003ctd>I will&nbsp;\u003cstrong>be able to\u003c/strong>&nbsp;speak English fluently next year.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>2. May/Might: Diễn tả khả năng (ít chắc chắn hơn), sự cho phép (trang trọng)\u003c/h3> \u003cul> \u003cli>May: \u003cul> \u003cli>Diễn tả khả năng ở hiện tại hoặc tương lai: It \u003cstrong>may\u003c/strong> rain today. (có thể trời sẽ mưa)\u003c/li> \u003cli>Diễn tả sự cho phép (trang trọng): \u003cstrong>May\u003c/strong> I come in? (tôi có thể vào không?)\u003c/li> \u003c/ul>\u003c/li> \u003cli>Might: \u003cul> \u003cli>Diễn tả khả năng ít chắc chắn hơn: She \u003cstrong>might\u003c/strong> come to the party. (có thể cô ấy sẽ đến)\u003c/li> \u003cli>Diễn tả sự cho phép trong lời nói gián tiếp: He asked if he \u003cstrong>might\u003c/strong> use my phone. (anh ta hỏi liệu có thể dùng điện thoại của tôi không)\u003c/li> \u003c/ul>\u003c/li> \u003c/ul> \u003ch3>3. Should/Ought to/Had better: Đưa ra lời khuyên\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Modal Verbs\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd>\u003cstrong>Should\u003c/strong>\u003c/td> \u003ctd>\u003cul> \u003cli>Đưa ra lời khuyên.\u003c/li> \u003cli>Nghĩa vụ không quá bắt buộc.\u003c/li> \u003c/ul>\u003c/td> \u003ctd>\u003cul> \u003cli>You&nbsp;\u003cstrong>should\u003c/strong> study harder.\u003c/li> \u003cli>I \u003cstrong>should\u003c/strong>&nbsp;visit my grandparents more often.\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Ought to\u003c/strong>\u003c/td> \u003ctd>Tương tự \"should\", trang trọng hơn một chút.\u003c/td> \u003ctd>You&nbsp;\u003cstrong>ought to\u003c/strong>&nbsp;sleep earlier.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>\u003cstrong>Had better\u003c/strong>\u003c/td> \u003ctd>Lời khuyên mạnh, có hàm ý hậu quả xấu nếu không làm.\u003c/td> \u003ctd>You&nbsp;\u003cstrong>had better\u003c/strong>&nbsp;see a doctor.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>4. Must/Have to: Diễn tả sự bắt buộc\u003c/h3> \u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead> \u003ctr> \u003cth>\u003cstrong>Chức năng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Modal Verbs\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Cách dùng\u003c/strong>\u003c/th> \u003cth>\u003cstrong>Ví dụ\u003c/strong>\u003c/th> \u003c/tr> \u003c/thead> \u003ctbody> \u003ctr> \u003ctd rowspan=\"2\">Sự bắt buộc\u003c/td> \u003ctd>Must\u003c/td> \u003ctd>\u003cul> \u003cli>Bắt buộc từ phía người nói.\u003c/li> \u003cli>Sự suy đoán chắc chắn.\u003c/li> \u003c/ul>\u003c/td> \u003ctd>\u003cul> \u003cli>You&nbsp;\u003cstrong>must\u003c/strong> be home by 10 PM.\u003c/li> \u003cli>He \u003cstrong>must\u003c/strong>&nbsp;be tired after working all day.\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Have to\u003c/td> \u003ctd>\u003cul> \u003cli>Bắt buộc do khách quan (luật, nội quy).\u003c/li> \u003cli>Có thể chia ở nhiều thì khác nhau.\u003c/li> \u003c/ul>\u003c/td> \u003ctd>\u003cul> \u003cli>I&nbsp;\u003cstrong>have to\u003c/strong> wear a uniform at school.\u003c/li> \u003cli>I \u003cstrong>had to\u003c/strong>&nbsp;study last night.\u003c/li> \u003c/ul>\u003c/td> \u003c/tr> \u003ctr> \u003ctd rowspan=\"2\">Cấm đoán / Không cần\u003c/td> \u003ctd>Must not\u003c/td> \u003ctd>\u003cstrong>Cấm đoán\u003c/strong>&nbsp;(không được phép làm).\u003c/td> \u003ctd>You&nbsp;\u003cstrong>must not\u003c/strong>&nbsp;smoke here.\u003c/td> \u003c/tr> \u003ctr> \u003ctd>Don't have to\u003c/td> \u003ctd>\u003cstrong>Không bắt buộc\u003c/strong>&nbsp;(không cần thiết phải làm).\u003c/td> \u003ctd>You&nbsp;\u003cstrong>don't have to\u003c/strong>&nbsp;come if you're busy.\u003c/td> \u003c/tr> \u003c/tbody> \u003c/table>\u003c/div> \u003ch3>5. Will/Would: Lời đề nghị, yêu cầu lịch sự\u003c/h3> \u003cul> \u003cli>Will: \u003cul> \u003cli>Diễn tả tương lai: I \u003cstrong>will\u003c/strong> see you tomorrow. (tôi sẽ gặp bạn vào ngày mai)\u003c/li> \u003cli>Diễn tả lời đề nghị: \u003cstrong>Will\u003c/strong> you help me with this? (bạn giúp tôi việc này được không?)\u003c/li> \u003cli>Diễn tả sự tình nguyện: I \u003cstrong>will\u003c/strong> do the dishes. (tôi sẽ rửa bát)\u003c/li> \u003c/ul>\u003c/li> \u003cli>Would: \u003cul> \u003cli>Diễn tả hành động lặp đi lặp lại trong quá khứ: When I was a child, I \u003cstrong>would\u003c/strong> visit my grandparents every summer. (hồi nhỏ, tôi thường đến thăm ông bà mỗi mùa hè)\u003c/li> \u003cli>Diễn tả mong ước: I \u003cstrong>would\u003c/strong> like to travel around the world. (tôi muốn đi du lịch vòng quanh thế giới)\u003c/li> \u003cli>Diễn tả yêu cầu lịch sự: \u003cstrong>Would\u003c/strong> you mind opening the window? (bạn có phiền không nếu mở cửa sổ?)\u003c/li> \u003c/ul>\u003c/li> \u003c/ul>","order":0,"updated":"2026-10-26"},{"id":"bai-cau-bi-dong","menu":"cau-bi-dong","title":"Câu bị động","html":"\u003cp>\u003cstrong>Câu bị động\u003c/strong> dùng khi muốn nhấn mạnh đối tượng chịu tác động của hành động, hoặc khi không biết hoặc không quan trọng người thực hiện hành động.\u003c/p> \u003ch4>Công thức tổng quát:\u003c/h4> \u003ch4>Chủ động: S + V + O\u003c/h4> \u003ch3>Bị động: O + be + V3/V-ed + (by + S)\u003c/h3> \u003ch4>Ví dụ:\u003c/h4> \u003cul> \u003cli>Chủ động: They \u003cstrong>clean\u003c/strong> the room every day.\u003c/li> \u003cli>Bị động: The room \u003cstrong>is cleaned\u003c/strong> (by them) every day.\u003c/li> \u003c/ul> \u003ch3>Lưu ý với \"by + tác nhân\":\u003c/h3> \u003cul> \u003cli>Khi chuyển từ chủ động sang bị động, chủ ngữ (người thực hiện hành động) trở thành tân ngữ của \"by\"\u003c/li> \u003cli>Có thể bỏ \"by + tác nhân\" nếu không quan trọng hoặc không biết ai thực hiện hành động\u003c/li> \u003cli>Thường giữ lại \"by + tác nhân\" nếu tác nhân là người nổi tiếng, quan trọng, hoặc khi cần nhấn mạnh người thực hiện\u003c/li> \u003c/ul>","order":0,"updated":"2026-10-26"},{"id":"bai-cau-dieu-kien","menu":"cau-dieu-kien","title":"Câu điều kiện loại 0 và 1","html":"\u003cp>\u003cstrong>Câu điều kiện\u003c/strong> dùng để nói về một điều kiện và kết quả của nó. Tiếng Anh có 4 loại câu điều kiện; ở đây mình học 2 loại đầu tiên, là hai loại dùng nhiều nhất.\u003c/p> \u003ch3>1. Câu điều kiện loại 0\u003c/h3> \u003cp>\u003cstrong>Câu điều kiện loại 0\u003c/strong> dùng để diễn tả sự thật hiển nhiên, quy luật tự nhiên.\u003c/p> \u003ch4>Công thức:\u003c/h4> \u003cdiv class=\"formula\">If + S + V (hiện tại đơn), S + V (hiện tại đơn)\u003c/div> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> If you \u003cstrong>heat\u003c/strong> water to 100°C, it \u003cstrong>boils\u003c/strong>. (Nếu bạn đun nóng nước đến 100°C, nó sẽ sôi)\u003c/p> \u003cp>Lưu ý: Có thể dùng \"when\" thay cho \"if\" trong câu điều kiện loại 0.\u003c/p> \u003cul> \u003cli>When water \u003cstrong>freezes\u003c/strong>, it \u003cstrong>expands\u003c/strong>. (Khi nước đóng băng, nó giãn nở)\u003c/li> \u003c/ul> \u003ch3>2. Câu điều kiện loại 1\u003c/h3> \u003cp>\u003cstrong>Câu điều kiện loại 1\u003c/strong> dùng để diễn tả điều kiện có thể xảy ra ở hiện tại hoặc tương lai.\u003c/p> \u003ch4>Công thức:\u003c/h4> \u003cdiv class=\"formula\">If + S + V (hiện tại đơn), S + will/can/may + V-inf\u003c/div> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> If it \u003cstrong>rains\u003c/strong> tomorrow, I \u003cstrong>will stay\u003c/strong> at home. (Nếu ngày mai trời mưa, tôi sẽ ở nhà)\u003c/p> \u003cdiv class=\"sc t5\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Câu điều kiện loại 0 và loại 1\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-vs\">\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">Loại 0: luôn luôn đúng\u003c/b>\u003ccode class=\"sc-code\">If + hiện tại đơn, hiện tại đơn\u003c/code>\u003cspan class=\"sc-ex\">If you \u003cb>heat\u003c/b> water to 100°C, it \u003cb>boils\u003c/b>.\u003cbr>\u003cb>When\u003c/b> water freezes, it expands.\u003c/span>\u003c/div>\u003cspan class=\"sc-vsb\">VS\u003c/span>\u003cdiv class=\"sc-side\">\u003cb class=\"sc-term\">Loại 1: có thể xảy ra\u003c/b>\u003ccode class=\"sc-code\">If + hiện tại đơn, will/can/may + V\u003c/code>\u003cspan class=\"sc-ex\">If it \u003cb>rains\u003c/b> tomorrow, I \u003cb>will stay\u003c/b> at home.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Loại 0 có thể thay \u003cb>if\u003c/b> bằng \u003cb>when\u003c/b>. Loại 1 nói về khả năng thật ở hiện tại hoặc tương lai.\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-so-sanh","menu":"so-sanh","title":"So sánh trong tiếng Anh (Comparisons)","html":"\u003cp>\u003cstrong>So sánh\u003c/strong> giúp nói ai, cái gì hơn, kém hay bằng nhau. Có ba cấp độ so sánh: bằng, hơn và nhất.\u003c/p> \u003ch3>1. So sánh bằng\u003c/h3> \u003cp>\u003cstrong>So sánh bằng\u003c/strong> dùng để diễn tả hai người/vật có cùng mức độ về một đặc điểm nào đó.\u003c/p> \u003ch4>Công thức:\u003c/h4> \u003cdiv class=\"formula\">S + be/V + as + adj/adv + as + O\u003c/div> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> She is \u003cstrong>as tall as\u003c/strong> her sister. (Cô ấy cao bằng chị/em gái cô ấy)\u003c/p> \u003ch3>2. So sánh hơn\u003c/h3> \u003cp>\u003cstrong>So sánh hơn\u003c/strong>dùng để so sánh hai người, hai vật hoặc hai sự việc, xem cái nào hơn/kém cái kia.\u003c/p> \u003ch4>Công thức:\u003c/h4> \u003cul> \u003cli>Với tính từ/trạng từ ngắn (1 âm tiết, hoặc 2 âm tiết tận cùng -y): S + be/V + adj/adv-er + than + O\u003c/li> \u003cli>Với tính từ/trạng từ dài (từ 2 âm tiết trở lên, trừ đuôi -y): S + be/V + more + adj/adv + than + O\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> She is \u003cstrong>taller than\u003c/strong> her sister. (Cô ấy cao hơn chị/em gái cô ấy)\u003c/p> \u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Ba cấp so sánh\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-bars\">\u003cdiv class=\"b1\">\u003ci>\u003c/i>\u003cb>as tall as\u003c/b>\u003csmall>so sánh bằng\u003c/small>\u003c/div>\u003cdiv class=\"b2\">\u003ci>\u003c/i>\u003cb>taller than\u003c/b>\u003csmall>so sánh hơn\u003c/small>\u003c/div>\u003cdiv class=\"b3\">\u003ci>\u003c/i>\u003cb>the tallest\u003c/b>\u003csmall>so sánh nhất\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Tính từ ngắn\u003c/b>\u003cspan class=\"sc-txt\">tall → taller → the tallest\u003c/span>\u003cspan class=\"sc-ex\">Linda is \u003cb>taller than\u003c/b> her sister.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k2\">\u003cb class=\"sc-term\">Tính từ dài\u003c/b>\u003cspan class=\"sc-txt\">interesting → more interesting → the most interesting\u003c/span>\u003cspan class=\"sc-ex\">This book is \u003cb>more interesting than\u003c/b> the old one.\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">So sánh bằng\u003c/b>\u003cspan class=\"sc-txt\">as + tính từ + as\u003c/span>\u003cspan class=\"sc-ex\">She is \u003cb>as tall as\u003c/b> her sister.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">So sánh hơn luôn có \u003cb>than\u003c/b>. So sánh nhất luôn có \u003cb>the\u003c/b>.\u003c/p>\u003c/div> \u003ch3>3. So sánh nhất\u003c/h3> \u003cp>\u003cstrong>So sánh nhất\u003c/strong> dùng để nói một người hoặc vật có mức độ cao nhất hoặc thấp nhất trong một nhóm từ ba đối tượng trở lên.\u003c/p> \u003ch4>Công thức:\u003c/h4> \u003cul> \u003cli>Với tính từ/trạng từ ngắn (1 âm tiết, hoặc 2 âm tiết tận cùng -y): S + be/V + the + adj/adv-est (+ in/of + nhóm so sánh)\u003c/li> \u003cli>Với tính từ/trạng từ dài (từ 2 âm tiết trở lên, trừ đuôi -y): S + be/V + the most + adj/adv (+ in/of + nhóm so sánh)\u003c/li> \u003c/ul> \u003cp>\u003cstrong>Ví dụ:\u003c/strong> She speaks \u003cstrong>the most fluently\u003c/strong> in our group. (Cô ấy nói trôi chảy nhất trong nhóm chúng tôi)\u003c/p>","order":0,"updated":"2026-10-26"},{"id":"bai-40-cau-truc-thi","menu":"40-cau-truc-thi","title":"40 cấu trúc ngữ pháp về thì và thời gian","html":"\u003cp class=\"lead\">40 cấu trúc ngữ pháp hay gặp về thì và thời gian, chia thành 4 phần. Mỗi cấu trúc có công thức, ý nghĩa và một câu ví dụ.\u003c/p>\u003ch3>Phần 1: Các thì hiện tại\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Cấu trúc\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>1\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + V(s/es) + …\u003c/span>\u003c/td>\u003ctd>Hiện tại đơn: thói quen, sự thật\u003c/td>\u003ctd>She \u003cb>walks\u003c/b> to school every day.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>2\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + am/is/are + V-ing + …\u003c/span>\u003c/td>\u003ctd>Hiện tại tiếp diễn: đang xảy ra\u003c/td>\u003ctd>They \u003cb>are playing\u003c/b> football now.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + have/has + V3/ed + …\u003c/span>\u003c/td>\u003ctd>Hiện tại hoàn thành\u003c/td>\u003ctd>I \u003cb>have finished\u003c/b> my homework.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>4\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + have/has + been + V-ing + …\u003c/span>\u003c/td>\u003ctd>Hiện tại hoàn thành tiếp diễn\u003c/td>\u003ctd>It \u003cb>has been raining\u003c/b> all morning.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + have/has + V3/ed + for + khoảng thời gian\u003c/span>\u003c/td>\u003ctd>Đã làm gì trong bao lâu\u003c/td>\u003ctd>We \u003cb>have lived\u003c/b> here \u003cb>for\u003c/b> ten years.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>6\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + have/has + V3/ed + since + mốc thời gian\u003c/span>\u003c/td>\u003ctd>Đã làm gì kể từ khi nào\u003c/td>\u003ctd>He \u003cb>has worked\u003c/b> here \u003cb>since\u003c/b> 2020.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + have/has + never + V3/ed + …\u003c/span>\u003c/td>\u003ctd>Chưa bao giờ làm gì\u003c/td>\u003ctd>I \u003cb>have never seen\u003c/b> snow.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">Have/Has + S + ever + V3/ed …?\u003c/span>\u003c/td>\u003ctd>Đã từng… chưa?\u003c/td>\u003ctd>\u003cb>Have\u003c/b> you \u003cb>ever been\u003c/b> to Da Lat?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>9\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">This is the first time + S + have/has + V3/ed\u003c/span>\u003c/td>\u003ctd>Đây là lần đầu ai làm gì\u003c/td>\u003ctd>\u003cb>This is the first time\u003c/b> I \u003cb>have eaten\u003c/b> sushi.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">It is + khoảng thời gian + since + S + V2/ed\u003c/span>\u003c/td>\u003ctd>Đã bao lâu kể từ khi…\u003c/td>\u003ctd>\u003cb>It is\u003c/b> two years \u003cb>since\u003c/b> we \u003cb>met\u003c/b>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phần 2: Các thì quá khứ\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Cấu trúc\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>11\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + V2/ed + …\u003c/span>\u003c/td>\u003ctd>Quá khứ đơn\u003c/td>\u003ctd>I \u003cb>visited\u003c/b> my grandma yesterday.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>12\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + was/were + V-ing + …\u003c/span>\u003c/td>\u003ctd>Quá khứ tiếp diễn\u003c/td>\u003ctd>She \u003cb>was cooking\u003c/b> at 7 p.m.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>13\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + had + V3/ed + …\u003c/span>\u003c/td>\u003ctd>Quá khứ hoàn thành\u003c/td>\u003ctd>The film \u003cb>had started\u003c/b> before we arrived.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>14\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + had been + V-ing + …\u003c/span>\u003c/td>\u003ctd>Quá khứ hoàn thành tiếp diễn\u003c/td>\u003ctd>He \u003cb>had been waiting\u003c/b> for an hour.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>15\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">When + S + V2/ed, S + was/were + V-ing\u003c/span>\u003c/td>\u003ctd>Một việc xảy ra khi việc khác đang diễn ra\u003c/td>\u003ctd>\u003cb>When\u003c/b> I \u003cb>came\u003c/b> home, Mom \u003cb>was cooking\u003c/b>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>16\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">While + S + was/were + V-ing, S + was/were + V-ing\u003c/span>\u003c/td>\u003ctd>Hai hành động cùng đang diễn ra\u003c/td>\u003ctd>\u003cb>While\u003c/b> I \u003cb>was reading\u003c/b>, my sister \u003cb>was singing\u003c/b>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>17\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">By the time + S + V2/ed, S + had + V3/ed\u003c/span>\u003c/td>\u003ctd>Một việc đã xong trước mốc quá khứ\u003c/td>\u003ctd>\u003cb>By the time\u003c/b> we \u003cb>arrived\u003c/b>, the bus \u003cb>had left\u003c/b>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>18\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">After + S + had + V3/ed, S + V2/ed\u003c/span>\u003c/td>\u003ctd>Sau khi đã làm gì thì…\u003c/td>\u003ctd>\u003cb>After\u003c/b> she \u003cb>had eaten\u003c/b>, she \u003cb>went\u003c/b> out.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>19\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">Before + S + V2/ed, S + had + V3/ed\u003c/span>\u003c/td>\u003ctd>Một việc xảy ra trước việc khác\u003c/td>\u003ctd>\u003cb>Before\u003c/b> he \u003cb>slept\u003c/b>, he \u003cb>had brushed\u003c/b> his teeth.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>20\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + used to + V-inf\u003c/span>\u003c/td>\u003ctd>Đã từng có thói quen hoặc trạng thái (nay không còn)\u003c/td>\u003ctd>I \u003cb>used to\u003c/b> live in Hue.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phần 3: Các thì tương lai\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Cấu trúc\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>21\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + will + V-inf + …\u003c/span>\u003c/td>\u003ctd>Tương lai đơn\u003c/td>\u003ctd>I \u003cb>will help\u003c/b> you.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>22\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + am/is/are going to + V-inf\u003c/span>\u003c/td>\u003ctd>Dự định hoặc dự đoán có căn cứ\u003c/td>\u003ctd>Look at the clouds! It \u003cb>is going to rain\u003c/b>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>23\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + am/is/are + V-ing + thời gian tương lai\u003c/span>\u003c/td>\u003ctd>Kế hoạch đã sắp xếp\u003c/td>\u003ctd>We \u003cb>are visiting\u003c/b> Hanoi next week.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>24\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + will be + V-ing + …\u003c/span>\u003c/td>\u003ctd>Tương lai tiếp diễn\u003c/td>\u003ctd>At 8 p.m. tomorrow, I \u003cb>will be watching\u003c/b> TV.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>25\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + will have + V3/ed + …\u003c/span>\u003c/td>\u003ctd>Tương lai hoàn thành\u003c/td>\u003ctd>I \u003cb>will have finished\u003c/b> the book by Friday.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>26\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">By + mốc tương lai, S + will have + V3/ed\u003c/span>\u003c/td>\u003ctd>Hoàn thành trước một mốc\u003c/td>\u003ctd>\u003cb>By\u003c/b> 2030, they \u003cb>will have built\u003c/b> the bridge.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>27\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">By the time + S + V(s/es), S + will have + V3/ed\u003c/span>\u003c/td>\u003ctd>Hoàn thành trước khi…\u003c/td>\u003ctd>\u003cb>By the time\u003c/b> you \u003cb>arrive\u003c/b>, I \u003cb>will have cooked\u003c/b> dinner.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>28\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">When + S + V(s/es), S + will + V-inf\u003c/span>\u003c/td>\u003ctd>Khi… thì sẽ…\u003c/td>\u003ctd>\u003cb>When\u003c/b> it \u003cb>stops\u003c/b> raining, we \u003cb>will go\u003c/b> out.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>29\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">As soon as + S + V(s/es), S + will + V-inf\u003c/span>\u003c/td>\u003ctd>Ngay khi… thì sẽ…\u003c/td>\u003ctd>\u003cb>As soon as\u003c/b> I \u003cb>get\u003c/b> home, I \u003cb>will call\u003c/b> you.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>30\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">Until/Till + S + V(s/es), S + will + V-inf\u003c/span>\u003c/td>\u003ctd>Cho đến khi…\u003c/td>\u003ctd>I \u003cb>will wait until\u003c/b> you \u003cb>come\u003c/b> back.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phần 4: Cấu trúc thời gian hay gặp\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Cấu trúc\u003c/th>\u003cth>Ý nghĩa\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>31\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">It takes/took + O + thời gian + to V\u003c/span>\u003c/td>\u003ctd>Ai mất bao lâu để làm gì\u003c/td>\u003ctd>\u003cb>It takes\u003c/b> me 20 minutes \u003cb>to walk\u003c/b> to school.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>32\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + spend/spent + thời gian + V-ing\u003c/span>\u003c/td>\u003ctd>Ai dành bao lâu làm gì\u003c/td>\u003ctd>She \u003cb>spends\u003c/b> an hour \u003cb>reading\u003c/b> every day.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>33\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">It has been + thời gian + since + S + V2/ed\u003c/span>\u003c/td>\u003ctd>Đã bao lâu kể từ khi…\u003c/td>\u003ctd>\u003cb>It has been\u003c/b> a year \u003cb>since\u003c/b> I \u003cb>moved\u003c/b> here.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>34\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + have/has not + V3/ed + for + thời gian\u003c/span>\u003c/td>\u003ctd>Đã không làm gì trong bao lâu\u003c/td>\u003ctd>I \u003cb>haven't seen\u003c/b> him \u003cb>for\u003c/b> months.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>35\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">The last time + S + V2/ed + was + thời gian\u003c/span>\u003c/td>\u003ctd>Lần cuối làm gì là…\u003c/td>\u003ctd>\u003cb>The last time\u003c/b> I \u003cb>swam was\u003c/b> in July.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>36\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + last + V2/ed + thời gian + ago\u003c/span>\u003c/td>\u003ctd>Lần cuối cách đây…\u003c/td>\u003ctd>I \u003cb>last saw\u003c/b> her two weeks \u003cb>ago\u003c/b>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>37\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + have/has not + V3/ed + since + thời gian\u003c/span>\u003c/td>\u003ctd>Chưa làm gì kể từ…\u003c/td>\u003ctd>He \u003cb>hasn't called since\u003c/b> Monday.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>38\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">No sooner + had + S + V3 + than + S + V2\u003c/span>\u003c/td>\u003ctd>Vừa mới… thì…\u003c/td>\u003ctd>\u003cb>No sooner had\u003c/b> I \u003cb>sat\u003c/b> down \u003cb>than\u003c/b> the phone \u003cb>rang\u003c/b>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>39\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">Hardly/Scarcely + had + S + V3 + when + S + V2\u003c/span>\u003c/td>\u003ctd>Vừa mới… thì…\u003c/td>\u003ctd>\u003cb>Hardly had\u003c/b> we \u003cb>left when\u003c/b> it \u003cb>started\u003c/b> to rain.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>40\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"fx\">S + had hardly/scarcely + V3 + when + S + V2\u003c/span>\u003c/td>\u003ctd>Một dạng khác của \"vừa… thì…\"\u003c/td>\u003ctd>She \u003cb>had hardly\u003c/b> \u003cb>arrived when\u003c/b> the meeting \u003cb>began\u003c/b>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"sc t1\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Mẹo nhớ 40 cấu trúc\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c2\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Hiện tại\u003c/b>\u003cspan class=\"sc-txt\">have/has + V3 đi với for, since, never, ever, the first time\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Quá khứ\u003c/b>\u003cspan class=\"sc-txt\">when, while, by the time, after, before nối hai việc trong quá khứ\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Tương lai\u003c/b>\u003cspan class=\"sc-txt\">Sau when, as soon as, until, by the time dùng hiện tại đơn, không dùng will\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k4\">\u003cb class=\"sc-term\">Thời gian\u003c/b>\u003cspan class=\"sc-txt\">It takes… to V · spend… V-ing · No sooner… than · Hardly… when\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Mỗi ngày học 5 cấu trúc, tự đặt 1 câu cho mỗi cấu trúc. Sau 8 ngày là thuộc đủ 40.\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-dong-tu-bat-quy-tac","menu":"dong-tu-bat-quy-tac","title":"Danh sách động từ bất quy tắc","html":"\u003cp class=\"lead\">70 động từ bất quy tắc thường gặp, chia thành 5 nhóm theo cách biến đổi. Học theo nhóm sẽ dễ nhớ hơn học từng từ riêng lẻ. Bấm nút loa ở cuối mỗi dòng để nghe đủ 3 dạng.\u003c/p>\u003cp>\u003cb>V1\u003c/b> là động từ nguyên mẫu, \u003cb>V2\u003c/b> dùng cho thì quá khứ đơn, \u003cb>V3\u003c/b> (quá khứ phân từ) dùng cho các thì hoàn thành và câu bị động.\u003c/p>\u003ch3>Nhóm 1: Ba dạng giống nhau\u003c/h3>\u003cp class=\"formula\">V1 = V2 = V3\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable class=\"say3\">\u003cthead>\u003ctr>\u003cth>V1\u003c/th>\u003cth>V2\u003c/th>\u003cth>V3\u003c/th>\u003cth>Nghĩa\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>cut\u003c/strong>\u003c/td>\u003ctd>cut\u003c/td>\u003ctd>cut\u003c/td>\u003ctd>cắt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>put\u003c/strong>\u003c/td>\u003ctd>put\u003c/td>\u003ctd>put\u003c/td>\u003ctd>đặt, để\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>hurt\u003c/strong>\u003c/td>\u003ctd>hurt\u003c/td>\u003ctd>hurt\u003c/td>\u003ctd>làm đau\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>hit\u003c/strong>\u003c/td>\u003ctd>hit\u003c/td>\u003ctd>hit\u003c/td>\u003ctd>đánh\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>let\u003c/strong>\u003c/td>\u003ctd>let\u003c/td>\u003ctd>let\u003c/td>\u003ctd>cho phép\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>shut\u003c/strong>\u003c/td>\u003ctd>shut\u003c/td>\u003ctd>shut\u003c/td>\u003ctd>đóng\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>set\u003c/strong>\u003c/td>\u003ctd>set\u003c/td>\u003ctd>set\u003c/td>\u003ctd>đặt, thiết lập\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>spread\u003c/strong>\u003c/td>\u003ctd>spread\u003c/td>\u003ct >\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>swear\u003c/strong>\u003c/td>\u003ctd>swore\u003c/td>\u003ctd>sworn\u003c/td>\u003ctd>thề\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"sc t5\">\u003cdiv class=\"sc-head\">\u003cspan class=\"sc-kick\">Thẻ ghi nhớ\u003c/span>\u003cp class=\"sc-title\">Cách học động từ bất quy tắc\u003c/p>\u003c/div>\u003cdiv class=\"sc-body\">\u003cdiv class=\"sc-grid c3\">\u003cdiv class=\"sc-cell k1\">\u003cb class=\"sc-term\">Học theo nhóm\u003c/b>\u003cspan class=\"sc-txt\">Mỗi nhóm có một kiểu biến đổi riêng, nhớ kiểu là nhớ cả nhóm.\u003c/span>\u003cspan class=\"sc-ex\">drink → drank → drunk\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k3\">\u003cb class=\"sc-term\">Đọc thành nhịp\u003c/b>\u003cspan class=\"sc-txt\">Đọc to 3 dạng liền nhau như một câu hát.\u003c/span>\u003cspan class=\"sc-ex\">go – went – gone\u003c/span>\u003c/div>\u003cdiv class=\"sc-cell k5\">\u003cb class=\"sc-term\">Đặt câu\u003c/b>\u003cspan class=\"sc-txt\">Mỗi động từ đặt 1 câu quá khứ đơn và 1 câu hiện tại hoàn thành.\u003c/span>\u003cspan class=\"sc-ex\">I \u003cb>wrote\u003c/b> a letter. I have \u003cb>written\u003c/b> it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"sc-tip\">Ôn lại bảng này sau 1 ngày, 3 ngày và 7 ngày để nhớ lâu.\u003c/p>\u003c/div>","order":0,"updated":"2026-10-26"},{"id":"bai-lien-tu-can-nho","menu":"lien-tu-can-nho","title":"Danh sách liên từ cần nắm vững","html":"\u003cp class=\"lead\">Danh sách liên từ thường dùng, xếp theo ý nghĩa. Liên từ giúp nối các ý trong câu cho mạch lạc; học theo nhóm nghĩa sẽ dễ chọn đúng từ khi nói và viết.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nhóm\u003c/th>\u003cth>Liên từ\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Thêm ý\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"fx\">and · both… and · not only… but also · as well as · in addition · moreover\u003c/span>\u003c/td>\u003ctd>I like apples \u003cb>and\u003c/b> bananas. She is \u003cb>not only\u003c/b> smart \u003cb>but also\u003c/b> kind.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Đối lập, nhượng bộ\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"fx\">but · yet · although / though · even though · however · while · whereas\u003c/span>\u003c/td>\u003ctd>\u003cb>Although\u003c/b> it was cold, we went swimming. He is rich, \u003cb>but\u003c/b> he is not happy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Lựa chọn\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"fx\">or · either… or · neither… nor · otherwise\u003c/span>\u003c/td>\u003ctd>You can have tea \u003cb>or\u003c/b> milk. \u003cb>Either\u003c/b> you call him \u003cb>or\u003c/b> I will.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Nguyên nhân\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"fx\">because · since · as · for\u003c/span>\u003c/td>\u003ctd>I stayed home \u003cb>because\u003c/b> I was sick.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Kết quả\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"fx\">so · therefore · so… that · such… that\u003c/span>\u003c/td>\u003ctd>It was raining, \u003cb>so\u003c/b> I took an umbrella. It was \u003cb>so\u003c/b> hot \u003cb>that\u003c/b> we went swimming.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Thời gian\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"fx\">when · while · before · after · as soon as · until · since\u003c/span>\u003c/td>\u003ctd>Call me \u003cb>as soon as\u003c/b> you arrive. Wait \u003cb>until\u003c/b> I come back.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Điều kiện\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"fx\">if · unless · as long as · in case\u003c/span>\u003c/td>\u003ctd>You can play \u003cb>as long as\u003c/b> you finish your homework. Take a coat \u003cb>in case\u003c/b> it gets cold.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Mục đích\u003c/strong>\u003c/td>\u003ctd>\u003cspan class=\"fx\">so that · in order that\u003c/span>\u003c/td>\u003ctd>Speak louder \u003cb>so that\u003c/b> everyone can hear you.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch3>Phân biệt nhanh\u003c/h3>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Cặp dễ nhầm\u003c/th>\u003cth>Cách dùng\u003c/th>\u003cth>Ví dụ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>because\u003c/strong> / \u003cstrong>because of\u003c/strong>\u003c/td>\u003ctd>because + mệnh đề (S + V); because of + danh từ\u003c/td>\u003ctd>We stayed home \u003cb>because\u003c/b> it rained. / \u003cb>because of\u003c/b> the rain.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>although\u003c/strong> / \u003cstrong>despite\u003c/strong>\u003c/td>\u003ctd>although + mệnh đề; despite / in spite of + danh từ hoặc V-ing\u003c/td>\u003ctd>\u003cb>Although\u003c/b> it rained, we went out. / \u003cb>Despite\u003c/b> the rain, we went out.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>but\u003c/strong> / \u003cstrong>however\u003c/strong>\u003c/td>\u003ctd>but nối hai vế trong một câu; however đứng đầu câu sau, theo sau là dấu phẩy\u003c/td>\u003ctd>It was late, \u003cb>but\u003c/b> he kept working. It was late. \u003cb>However\u003c/b>, he kept working.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>so\u003c/strong> / \u003cstrong>so that\u003c/strong>\u003c/td>\u003ctd>so chỉ kết quả; so that chỉ mục đích\u003c/td>\u003ctd>I was tired, \u003cb>so\u003c/b> I slept. I slept early \u003cb>so that\u003c/b> I could get up early.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>when\u003c/strong> / \u003cstrong>while\u003c/strong>\u003c/td>\u003ctd>when cho hành động ngắn hoặc thời điểm; while cho hành động đang kéo dài\u003c/td>\u003ctd>\u003cb>While\u003c/b> I was cooking, the phone rang. Call me \u003cb>when\u003c/b> you are free.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"sc t5\">\u003cdiv class=\"sc-head\">\u003c
