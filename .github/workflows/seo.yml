name: Đăng trang và cập nhật trang bài cho Google

on:
  push:
  schedule:
    - cron: '0 19 * * *'     # 2 giờ sáng giờ Việt Nam, mỗi ngày
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tạo trang bài, sitemap.xml, robots.txt
        run: python3 .github/seo_build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # Máy chủ GitHub đôi khi chưa kịp ghi nhận gói vừa tạo: đăng lỗi thì đợi rồi đăng lại (tối đa 3 lần)
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Đợi 30 giây rồi thử lại
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Đợi 60 giây rồi thử lần cuối
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 60
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
