name: Đăng trang và cập nhật trang bài cho Google

on:
  push:
  schedule:
    - cron: '0 19 * * *'     # 2 giờ sáng giờ Việt Nam, mỗi ngày
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tạo trang bài, sitemap.xml, robots.txt
        run: python3 .github/seo_build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
